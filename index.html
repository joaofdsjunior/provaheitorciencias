<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Português - P1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

        :root {
            --theme-color: #4f46e5;
            --theme-dark: #4338ca;
            --grey: #A3A3A3;
            --light-grey: #E3E3E3;
            --dark-grey: #545454;
            --success-color: #00B06F;
            --danger-color: #FF4F4F;
            --background-color: #F2F2F2;
            
            --btn-c1: #a5b4fc; 
            --btn-c2: #c4b5fd;
            --btn-c3: #f9a8d4;
            --btn-c4: #a7f3d0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #6366f1; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #818cf8; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #a78bfa; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f472b6; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #6ee7b7; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #008a58 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #cc3f3f !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }
        .question-statements { font-family: 'Poppins', sans-serif; text-align: left; margin: 0 auto 1rem auto; max-width: 90%; font-size: 1rem; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz de Português</h1>
            <p>Prepare-se para a P1! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Orações Subordinadas Substantivas (10)
            { question: "Na frase 'É fundamental que você estude', a oração 'que você estude' é classificada como:", answers: [{ text: "Objetiva Direta", correct: false }, { text: "Subjetiva", correct: true }, { text: "Completiva Nominal", correct: false }, { text: "Apositiva", correct: false }], explanation: "É Subjetiva. A dica é perguntar 'O que é fundamental?'. A resposta é a oração inteira ('que você estude'), que funciona como sujeito da oração principal." },
            { question: "Em 'Todos queriam que as férias começassem logo', a oração 'que as férias começassem logo' exerce a função de:", answers: [{ text: "Sujeito", correct: false }, { text: "Objeto Indireto", correct: false }, { text: "Objeto Direto", correct: true }, { text: "Predicativo", correct: false }], explanation: "É Objetiva Direta. Quem quer, quer algo. A oração inteira completa o sentido do verbo 'queriam', funcionando como objeto direto." },
            { question: "Qual a classificação da oração 'de que ele virá' na frase 'Tenho certeza de que ele virá'?", answers: [{ text: "Completiva Nominal", correct: true }, { text: "Objetiva Indireta", correct: false }, { text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: false }], explanation: "É Completiva Nominal. A oração completa o sentido do nome (substantivo) 'certeza'. Quem tem certeza, tem certeza DE algo." },
            { question: "Na oração 'Meu desejo é que todos sejam felizes', a parte 'que todos sejam felizes' é uma oração subordinada substantiva:", answers: [{ text: "Predicativa", correct: true }, { text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: false }, { text: "Apositiva", correct: false }], explanation: "É Predicativa. A oração funciona como predicativo do sujeito ('Meu desejo'), pois vem depois de um verbo de ligação ('é')." },
            { question: "Em 'Ninguém se esquece de que a honestidade é essencial', a oração 'de que a honestidade é essencial' é:", answers: [{ text: "Completiva Nominal", correct: false }, { text: "Objetiva Indireta", correct: true }, { text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: false }], explanation: "É Objetiva Indireta. Quem se esquece, se esquece DE algo. A oração completa o sentido do verbo 'esquece', que exige a preposição 'de'." },
            { question: "A frase 'Só tinha um objetivo: que a família ficasse unida' contém uma oração subordinada substantiva:", answers: [{ text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: false }, { text: "Apositiva", correct: true }, { text: "Predicativa", correct: false }], explanation: "É Apositiva. A oração ('que a família ficasse unida') explica o sentido de um nome ('objetivo'), geralmente vindo após dois-pontos." },
            { question: "Qual a função da oração 'que o projeto seria aprovado' em 'Todos tinham certeza de que o projeto seria aprovado'?", answers: [{ text: "Completa o sentido de um verbo.", correct: false }, { text: "Funciona como sujeito da frase.", correct: false }, { text: "Explica o sentido de um nome ('certeza').", correct: true }, { text: "Indica uma condição.", correct: false }], explanation: "A oração completa o sentido do substantivo 'certeza', sendo, portanto, uma Completiva Nominal." },
            { question: "Em 'O professor explicou que haverá prova amanhã', a oração 'que haverá prova amanhã' é:", answers: [{ text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: true }, { text: "Completiva Nominal", correct: false }, { text: "Apositiva", correct: false }], explanation: "É Objetiva Direta. A oração completa o sentido do verbo 'explicou' sem a necessidade de preposição (explicou O QUÊ?)." },
            { question: "A oração 'que ele consiga o emprego' em 'Tenho esperança de que ele consiga o emprego' é classificada como:", answers: [{ text: "Completiva Nominal", correct: true }, { text: "Objetiva Indireta", correct: false }, { text: "Subjetiva", correct: false }, { text: "Objetiva Direta", correct: false }], explanation: "É Completiva Nominal, pois completa o sentido do substantivo abstrato 'esperança' (esperança DE algo)." },
            { question: "Na frase 'É bom que os alunos façam os exercícios', a oração 'que os alunos façam os exercícios' funciona como:", answers: [{ text: "Objeto Direto", correct: false }, { text: "Predicativo", correct: false }, { text: "Sujeito", correct: true }, { text: "Aposto", correct: false }], explanation: "É Subjetiva. A oração inteira é o sujeito do verbo 'é'. Podemos inverter a frase: 'Que os alunos façam os exercícios é bom'." },

            // Figuras de Linguagem (8)
            { question: "A frase 'O sol e a lua observavam a cena em silêncio' apresenta qual figura de linguagem?", answers: [{ text: "Metáfora", correct: false }, { text: "Antítese", correct: false }, { text: "Personificação (Prosopopeia)", correct: true }, { text: "Hipérbole", correct: false }], explanation: "É Personificação, pois atribui características humanas (observar em silêncio) a seres inanimados (sol e lua)." },
            { question: "Em 'Ria e chorava ao mesmo tempo', encontramos um exemplo de:", answers: [{ text: "Metonímia", correct: false }, { text: "Antítese", correct: true }, { text: "Eufemismo", correct: false }, { text: "Ironia", correct: false }], explanation: "É uma Antítese, pois utiliza palavras de sentidos opostos (rir/chorar) na mesma frase para criar um contraste." },
            { question: "Na frase 'Comi dois pratos de macarrão', qual figura de linguagem foi usada?", answers: [{ text: "Hipérbole", correct: false }, { text: "Comparação", correct: false }, { text: "Metonímia", correct: true }, { text: "Metáfora", correct: false }], explanation: "É Metonímia. Você não comeu os pratos (o objeto), mas sim o conteúdo deles. Houve a troca do continente pelo conteúdo." },
            { question: "A expressão 'morri de rir' é um exemplo de:", answers: [{ text: "Hipérbole", correct: true }, { text: "Eufemismo", correct: false }, { text: "Ironia", correct: false }, { text: "Antítese", correct: false }], explanation: "É uma Hipérbole, pois representa um exagero intencional para dar mais ênfase à ideia de que algo foi muito engraçado." },
            { question: "Quando dizemos que alguém 'partiu desta para uma melhor', estamos usando qual figura de linguagem para suavizar a ideia de morte?", answers: [{ text: "Ironia", correct: false }, { text: "Eufemismo", correct: true }, { text: "Pleonasmo", correct: false }, { text: "Metáfora", correct: false }], explanation: "É um Eufemismo, recurso utilizado para suavizar uma expressão ou ideia considerada desagradável ou chocante." },
            { question: "Na frase 'A Câmara Municipal discutia o orçamento', a substituição de 'os vereadores' por 'A Câmara Municipal' é um caso de:", answers: [{ text: "Metáfora", correct: false }, { text: "Antítese", correct: false }, { text: "Metonímia", correct: true }, { text: "Personificação", correct: false }], explanation: "É uma Metonímia, pois troca a parte (os vereadores) pelo todo (a instituição que eles representam, a Câmara)." },
            { question: "A frase 'Amor é fogo que arde sem se ver' é um exemplo de:", answers: [{ text: "Comparação", correct: false }, { text: "Metáfora", correct: true }, { text: "Hipérbole", correct: false }, { text: "Antítese", correct: false }], explanation: "É uma Metáfora. Há uma comparação implícita, sem o uso de conectivos como 'tal qual' ou 'como', afirmando que o amor é fogo." },
            { question: "Em 'O tique-taque do relógio me deixava ansioso', a palavra 'tique-taque' representa qual figura de linguagem?", answers: [{ text: "Pleonasmo", correct: false }, { text: "Onomatopeia", correct: true }, { text: "Polissíndeto", correct: false }, { text: "Assonância", correct: false }], explanation: "É uma Onomatopeia, pois a palavra 'tique-taque' imita o som produzido pelo relógio." },

            // Modernismo no Brasil (5)
            { question: "Qual evento é considerado o marco inicial do Modernismo no Brasil?", answers: [{ text: "A Proclamação da República", correct: false }, { text: "A Semana de Arte Moderna de 1922", correct: true }, { text: "A publicação de 'Memórias Póstumas de Brás Cubas'", correct: false }, { text: "A Primeira Guerra Mundial", correct: false }], explanation: "A Semana de Arte Moderna, realizada em São Paulo em 1922, é o marco oficial do início do Modernismo, apresentando novas ideias na pintura, literatura e música." },
            { question: "Qual das seguintes NÃO é uma característica do Modernismo brasileiro?", answers: [{ text: "Busca por uma identidade nacional.", correct: false }, { text: "Uso de linguagem coloquial e popular.", correct: false }, { text: "Ruptura com as regras rígidas do Parnasianismo.", correct: false }, { text: "Imitação fiel dos modelos literários portugueses.", correct: true }], explanation: "O Modernismo fez exatamente o oposto: ele buscou romper com a imitação dos modelos europeus para criar uma arte genuinamente brasileira." },
            { question: "Mário de Andrade, Oswald de Andrade e Manuel Bandeira são nomes importantes de qual movimento literário?", answers: [{ text: "Romantismo", correct: false }, { text: "Barroco", correct: false }, { text: "Modernismo", correct: true }, { text: "Realismo", correct: false }], explanation: "Esses três autores são considerados os pilares da primeira fase do Modernismo no Brasil, atuando ativamente na Semana de 22 e na consolidação do movimento." },
            { question: "O verso livre (sem métrica fixa) e os versos brancos (sem rimas) são características de qual escola literária?", answers: [{ text: "Parnasianismo", correct: false }, { text: "Arcadismo", correct: false }, { text: "Simbolismo", correct: false }, { text: "Modernismo", correct: true }], explanation: "A liberdade formal, com o uso de versos livres e brancos, foi uma das principais bandeiras do Modernismo para romper com a rigidez das escolas anteriores, como o Parnasianismo." },
            { question: "A valorização de temas do cotidiano e do folclore brasileiro foi uma marca de qual movimento?", answers: [{ text: "Classicismo", correct: false }, { text: "Modernismo", correct: true }, { text: "Trovadorismo", correct: false }, { text: "Quinhentismo", correct: false }], explanation: "Em sua busca por uma identidade nacional, os modernistas se voltaram para a cultura popular, as lendas e o dia a dia do povo brasileiro como matéria-prima para sua arte." },

            // Variação Linguística (5)
            { question: "A diferença de sotaque entre um falante do Nordeste e um do Sul do Brasil é um exemplo de qual tipo de variação linguística?", answers: [{ text: "Histórica", correct: false }, { text: "Social", correct: false }, { text: "Regional (Geográfica)", correct: true }, { text: "Situacional", correct: false }], explanation: "É uma variação Regional, também chamada de diatópica, pois está relacionada ao lugar geográfico onde os falantes vivem." },
            { question: "O uso da gíria 'sextou' é mais comum em qual tipo de variação linguística?", answers: [{ text: "Variação de faixa etária (idade).", correct: true }, { text: "Variação histórica.", correct: false }, { text: "Variação de escolaridade.", correct: false }, { text: "Variação de gênero.", correct: false }], explanation: "Gírias como 'sextou' estão fortemente ligadas à variação por idade, sendo mais comuns entre os jovens." },
            { question: "Quando um médico usa termos técnicos numa consulta e depois 'traduz' para o paciente, ele está adaptando sua fala a qual tipo de variação?", answers: [{ text: "Regional", correct: false }, { text: "Histórica", correct: false }, { text: "Situacional (de contexto)", correct: true }, { text: "Social", correct: false }], explanation: "É uma variação Situacional (ou diafásica). A pessoa adapta sua linguagem (formal ou informal, técnica ou coloquial) de acordo com a situação de comunicação." },
            { question: "A palavra 'você' é uma forma reduzida de 'vossa mercê'. Essa mudança ao longo do tempo é um exemplo de variação:", answers: [{ text: "Social", correct: false }, { text: "Regional", correct: false }, { text: "Histórica", correct: true }, { text: "Situacional", correct: false }], explanation: "É uma variação Histórica, pois mostra como a língua se transforma com o passar do tempo." },
            { question: "A diferença no vocabulário usado por um advogado em um tribunal e um surfista na praia representa uma variação:", answers: [{ text: "Social (ligada a grupos/profissões)", correct: true }, { text: "Regional (geográfica)", correct: false }, { text: "Histórica", correct: false }, { text: "De idade", correct: false }], explanation: "É uma variação Social (ou diastrática), pois está ligada aos diferentes grupos sociais, como profissões, tribos urbanas, etc." },

            // Concordância Verbal com Porcentagem (6)
            { question: "Qual frase apresenta a concordância verbal CORRETA?", answers: [{ text: "1% dos alunos faltou à aula.", correct: true }, { text: "Apenas 1% das pessoas votaram.", correct: false }, { text: "Mais de 50% da turma preferiu o filme.", correct: false }, { text: "25% do orçamento foi gastos.", correct: false }], explanation: "Quando a porcentagem é 1 ou um número decimal menor que 2, o verbo fica no singular. '1% faltou' está correto. Em B, o correto seria 'votou'. Em C, 'preferiram'. Em D, 'foi gasto'." },
            { question: "Complete a frase: 'Descobriu-se que 20% dos entrevistados ______ o candidato.'", answers: [{ text: "apoia", correct: false }, { text: "apoiam", correct: true }, { text: "apoiava", correct: false }, { text: "apoiou", correct: false }], explanation: "O verbo deve concordar com o número da porcentagem (20%), que indica plural. Portanto, 'apoiam'." },
            { question: "Qual a concordância CORRETA para a frase: 'Cerca de 45% do eleitorado ainda ______ indeciso.'", answers: [{ text: "está", correct: false }, { text: "estão", correct: true }, { text: "esteve", correct: false }, { text: "estiveram", correct: false }], explanation: "O verbo deve concordar com o número (45%), que é plural. Portanto, 'estão'." },
            { question: "Em '1,9% da população não concordou com a lei', a concordância está:", answers: [{ text: "Correta, pois o número é menor que 2.", correct: true }, { text: "Incorreta, pois deveria ser 'concordaram'.", correct: false }], explanation: "A concordância está correta. Com números decimais entre 1 e 2, o verbo geralmente fica no singular." },
            { question: "Complete: 'Hoje, 1% dos alunos não ______ das aulas.'", answers: [{ text: "participou", correct: true }, { text: "participaram", correct: false }, { text: "participa", correct: false }, { text: "participarão", correct: false }], explanation: "Quando a porcentagem é 1%, o verbo fica no singular. Portanto, 'participou'." },
            { question: "Qual frase está INCORRETA?", answers: [{ text: "Mais de um aluno faltou.", correct: false }, { text: "60% da turma passou de ano.", correct: false }, { text: "Apenas 1% dos candidatos desistiu.", correct: false }, { text: "Calcula-se que 2% da população mudou de cidade.", correct: true }], explanation: "A frase D está incorreta. O verbo deveria concordar com '2%', que é plural. O correto seria 'mudaram de cidade'." },
            
            // Usos dos "Porquês" (6)
            { question: "Qual frase está usando o 'porquê' INCORRETAMENTE?", answers: [{ text: "Não sei por que ele não veio.", correct: false }, { text: "Ele não veio por quê?", correct: false }, { text: "Ele não veio, porque estava doente.", correct: false }, { text: "Gostaria de saber o porque da sua ausência.", correct: true }], explanation: "Na frase D, 'porque' é um substantivo (motivo), então deveria ser escrito junto e com acento: 'o porquê'." },
            { question: "Complete a frase: 'Estude bastante, ______ a prova será difícil.'", answers: [{ text: "por que", correct: false }, { text: "porque", correct: true }, { text: "por quê", correct: false }, { text: "porquê", correct: false }], explanation: "Usa-se 'porque' (junto e sem acento) para dar uma explicação ou indicar uma causa. Pode ser substituído por 'pois'." },
            { question: "Em qual alternativa o uso de 'por que' está correto?", answers: [{ text: "Não sei o por que de tudo isso.", correct: false }, { text: "A razão por que ele faltou é desconhecida.", correct: true }, { text: "Ele não veio, por que choveu.", correct: false }, { text: "Você está chorando por que?", correct: false }], explanation: "Na alternativa B, 'por que' pode ser substituído por 'pela qual' (A razão pela qual...), estando correto." },
            { question: "Qual o 'porquê' correto para a frase: 'Você não vai sair? ______?'", answers: [{ text: "Por que", correct: false }, { text: "Porque", correct: false }, { text: "Por quê", correct: true }, { text: "Porquê", correct: false }], explanation: "Usa-se 'Por quê' (separado e com acento) no final de uma frase interrogativa, antes do ponto de interrogação." },
            { question: "Complete: 'Não entendo o ______ de tanta reclamação.'", answers: [{ text: "por que", correct: false }, { text: "porque", correct: false }, { text: "por quê", correct: false }, { text: "porquê", correct: true }], explanation: "Nesse caso, a palavra é um substantivo que significa 'motivo' e vem acompanhada do artigo 'o'. Portanto, usa-se 'porquê'." },
            { question: "Qual frase deve ser completada com 'porque' (junto e sem acento)?", answers: [{ text: "______ você não foi à festa?", correct: false }, { text: "A rua ______ passamos estava interditada.", correct: false }, { text: "Não fui à festa ______ estava cansado.", correct: true }, { text: "Você está rindo de ______?", correct: false }], explanation: "A alternativa C apresenta uma explicação, uma causa para não ter ido à festa. Portanto, usa-se 'porque'." }
        ];

        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions];
            shuffleArray(questions);
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text; // Usar innerHTML para interpretar tags
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            // Garante que o clique seja no botão, mesmo que tenha tags dentro
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;

            const correct = selectedButton.dataset.correct === 'true';

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) button.classList.add('correct');
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
             if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Heitor de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
