<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interdisciplinar - 8º Ano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #ef4444;
            --theme-dark: #dc2626;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Fredoka One', cursive; 
            background-color: var(--background-color); 
            color: var(--dark-grey); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .container { 
            background-color: white; 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); 
            border: 5px solid var(--light-grey); 
            text-align: center; 
        }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.1rem; 
            padding: 15px 20px; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.1s ease-in-out; 
            margin: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        button:active { transform: translateY(4px); }
        .btn-primary { 
            background-color: var(--theme-color); 
            color: white; 
            border-bottom: 6px solid var(--theme-dark); 
        }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f87171; }
        input { 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 1.1rem; 
            padding: 15px; 
            border-radius: 12px; 
            border: 3px solid var(--light-grey); 
            margin-bottom: 15px; 
            width: 100%; 
        }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { 
            background: var(--light-grey); 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 15px; 
        }
        #quiz-screen #answers-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
        }
        #answers-container button { 
            width: 100%; 
            min-height: 60px; 
            color: var(--dark-grey); 
            border: none; 
            border-bottom-width: 6px; 
            border-bottom-style: solid; 
            text-transform: none; 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 0.9rem; 
            padding: 10px; 
        }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            text-align: center; 
            font-size: 1.2rem; 
            margin-top: 20px; 
            color: var(--dark-grey); 
            background-color: var(--light-grey); 
            padding: 10px; 
            border-radius: 15px; 
        }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { 
            min-height: 350px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { 
            font-family: 'Poppins', sans-serif; 
            font-size: 1.1rem; 
            font-weight: 600; 
            max-width: 90%; 
            margin-bottom: 25px; 
        }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { 
            margin-top: 2rem; 
            max-height: 60vh; 
            overflow-y: auto; 
            padding-right: 1rem; 
            text-align: left;
        }
        .review-item { 
            background-color: var(--light-grey); 
            border-radius: 12px; 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
        }
        .review-item h3 { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.2rem; 
            margin-bottom: 1rem; 
        }
        .review-item p { 
            font-family: 'Poppins', sans-serif; 
            margin-bottom: 0.5rem; 
            font-size: 0.9rem; 
        }
        .review-answer { 
            padding: 0.5rem; 
            border-radius: 8px; 
            margin-bottom: 0.25rem; 
        }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { 
            background-color: #ffedd5; 
            padding: 1rem; 
            margin-top: 1rem; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            border-left: 5px solid var(--theme-color); 
        }

        @keyframes correct-animation { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 
            100% { transform: scale(1); } 
        }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 
            0%, 100% { transform: translateX(0); } 
            20% { transform: translateX(-10px); } 
            40% { transform: translateX(10px); } 
            60% { transform: translateX(-10px); } 
            80% { transform: translateX(10px); } 
        }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1>Quiz Interdisciplinar</h1>
            <p>Preparação para as provas P2 e Institucionais do 8º ano! Cada resposta correta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar Prova!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Questão 1 / 10</div>
                <div id="score">Pontuação: 0</div>
                <div id="correct-answers">Corretas: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Questão</button>
        </div>

        <div id="results-screen">
            <h1>Prova Finalizada!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final é:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Refazer Prova</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        // Array com 10 perguntas focadas nos tópicos das provas
        const allQuestions = [
            {
                question: "Qual era a principal justificativa ideológica do Imperialismo europeu no século XIX?",
                answers: [
                    { text: "A 'Missão Civilizadora' de levar progresso a povos 'atrasados'", correct: true },
                    { text: "A necessidade de espalhar a democracia pelo mundo", correct: false },
                    { text: "O desejo de acabar com a escravidão", correct: false },
                    { text: "A busca por liberdade religiosa", correct: false }
                ],
                explanation: "Os europeus defendiam que sua dominação era uma 'missão' para levar a 'civilização' a povos considerados 'atrasados', justificando assim a exploração."
            },
            {
                question: "Complete a frase em inglês: 'This pen is ____' (significando que a caneta pertence a mim)",
                answers: [
                    { text: "mine", correct: true },
                    { text: "my", correct: false },
                    { text: "me", correct: false },
                    { text: "I", correct: false }
                ],
                explanation: "'Mine' é o pronome possessivo que substitui 'my pen', indicando posse sem repetir o substantivo."
            },
            {
                question: "Qual destas formações vegetais é caracterizada por musgos e liquens em clima polar?",
                answers: [
                    { text: "Tundra", correct: true },
                    { text: "Taiga", correct: false },
                    { text: "Savana", correct: false },
                    { text: "Floresta Tropical", correct: false }
                ],
                explanation: "A Tundra é composta por musgos e liquens, associada ao clima polar, e aparece em um curto período de verão no extremo norte do continente."
            },
            {
                question: "Qual a diferença principal entre FATO e OPINIÃO?",
                answers: [
                    { text: "Fato é comprovável; opinião é julgamento pessoal", correct: true },
                    { text: "Fato é sempre verdadeiro; opinião é sempre falsa", correct: false },
                    { text: "Fato é científico; opinião é religiosa", correct: false },
                    { text: "Fato é moderno; opinião é antiga", correct: false }
                ],
                explanation: "Fato é uma informação objetiva, imparcial e comprovável. Opinião é um julgamento pessoal, subjetivo, baseado em experiências e valores."
            },
            {
                question: "Qual destes hormônios é produzido pelo pâncreas e reduz o nível de glicose no sangue?",
                answers: [
                    { text: "Insulina", correct: true },
                    { text: "Adrenalina", correct: false },
                    { text: "Cortisol", correct: false },
                    { text: "Glucagon", correct: false }
                ],
                explanation: "A insulina é liberada quando o nível de glicose no sangue aumenta e ajuda as células a absorverem a glicose, reduzindo o açúcar no sangue."
            },
            {
                question: "Qual a diferença entre percepção OBJETIVA e SUBJETIVA na arte?",
                answers: [
                    { text: "Objetiva foca na forma; subjetiva na interpretação", correct: true },
                    { text: "Objetiva é científica; subjetiva é emocional", correct: false },
                    { text: "Objetiva é antiga; subjetiva é moderna", correct: false },
                    { text: "Objetiva é realista; subjetiva é abstrata", correct: false }
                ],
                explanation: "Percepção objetiva foca na exterioridade e aspectos formais da obra. Percepção subjetiva foca na interioridade, aspectos sensíveis, emocionais e interpretação pessoal."
            },
            {
                question: "Em programação, o que uma estrutura de repetição (loop) permite fazer?",
                answers: [
                    { text: "Executar o mesmo código várias vezes", correct: true },
                    { text: "Armazenar diferentes tipos de dados", correct: false },
                    { text: "Conectar-se à internet", correct: false },
                    { text: "Criar interfaces gráficas", correct: false }
                ],
                explanation: "Estruturas de repetição (loops) são comandos usados para realizar a mesma tarefa várias vezes sem precisar reescrever o código."
            },
            {
                question: "Quando duas grandezas são INVERSAMENTE PROPORCIONAIS?",
                answers: [
                    { text: "Quando uma aumenta e a outra diminui na mesma proporção", correct: true },
                    { text: "Quando as duas aumentam juntas", correct: false },
                    { text: "Quando não há relação entre elas", correct: false },
                    { text: "Quando ambas são constantes", correct: false }
                ],
                explanation: "Grandezas inversamente proporcionais: quando uma aumenta, a outra diminui na mesma proporção. Exemplo: velocidade e tempo para percorrer uma distância fixa."
            },
            {
                question: "No problema do garçom da OBI, se em uma bandeja há 8 latas e 5 copos, o que acontece?",
                answers: [
                    { text: "Todos os 5 copos são quebrados", correct: true },
                    { text: "Nenhum copo é quebrado", correct: false },
                    { text: "Apenas 3 copos são quebrados", correct: false },
                    { text: "As latas são derrubadas", correct: false }
                ],
                explanation: "Quando o número de latas é maior que o número de copos (8 > 5), o garçom se atrapalha e quebra todos os copos daquela bandeja."
            },
            {
                question: "O que caracteriza o diabetes tipo 1?",
                answers: [
                    { text: "O corpo não produz insulina suficiente", correct: true },
                    { text: "O corpo desenvolve resistência à insulina", correct: false },
                    { text: "É causado apenas por obesidade", correct: false },
                    { text: "Acontece apenas em adultos", correct: false }
                ],
                explanation: "No diabetes tipo 1, o corpo não produz insulina suficiente devido a uma doença autoimune que destrói as células do pâncreas produtoras de insulina."
            }
        ];

        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        
        // Variáveis do jogo
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let playerName = "";

        // Elementos da interface
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            results: document.getElementById('results-screen'),
            explanation: document.getElementById('explanation-screen'),
            review: document.getElementById('review-screen')
        };
        
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        const seeExplanationBtn = document.getElementById('see-explanation-btn');

        // Funções principais
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.style.display = 'none');
            screens[screenName].style.display = 'block';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            playerName = playerNameInput.value.trim() || "Estudante";
            if (playerName === "") {
                alert("Por favor, digite seu nome!");
                return;
            }
            
            questions = [...allQuestions];
            shuffleArray(questions);
            
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            
            scoreText.innerText = `Pontuação: 0`;
            correctAnswersText.innerText = `Corretas: 0`;
            
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }
            
            const currentQuestion = questions[currentQuestionIndex];
            progressText.innerText = `Questão ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.innerHTML = currentQuestion.question;
            
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() {
            seeExplanationBtn.style.display = 'none';
            questionText.innerHTML = '';
            while (answersContainer.firstChild) {
                answersContainer.removeChild(answersContainer.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedButton = e.target;
            const correct = selectedButton.dataset.correct === 'true';
            const currentQuestion = questions[currentQuestionIndex];
            
            // Registrar resposta do usuário
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: currentQuestion.answers.find(ans => ans.correct).text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            // Atualizar pontuação
            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontuação: ${score}`;
                correctAnswersText.innerText = `Corretas: ${correctAnswersCount}`;
                selectedButton.classList.add('correct', 'correct-animation');
            } else {
                selectedButton.classList.add('incorrect', 'incorrect-animation');
            }
            
            // Mostrar respostas corretas
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true') {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            // Mostrar botão de explicação
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            const currentQuestion = questions[currentQuestionIndex];
            showScreen('explanation');
            
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = currentQuestion.explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = totalQuestions > 0 ? (correctAnswersCount / totalQuestions) * 100 : 0;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            // Definir prêmio baseado na porcentagem
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    let indicator = '';
                    
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                        indicator = answerData.wasCorrect ? ' ✅' : ' ❌';
                    }
                    
                    answersHtml += `<p class="${classList}">${ans.text}${indicator}</p>`;
                });

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
            playerNameInput.focus();
        }

        // Configurar eventos após carregamento da página
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar botão de revisão
            reviewBtn.addEventListener('click', showReview);
            
            // Permitir iniciar com Enter
            playerNameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    startGame();
                }
            });
            
            // Focar no campo de nome
            playerNameInput.focus();
        });
    </script>
</body>
</html>
