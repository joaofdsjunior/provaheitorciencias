<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Histórica do Heitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-green: #4ade80;
            --pixel-blue: #3b82f6;
            --pixel-red: #ef4444;
            --pixel-brown: #78350f;
            --pixel-yellow: #facc15;
            --pixel-bg: #111827;
        }

        body {
            background-color: var(--pixel-bg);
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #game-container {
            width: 900px;
            background-color: #1f2937;
            border: 6px solid #4b5563;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            padding: 20px;
        }

        /* --- DISPLAY DE HP --- */
        .battle-area {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #1e3a8a, #111827);
            padding: 40px 20px;
            border: 4px solid #374151;
        }

        .character-stats {
            width: 300px;
        }

        .hp-bar-container {
            width: 100%;
            height: 25px;
            background: #444;
            border: 3px solid #fff;
            margin-top: 10px;
        }

        .hp-fill {
            height: 100%;
            background: var(--pixel-green);
            width: 100%;
            transition: width 0.3s ease-out;
        }

        .hp-text {
            font-size: 10px;
            margin-top: 5px;
            text-align: right;
        }

        .name-label {
            font-size: 12px;
            text-transform: uppercase;
        }

        /* --- INTERFACE DE PERGUNTAS --- */
        #question-box {
            background: #f3f4f6;
            color: #111;
            padding: 25px;
            border-radius: 4px;
            min-height: 250px;
        }

        #question-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            padding: 12px;
            cursor: pointer;
            border: 3px solid var(--pixel-brown);
            background: #e5e7eb;
            transition: all 0.1s;
        }

        button:hover {
            background: var(--pixel-yellow);
            transform: translateY(-2px);
        }

        .btn-hint {
            background: var(--pixel-blue);
            color: white;
            margin-top: 20px;
            width: 100%;
        }

        /* --- OVERLAYS --- */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .hidden { display: none !important; }

        .trophy-display {
            font-size: 24px;
            margin: 20px 0;
            color: var(--pixel-yellow);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="battle-area">
        <div class="character-stats">
            <div class="name-label">HEITOR</div>
            <div class="hp-bar-container">
                <div id="player-hp-bar" class="hp-fill"></div>
            </div>
            <div class="hp-text"><span id="player-hp-val">400</span>/400 HP</div>
        </div>

        <div style="font-size: 20px; color: var(--pixel-red); align-self: center;">VS</div>

        <div class="character-stats">
            <div class="name-label" style="text-align: right;">SISTEMA OLIGÁRQUICO</div>
            <div class="hp-bar-container">
                <div id="enemy-hp-bar" class="hp-fill" style="background: var(--pixel-red);"></div>
            </div>
            <div class="hp-text" style="text-align: left;"><span id="enemy-hp-val">400</span>/400 HP</div>
        </div>
    </div>

    <div id="question-box">
        <div id="question-text">Preparando o campo de batalha...</div>
        <div id="options" class="options-grid"></div>
        <button id="hint-trigger" class="btn-hint" onclick="activateHint()">PEDIR DICA (CUSTA DANO E PONTOS)</button>
    </div>

    <div id="overlay">
        <h1 id="overlay-title">DESAFIO DO HEITOR</h1>
        <p id="overlay-msg">40 Perguntas. Uma República em jogo.</p>
        <button onclick="initGame()" style="font-size: 16px; padding: 20px;">INICIAR BATALHA</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Qual foi o período exato do Segundo Reinado sob D. Pedro II?", options: ["1822-1831", "1831-1840", "1840-1889", "1889-1930"], correct: 2, hint: "Foi o reinado mais longo do Brasil independente." },
        { q: "O Brasil foi o último país da América a abolir a escravidão. Quantos anos durou esse regime?", options: ["100 anos", "337 anos", "400 anos", "250 anos"], correct: 1, hint: "Mais de três séculos de maus tratos." },
        { q: "Qual lei de 1850 proibiu o tráfico negreiro no Brasil?", options: ["Lei Áurea", "Lei do Ventre Livre", "Lei Eusébio de Queirós", "Lei dos Sexagenários"], correct: 2, hint: "Pressionada pela Inglaterra para abrir mercado consumidor." },
        { q: "Por que a elite agrária retirou o apoio a D. Pedro II após 1888?", options: ["Queriam a República", "Falta de indenização pela Lei Áurea", "Aumento de impostos", "Guerra do Paraguai"], correct: 1, hint: "A elite viu a libertação como 'ruína de patrimônio'." },
        { q: "Quem assinou a Lei Áurea em 13 de maio de 1888?", options: ["D. Pedro II", "Princesa Isabel", "Marechal Deodoro", "Joaquim Nabuco"], correct: 1, hint: "Conhecida como 'A Redentora'." },
        { q: "O que previa a Lei do Ventre Livre (1871)?", options: ["Liberdade aos sexagenários", "Fim do tráfico", "Liberdade aos filhos de mulheres escravizadas", "Indenização imediata"], correct: 2, hint: "Uma lei de impulso, mas pouco sólida na época." },
        { q: "Qual o principal produto de exportação que garantia estabilidade ao Império?", options: ["Cana-de-açúcar", "Ouro", "Café", "Borracha"], correct: 2, hint: "Sua exportação financiou ferrovias e urbanização." },
        { q: "Qual evento fortaleceu o Exército e o fez buscar maior protagonismo político?", options: ["Revolução Farroupilha", "Guerra do Paraguai", "Proclamação da República", "Guerra de Canudos"], correct: 1, hint: "Ocorreu entre 1864 e 1870." },
        { q: "O 'Padroado' significava que:", options: ["O Exército mandava na Igreja", "A Igreja era subordinada ao Estado", "O Papa mandava no Imperador", "A maçonaria era proibida"], correct: 1, hint: "Causou a Questão Religiosa quando o Imperador anulou bulas papais." },
        { q: "Quem proclamou a República em 15 de novembro de 1889?", options: ["Benjamin Constant", "Floriano Peixoto", "Marechal Deodoro da Fonseca", "Prudente de Moraes"], correct: 2, hint: "Marchou com as tropas para o Ministério da Guerra." },
        { q: "Como o povo participou da Proclamação da República?", options: ["Votando em massa", "Através de grandes revoltas", "Assistiu 'bestializado', sem entender", "Com apoio da Igreja"], correct: 2, hint: "Houve ausência de participação popular efetiva." },
        { q: "A 'República da Espada' (1889-1894) recebeu esse nome porque:", options: ["Era o nome de um partido", "Os presidentes eram militares", "Houve muitas guerras civis", "A economia era baseada no ferro"], correct: 1, hint: "Refere-se a Deodoro e Floriano Peixoto." },
        { q: "O que define o 'Federalismo' na Constituição de 1891?", options: ["Poder total do Presidente", "Maior autonomia para os Estados", "Fim da separação de poderes", "Religião católica oficial"], correct: 1, hint: "As antigas províncias ganharam poder próprio." },
        { q: "Na Revolução Federalista (RS), quem eram os Maragatos?", options: ["Defensores do governador", "Usavam lenço branco", "Desejavam o parlamentarismo", "Apoiados pelo Exército"], correct: 2, hint: "Usavam lenço vermelho e eram rivais dos Chimangos." },
        { q: "O domínio político exercido por famílias latifundiárias é o:", options: ["Democracia", "Oligarquia", "Socialismo", "Anarquismo"], correct: 1, hint: "Poder de poucos baseado na posse de terra." },
        { q: "O 'Voto de Cabresto' era caracterizado pelo:", options: ["Voto secreto", "Voto aberto e pressão do coronel", "Voto apenas para mulheres", "Fim das eleições"], correct: 1, hint: "Troca de favores ou ameaças garantiam o voto." },
        { q: "A 'Política do Café com Leite' envolvia o revezamento entre:", options: ["RJ e SP", "RS e MG", "SP e MG", "BA e PE"], correct: 2, hint: "Os dois estados mais influentes da época." },
        { q: "Qual era a função da 'Comissão de Verificação de Poderes'?", options: ["Contar votos honestamente", "Garantir a vitória da oposição", "Não reconhecer a vitória de opositores", "Cuidar da saúde pública"], correct: 2, hint: "Instrumento da Política dos Governadores." },
        { q: "Antônio Conselheiro liderou qual movimento messiânico?", options: ["Cangaço", "Guerra do Contestado", "Guerra de Canudos", "Revolta da Vacina"], correct: 2, hint: "Fundou o povoado de Belo Monte (BA)." },
        { q: "Qual autor imortalizou Canudos no livro 'Os Sertões'?", options: ["Machado de Assis", "Euclides da Cunha", "Aluísio Azevedo", "Tarsila do Amaral"], correct: 1, hint: "Foi correspondente do jornal O Estado de S. Paulo." },
        { q: "A Guerra do Contestado ocorreu em uma região disputada por:", options: ["Brasil e Paraguai", "SP e MG", "Paraná e Santa Catarina", "Bahia e Sergipe"], correct: 2, hint: "Região rica em erva-mate e madeira." },
        { q: "O Padre Cícero tornou-se prefeito de qual cidade em 1911?", options: ["Fortaleza", "Crato", "Juazeiro do Norte", "Canudos"], correct: 2, hint: "Tornou-se santo popular do Nordeste." },
        { q: "Lampião e Maria Bonita são figuras icônicas do:", options: ["Modernismo", "Cangaço", "Republicanismo", "Federalismo"], correct: 1, hint: "Banditismo social no interior do Nordeste." },
        { q: "O principal motivo da vinda dos imigrantes italianos foi:", options: ["Turismo", "Trabalho nas indústrias modernas", "Substituição da mão de obra escrava", "Fugir do frio"], correct: 2, hint: "Impulsionado pela Lei Eusébio de Queirós." },
        { q: "O 'Sistema de Parceria' com imigrantes gerava:", options: ["Riqueza imediata ao colono", "Endividamento e aprisionamento", "Dono da própria terra", "Aposentadoria precoce"], correct: 1, hint: "O fazendeiro emprestava o dinheiro da viagem." },
        { q: "O navio Kasato Maru (1908) marcou o início da imigração:", options: ["Alemã", "Italiana", "Japonesa", "Síria"], correct: 2, hint: "Desembarcou no Porto de Santos." },
        { q: "A Greve Geral de 1917 em São Paulo lutava contra:", options: ["A monarquia", "O café com leite", "Condições insalubres nas fábricas", "A vacinação obrigatória"], correct: 2, hint: "Iniciada em uma fábrica de tecidos da Mooca." },
        { q: "A reforma 'Bota Abaixo' no Rio de Janeiro foi liderada por:", options: ["Oswaldo Cruz", "Pereira Passos", "João Cândido", "Rodrigues Alves"], correct: 1, hint: "Prefeito que queria modernizar o Rio." },
        { q: "A primeira favela carioca, no Morro da Providência, foi ocupada por:", options: ["Imigrantes italianos", "Barões do café", "Ex-combatentes de Canudos", "Marinheiros revoltosos"], correct: 2, hint: "Favela é o nome de um arbusto da região da guerra." },
        { q: "A Revolta da Vacina (1904) foi causada por:", options: ["Falta de vacinas", "Obrigatoriedade e desinformação", "Apoio ao Imperador", "Preço alto do remédio"], correct: 1, hint: "Programa de erradicação da varíola por Oswaldo Cruz." },
        { q: "João Cândido, o 'Almirante Negro', liderou a:", options: ["Revolta da Armada", "Guerra de Canudos", "Revolta da Chibata", "Guerra do Contestado"], correct: 2, hint: "Contra os castigos físicos na Marinha." },
        { q: "O Ciclo da Borracha desenvolveu principalmente as cidades de:", options: ["SP e Rio", "Recife e Salvador", "Manaus e Belém", "Curitiba e Porto Alegre"], correct: 2, hint: "Impulsionado pela indústria automobilística." },
        { q: "A Semana de Arte Moderna de 1922 ocorreu no:", options: ["Teatro Municipal do Rio", "Teatro Municipal de SP", "Palácio Imperial", "Porto de Santos"], correct: 1, hint: "Comemoração do centenário de independência." },
        { q: "O 'Grupo dos Cinco' incluía Tarsila do Amaral e:", options: ["Machado de Assis", "Anita Malfatti", "D. Pedro II", "Padre Cícero"], correct: 1, hint: "Mário, Oswald, Menotti e Anita." },
        { q: "O conceito de 'Antropofagia' no Modernismo significava:", options: ["Proibir arte gringa", "Deglutir influências externas para criar algo nacional", "Voltar à cultura indígena pura", "Comer carne humana"], correct: 1, hint: "Nascido do quadro Abaporu." },
        { q: "Qual a consequência do fim da escravidão sem auxílio do governo?", options: ["Todos ganharam terras", "Surgimento dos 'meninos de rua'", "Volta imediata para África", "Fim da produção agrícola"], correct: 1, hint: "Expressa na charge: 'Vai ser menino de rua'." },
        { q: "A 'Questão Militar' após 1870 envolvia o Exército querendo:", options: ["Sair da política", "Mais poder e prestígio", "Voltar a ser colônia", "Apoiar a Igreja"], correct: 1, hint: "Buscavam maior protagonismo na política brasileira." },
        { q: "O Coronelismo baseava-se na troca de favores entre o Coronel e o:", options: ["Eleitor", "Imperador", "Papa", "Imigrante"], correct: 0, hint: "Garantia a manutenção das oligarquias." },
        { q: "Na Belle Époque brasileira, as cidades tentavam imitar:", options: ["Nova York", "Lisboa", "Paris", "Roma"], correct: 2, hint: "Reformas urbanas e novos hábitos europeus." },
        { q: "Quem foi o médico higienista odiado na Revolta da Vacina?", options: ["Carlos Chagas", "Oswaldo Cruz", "Adolfo Lutz", "Vital Brazil"], correct: 1, hint: "Diretor-Geral de Saúde Pública em 1903." }
    ];

    let current = 0;
    let pHP = 400;
    let eHP = 400;
    let score = 0;
    let hintUsed = false;

    function initGame() {
        document.getElementById('overlay').classList.add('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        if (current >= questions.length || eHP <= 0 || pHP <= 0) return finish();
        
        hintUsed = false;
        const q = questions[current];
        document.getElementById('question-text').innerText = (current + 1) + ". " + q.q;
        
        const optDiv = document.getElementById('options');
        optDiv.innerHTML = "";
        q.options.forEach((o, i) => {
            const b = document.createElement('button');
            b.innerText = o;
            b.onclick = () => answer(i);
            optDiv.appendChild(b);
        });
        document.getElementById('hint-trigger').innerText = "PEDIR DICA (CUSTA DANO E PONTOS)";
    }

    function activateHint() {
        if (hintUsed) return;
        hintUsed = true;
        alert("💡 DICA: " + questions[current].hint);
        document.getElementById('hint-trigger').innerText = "DICA JÁ UTILIZADA";
    }

    function answer(idx) {
        const q = questions[current];
        if (idx === q.correct) {
            const gain = hintUsed ? 5 : 10;
            score += gain;
            eHP -= 10;
            alert("CERTO! Dano causado ao sistema.");
        } else {
            score -= 5;
            pHP -= 10;
            alert("ERRO! O sistema te atingiu.");
        }
        current++;
        updateStats();
        renderQuestion();
    }

    function updateStats() {
        document.getElementById('player-hp-val').innerText = pHP;
        document.getElementById('enemy-hp-val').innerText = eHP;
        document.getElementById('player-hp-bar').style.width = (pHP / 400 * 100) + "%";
        document.getElementById('enemy-hp-bar').style.width = (eHP / 400 * 100) + "%";
    }

    function finish() {
        const nota = Math.max(0, (score / 400) * 10).toFixed(2);
        let trophy = "";
        let msg = "";

        if (nota > 9.55) {
            trophy = "🏆 OURO";
            msg = "Heitor Economista Tecnológico 2027!";
        } else if (nota >= 8) {
            trophy = "🥈 PRATA";
            msg = "Rei dos Romildos - Tá levando pau mas é bom no que faz.";
        } else if (nota >= 5) {
            trophy = "🥉 BRONZE";
            msg = "Pai da Renata - Sub emprego, ganhando 1500 reais.";
        } else {
            trophy = "🤡";
            msg = "Véi.. porque?";
        }

        const overlay = document.getElementById('overlay');
        overlay.innerHTML = `
            <h1>RESULTADO FINAL</h1>
            <div class="trophy-display">${trophy}</div>
            <p style="font-size: 14px;">${msg}</p>
            <div style="margin: 20px 0; font-size: 20px;">NOTA: ${nota}</div>
            <p>Score: ${score} / 400 pts</p>
            <button onclick="location.reload()" style="margin-top: 20px;">RECOMEÇAR</button>
        `;
        overlay.classList.remove('hidden');
    }
</script>
</body>
</html>
