<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de História - Rodada 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #8b5cf6; /* Roxo */
            --theme-dark: #7c3aed;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #a78bfa; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #e0e7ff; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz de História - Rodada 2</h1>
            <p>Novas perguntas sobre o Segundo Reinado! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Novas perguntas de Política
            { question: "Qual era a principal diferença entre as propostas dos Liberais e dos Conservadores no Segundo Reinado?", answers: [{ text: "Liberais queriam a República e Conservadores a Monarquia.", correct: false }, { text: "Liberais defendiam mais autonomia para as províncias, enquanto Conservadores queriam um poder mais centralizado no Rio de Janeiro.", correct: true }, { text: "Conservadores queriam o fim da escravidão e Liberais não.", correct: false }, { text: "Não havia nenhuma diferença real entre eles.", correct: false }], explanation: "A principal diferença teórica era o grau de centralização do poder. Liberais defendiam o federalismo (mais poder para as províncias) e Conservadores, o centralismo (mais poder para o imperador)." },
            { question: "O sistema político do Segundo Reinado alternava o poder entre Liberais e Conservadores. Quem decidia qual partido iria governar?", answers: [{ text: "O povo, através de eleições diretas.", correct: false }, { text: "O exército, através de intervenções.", correct: false }, { text: "O Imperador, usando o Poder Moderador.", correct: true }, { text: "O partido que tivesse mais deputados eleitos.", correct: false }], explanation: "Era o Imperador quem, usando seu Poder Moderador, escolhia o Presidente do Conselho de Ministros (Primeiro-Ministro), forçando a formação de um gabinete do partido de sua preferência." },
            { question: "Além da insatisfação política, a Revolução Praieira também tinha uma forte crítica a qual grupo em Pernambuco?", answers: [{ text: "Aos grandes comerciantes portugueses que controlavam a economia local.", correct: true }, { text: "Aos trabalhadores escravizados.", correct: false }, { text: "Aos imigrantes italianos.", correct: false }, { text: "Aos militares do exército imperial.", correct: false }], explanation: "Um dos estopins da revolta foi o ressentimento contra o grande poder econômico e político exercido por um pequeno grupo de comerciantes, em sua maioria portugueses, no Recife." },
            { question: "O 'Parlamentarismo às Avessas' foi uma forma de garantir qual objetivo de D. Pedro II?", answers: [{ text: "Dar mais poder ao povo.", correct: false }, { text: "Manter a estabilidade política do Império, controlando as disputas entre as elites.", correct: true }, { text: "Preparar o Brasil para se tornar uma República.", correct: false }, { text: "Acabar com a corrupção no governo.", correct: false }], explanation: "Ao controlar a nomeação e a demissão dos gabinetes, o Imperador conseguia mediar e equilibrar os interesses dos partidos da elite, garantindo uma longa estabilidade política para o seu governo." },

            // Novas perguntas de Economia e Café
            { question: "O que era a 'terra roxa', tão importante para a expansão do café no Oeste Paulista?", answers: [{ text: "Um tipo de argila usada para fazer tijolos.", correct: false }, { text: "Um solo de origem vulcânica, extremamente fértil e ideal para o cultivo do café.", correct: true }, { text: "Uma praga que atacava os cafezais.", correct: false }, { text: "Uma técnica de adubação importada da Europa.", correct: false }], explanation: "A terra roxa (que na verdade é avermelhada) era um solo muito rico em nutrientes, o que permitiu uma produtividade muito maior nos cafezais do Oeste Paulista em comparação com o Vale do Paraíba." },
            { question: "Qual destes produtos NÃO foi uma importante exportação do Brasil durante o Segundo Reinado, além do café?", answers: [{ text: "Açúcar", correct: false }, { text: "Algodão", correct: false }, { text: "Borracha", correct: false }, { text: "Soja", correct: true }], explanation: "A soja só se tornou um grande produto de exportação do Brasil no século XX. No Segundo Reinado, além do café, o açúcar, o algodão e, no final do período, a borracha, foram importantes." },
            { question: "A decadência do café no Vale do Paraíba foi causada principalmente por qual motivo?", answers: [{ text: "Pela abolição da escravatura.", correct: false }, { text: "Pelo esgotamento do solo, causado por técnicas de plantio inadequadas (queimadas).", correct: true }, { text: "Pela concorrência com o café colombiano.", correct: false }, { text: "Pela construção das ferrovias no Oeste Paulista.", correct: false }], explanation: "As técnicas predatórias de cultivo, que não se preocupavam com a conservação do solo, levaram ao rápido esgotamento das terras do Vale do Paraíba, tornando a produção cada vez menos lucrativa." },
            { question: "A Lei Eusébio de Queirós, de 1850, que proibiu o tráfico de escravos, teve qual consequência para os cafeicultores?", answers: [{ text: "Eles imediatamente libertaram todos os seus escravos.", correct: false }, { text: "Eles passaram a investir no tráfico interno de escravos (comprando do Nordeste) e a buscar a imigração.", correct: true }, { text: "Eles pararam de produzir café.", correct: false }, { text: "A lei não foi obedecida e o tráfico continuou normalmente.", correct: false }], explanation: "Com o fim da principal fonte de mão de obra, os cafeicultores se voltaram para o comércio de escravos entre as províncias e, ao mesmo tempo, começaram a pressionar o governo por soluções, como a vinda de imigrantes." },

            // Novas perguntas de Imigração
            { question: "Qual foi a consequência da Lei de Terras de 1850 para os imigrantes que chegavam ao Brasil?", answers: [{ text: "Eles recebiam terras gratuitas do governo para começar a vida.", correct: false }, { text: "Dificultou muito que eles se tornassem proprietários, forçando-os a trabalhar para os grandes fazendeiros.", correct: true }, { text: "Garantiu que todo imigrante teria um emprego na cidade.", correct: false }, { text: "Proibiu a entrada de imigrantes no país.", correct: false }], explanation: "Ao definir que a terra só poderia ser adquirida por compra, a lei criou uma barreira para os imigrantes pobres, que não tinham dinheiro para se tornarem donos de suas próprias terras." },
            { question: "O sistema de 'colonato', que substituiu o de 'parceria' em São Paulo, funcionava de que forma?", answers: [{ text: "O imigrante era dono de toda a produção.", correct: false }, { text: "O imigrante recebia um salário fixo e uma porcentagem da colheita, além de um pedaço de terra para cultivar para si.", correct: true }, { text: "O imigrante trabalhava de graça em troca de moradia.", correct: false }, { text: "Era a mesma coisa que a escravidão.", correct: false }], explanation: "O colonato era um sistema mais flexível que a parceria. O colono recebia um pagamento pelo trabalho no cafezal e ainda podia cultivar alimentos para seu sustento e venda, o que atraiu mais imigrantes." },
            { question: "As pinturas de artistas como Victor Meirelles, que retratavam a 'Primeira Missa no Brasil', tinham qual objetivo político no Segundo Reinado?", answers: [{ text: "Mostrar a história como ela realmente aconteceu.", correct: false }, { text: "Criticar a monarquia e a Igreja.", correct: false }, { text: "Criar uma identidade nacional para o Brasil, mostrando a união harmoniosa entre portugueses e indígenas sob a benção da Coroa.", correct: true }, { text: "Incentivar a conversão dos indígenas ao catolicismo.", correct: false }], explanation: "Essas obras faziam parte de um projeto do Império para construir uma história oficial e uma identidade para o Brasil. Elas idealizavam o passado, mostrando uma união pacífica que nem sempre existiu." },
            { question: "A política imigratória do Segundo Reinado foi bem-sucedida em criar uma sociedade racialmente igualitária?", answers: [{ text: "Sim, os imigrantes e os negros libertos foram tratados com total igualdade.", correct: false }, { text: "Não, ela reforçou o racismo ao favorecer o trabalhador europeu em detrimento da população negra recém-liberta.", correct: true }, { text: "Sim, o Brasil se tornou um país sem nenhum preconceito.", correct: false }, { text: "Não houve uma política imigratória, os europeus vieram por conta própria.", correct: false }], explanation: "Apesar de substituir a mão de obra escrava, a política de imigração marginalizou a população negra, que após a abolição não recebeu nenhum tipo de auxílio ou terra, enquanto o governo subsidiava a vinda de europeus." },

            // Novas perguntas de Guerra do Paraguai
            { question: "Qual era o principal objetivo do ditador paraguaio Solano López ao iniciar o conflito na região platina?", answers: [{ text: "Conquistar todo o território do Brasil.", correct: false }, { text: "Garantir uma saída para o Oceano Atlântico através dos rios da Bacia do Prata, projeto conhecido como 'Paraguai Maior'.", correct: true }, { text: "Libertar os escravos no Brasil.", correct: false }, { text: "Criar uma aliança militar com a Inglaterra.", correct: false }], explanation: "O Paraguai era um país isolado geograficamente. O projeto expansionista de Solano López buscava garantir o acesso ao mar para expandir o comércio e a influência do país na região." },
            { question: "Qual evento é considerado o estopim para a declaração de guerra do Brasil ao Paraguai?", answers: [{ text: "A invasão da Argentina pelo Paraguai.", correct: false }, { text: "O aprisionamento do navio brasileiro Marquês de Olinda e a invasão do Mato Grosso pelo Paraguai.", correct: true }, { text: "A Batalha do Riachuelo.", correct: false }, { text: "A morte de D. Pedro II.", correct: false }], explanation: "A agressão paraguaia, com o aprisionamento de um navio e a posterior invasão do território brasileiro, foi a resposta do Paraguai à intervenção do Brasil no Uruguai e serviu como causa imediata para o início da guerra." },
            { question: "Qual foi a maior batalha campal da história da América do Sul, ocorrida durante a Guerra do Paraguai?", answers: [{ text: "Batalha de Cerro Corá", correct: false }, { text: "Batalha do Riachuelo", correct: false }, { text: "Batalha de Tuiuti", correct: true }, { text: "Batalha de Lomas Valentinas", correct: false }], explanation: "A Batalha de Tuiuti foi extremamente sangrenta e, apesar da vitória da Tríplice Aliança, demonstrou a forte resistência do exército paraguaio." },
            { question: "Como a Guerra do Paraguai terminou?", answers: [{ text: "Com um acordo de paz negociado pela Inglaterra.", correct: false }, { text: "Com a morte de Solano López na Batalha de Cerro Corá e a completa derrota do Paraguai.", correct: true }, { text: "Com a rendição do exército brasileiro.", correct: false }, { text: "Com a intervenção das Nações Unidas.", correct: false }], explanation: "A guerra só terminou oficialmente com a morte do líder paraguaio, Solano López, em 1870, que se recusou a se render e lutou até o fim." },
            { question: "Qual foi a principal consequência financeira da Guerra do Paraguai para o Império Brasileiro?", answers: [{ text: "O Brasil enriqueceu com os despojos de guerra.", correct: false }, { text: "O Brasil contraiu enormes dívidas, principalmente com bancos ingleses, para financiar a guerra.", correct: true }, { text: "A economia não foi afetada.", correct: false }, { text: "O café perdeu seu valor no mercado internacional.", correct: false }], explanation: "A guerra teve um custo altíssimo para o Brasil, que precisou pegar grandes empréstimos para sustentar seu exército, aumentando significativamente a dívida externa do país." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            questions = questions.slice(0, 40); // Garante que teremos 40 perguntas
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            const correct = selectedButton.dataset.correct === 'true';
            
            const currentQuestion = questions[currentQuestionIndex];
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: correctAnswer.text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                    }
                    answersHtml += `<p class="${classList}">${ans.text} ${ans.text === answerData.userAnswer ? (answerData.wasCorrect ? '✅' : '❌') : ''}</p>`;
                });

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question.replace(/<br>/g, ' ')}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
