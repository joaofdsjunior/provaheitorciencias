<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Histórico: A Queda do Império</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #8fb0db; /* Pastel Sky */
            --ground-color: #7bb661; /* Pastel Grass */
            --panel-bg: #e6d6ad; /* Parchment/UI */
            --panel-border: #6d4e28;
            --text-color: #3f2832;
            --hp-green: #5ac54f;
            --hp-red: #d95763;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: linear-gradient(to bottom, var(--bg-color) 60%, var(--ground-color) 60%);
            border: 4px solid var(--panel-border);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- BATTLE SCENE --- */
        #battle-scene {
            flex: 2;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 50px 60px; /* Padding bottom to sit on "grass" */
        }

        .character {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.2s;
        }

        .sprite {
            font-size: 80px;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.3));
        }

        .name-tag {
            background: var(--panel-border);
            color: #fff;
            padding: 4px 8px;
            font-size: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .hp-bar-container {
            width: 120px;
            height: 15px;
            background: #333;
            border: 2px solid #fff;
            margin-bottom: 5px;
            position: relative;
        }

        .hp-fill {
            height: 100%;
            background-color: var(--hp-green);
            width: 100%;
            transition: width 0.5s ease-out, background-color 0.3s;
        }

        /* --- UI PANEL --- */
        #ui-panel {
            flex: 1.5;
            background-color: var(--panel-bg);
            border-top: 4px solid var(--panel-border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            font-family: 'VT323', monospace; /* Fonte mais legível para textos longos */
            font-size: 1.4rem;
        }

        #question-box {
            background: rgba(255,255,255,0.5);
            border: 2px solid var(--panel-border);
            padding: 10px;
            margin-bottom: 10px;
            min-height: 60px;
            border-radius: 5px;
        }

        #timer-bar {
            width: 100%;
            height: 5px;
            background: #ccc;
            margin-bottom: 10px;
        }
        
        #timer-fill {
            width: 100%;
            height: 100%;
            background: #d95763;
            transition: width 1s linear;
        }

        #options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: #fff;
            border: 2px solid var(--panel-border);
            padding: 10px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            text-align: left;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #f0e6c6;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
            background: #ccc;
        }

        #actions-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            align-items: center;
        }

        .action-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            background: #6d4e28;
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }

        .action-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* --- EFFECTS --- */
        .shake {
            animation: shake 0.5s;
        }
        
        .attack-anim {
            transform: scale(1.2);
        }

        .damage-text {
            position: absolute;
            top: -30px;
            font-size: 20px;
            font-weight: bold;
            color: #d95763;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* --- MODAL (END SCREEN) --- */
        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            z-index: 10;
            padding: 20px;
        }

        #end-trophy {
            font-size: 60px;
            margin-bottom: 20px;
        }

        #end-title {
            color: #f4d228;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        #end-score {
            font-size: 12px;
            margin-bottom: 30px;
            color: #ccc;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            #options-grid {
                grid-template-columns: 1fr;
            }
            .sprite {
                font-size: 50px;
            }
            #battle-scene {
                padding: 10px 20px 40px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Battle Area -->
        <div id="battle-scene">
            <!-- Hero -->
            <div class="character" id="hero-char">
                <div class="hp-bar-container"><div class="hp-fill" id="hero-hp-bar"></div></div>
                <div class="name-tag">HERÓI (VOCÊ)</div>
                <div class="sprite">🧑‍🎓</div>
            </div>

            <!-- Enemy -->
            <div class="character" id="enemy-char">
                <div class="hp-bar-container"><div class="hp-fill" id="enemy-hp-bar"></div></div>
                <div class="name-tag">CORONEL / IMPÉRIO</div>
                <div class="sprite">💂‍♂️</div>
            </div>
        </div>

        <!-- UI Area -->
        <div id="ui-panel">
            <div id="timer-bar"><div id="timer-fill"></div></div>
            <div id="question-box">Carregando batalha...</div>
            
            <div id="options-grid">
                <!-- Options injected via JS -->
            </div>

            <div id="actions-row">
                <span id="score-display">Pontos: 0</span>
                <button class="action-btn" id="hint-btn" onclick="game.useHint()">💡 Dica (Vale -5pts)</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen">
            <div id="end-trophy">🏆</div>
            <h1 id="end-title">RANKING FINAL</h1>
            <p id="end-desc">Descrição do resultado</p>
            <p id="end-score">Nota: 0.0</p>
            <button class="action-btn" onclick="location.reload()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const database = [
            {
                q: "A escravidão no Brasil durou mais de três séculos. Quantos anos exatos o Brasil manteve o sistema escravista?",
                options: ["300 anos", "337 anos", "400 anos", "250 anos"],
                correct: 1,
                hint: "Começou por volta de 1550 e terminou em 1888. Faça a conta aproximada."
            },
            {
                q: "Em 1850, uma lei proibiu o tráfico interatlântico de escravos, mas aumentou o tráfico interno. Qual o nome desta lei?",
                options: ["Lei Áurea", "Lei do Ventre Livre", "Lei Eusébio de Queirós", "Lei dos Sexagenários"],
                correct: 2,
                hint: "Leva o nome do Ministro da Justiça da época."
            },
            {
                q: "Qual lei de 1871 declarava livres os filhos de mulher escravizada nascidos a partir daquela data?",
                options: ["Lei do Ventre Livre", "Lei Saraiva-Cotegipe", "Lei Bill Aberdeen", "Lei Áurea"],
                correct: 0,
                hint: "O nome da lei é bem literal sobre a 'barriga' da mãe."
            },
            {
                q: "A Questão Militar foi decisiva para o fim do Império. O que os militares defendiam?",
                options: ["A volta da Monarquia Absoluta", "O fim da escravidão sem indenização", "A República e ideais positivistas", "O Coronelismo rural"],
                correct: 2,
                hint: "Eles eram influenciados por Benjamin Constant e queriam 'Ordem e Progresso'."
            },
            {
                q: "Na República Velha, como era conhecido o sistema de fraude eleitoral controlado pelos coronéis?",
                options: ["Voto Secreto", "Voto de Cabresto", "Sufrágio Universal", "Voto Digital"],
                correct: 1,
                hint: "O eleitor era guiado como um animal (burro ou cavalo) pelo coronel."
            },
            {
                q: "Antônio Conselheiro liderou um povoado no sertão da Bahia que foi destruído pelo exército. De que conflito falamos?",
                options: ["Guerra do Contestado", "Revolta da Vacina", "Guerra de Canudos", "Cangaço"],
                correct: 2,
                hint: "Ocorreu no arraial de Belo Monte, interior da Bahia, em 1897."
            },
            {
                q: "A Revolta da Vacina (1904) ocorreu no Rio de Janeiro. Além da vacinação forçada, o que mais revoltou a população?",
                options: ["A alta do café", "O 'Bota Abaixo' (reformas urbanas)", "A falta de água", "A proibição do Carnaval"],
                correct: 1,
                hint: "O prefeito Pereira Passos demoliu cortiços para alargar avenidas."
            },
            {
                q: "Quem foi o líder da Revolta da Chibata (1910), conhecido como 'Almirante Negro'?",
                options: ["João Cândido", "Deodoro da Fonseca", "Floriano Peixoto", "Zumbi dos Palmares"],
                correct: 0,
                hint: "Ele era um marinheiro que se rebelou contra os castigos físicos na Marinha."
            },
            {
                q: "A Semana de Arte Moderna de 1922 marcou o início de qual movimento cultural no Brasil?",
                options: ["Romantismo", "Barroco", "Modernismo", "Parnasianismo"],
                correct: 2,
                hint: "Buscava uma identidade nacional longe dos moldes acadêmicos europeus."
            },
            {
                q: "Qual foi o motivo imediato para a Proclamação da República em 15 de novembro de 1889?",
                options: ["A morte de D. Pedro II", "Um boato de prisão de Deodoro da Fonseca", "A invasão paraguaia", "A assinatura da Lei Áurea"],
                correct: 1,
                hint: "Deodoro estava doente e foi convencido a agir por uma notícia falsa (Fake News da época)."
            }
        ];

        const game = {
            currentQ: 0,
            score: 0,
            heroHP: 100,
            enemyHP: 100,
            timer: 30,
            timerInterval: null,
            hintUsed: false,
            maxQuestions: database.length,
            enemyDamage: 100 / database.length, // Se errar tudo, morre.

            elements: {
                heroHpBar: document.getElementById('hero-hp-bar'),
                enemyHpBar: document.getElementById('enemy-hp-bar'),
                heroChar: document.getElementById('hero-char'),
                enemyChar: document.getElementById('enemy-char'),
                questionBox: document.getElementById('question-box'),
                optionsGrid: document.getElementById('options-grid'),
                scoreDisplay: document.getElementById('score-display'),
                timerFill: document.getElementById('timer-fill'),
                hintBtn: document.getElementById('hint-btn'),
                endScreen: document.getElementById('end-screen')
            },

            init: function() {
                this.currentQ = 0;
                this.score = 0;
                this.heroHP = 100;
                this.enemyHP = 100;
                this.updateUI();
                this.loadQuestion();
            },

            loadQuestion: function() {
                if (this.currentQ >= this.maxQuestions || this.heroHP <= 0 || this.enemyHP <= 0) {
                    this.endGame();
                    return;
                }

                const data = database[this.currentQ];
                this.hintUsed = false;
                this.elements.hintBtn.disabled = false;
                this.elements.questionBox.innerText = data.q;
                this.elements.optionsGrid.innerHTML = '';
                
                // Shuffle options visual display logic could go here, but simple listing for now
                data.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.checkAnswer(index);
                    this.elements.optionsGrid.appendChild(btn);
                });

                this.startTimer();
            },

            startTimer: function() {
                this.timer = 30;
                clearInterval(this.timerInterval);
                this.elements.timerFill.style.width = '100%';
                
                this.timerInterval = setInterval(() => {
                    this.timer--;
                    const pct = (this.timer / 30) * 100;
                    this.elements.timerFill.style.width = `${pct}%`;

                    if (this.timer <= 0) {
                        this.timeOut();
                    }
                }, 1000);
            },

            useHint: function() {
                if(this.hintUsed) return;
                this.hintUsed = true;
                this.elements.hintBtn.disabled = true;
                const data = database[this.currentQ];
                this.elements.questionBox.innerHTML += `<br><br><em>💡 DICA: ${data.hint}</em>`;
            },

            checkAnswer: function(selectedIndex) {
                clearInterval(this.timerInterval);
                const data = database[this.currentQ];
                
                // Disable buttons
                const btns = document.querySelectorAll('.btn');
                btns.forEach(b => b.disabled = true);

                if (selectedIndex === data.correct) {
                    // Acerto
                    if (!this.hintUsed) {
                        this.score += 10;
                        this.attackEnemy(true); // Crítico
                        this.showFloatingText(this.elements.enemyChar, "-20 HP (CRÍTICO!)");
                        this.enemyHP -= 20; // Mais dano para zerar mais rápido
                    } else {
                        this.score += 5;
                        this.attackEnemy(false); // Normal
                        this.showFloatingText(this.elements.enemyChar, "-10 HP");
                        this.enemyHP -= 10;
                    }
                } else {
                    // Erro
                    this.score = Math.max(0, this.score - 5);
                    this.attackHero();
                    this.showFloatingText(this.elements.heroChar, "-20 HP");
                    this.heroHP -= 20; // 5 erros = morte
                }

                this.updateUI();
                
                setTimeout(() => {
                    this.currentQ++;
                    this.loadQuestion();
                }, 1500);
            },

            timeOut: function() {
                clearInterval(this.timerInterval);
                const btns = document.querySelectorAll('.btn');
                btns.forEach(b => b.disabled = true);

                this.score = Math.max(0, this.score - 5);
                this.attackHero();
                this.showFloatingText(this.elements.heroChar, "-20 HP (TEMPO!)");
                this.heroHP -= 20;

                this.updateUI();

                setTimeout(() => {
                    this.currentQ++;
                    this.loadQuestion();
                }, 1500);
            },

            attackEnemy: function(isCritical) {
                // Animação visual (Herói avança)
                this.elements.heroChar.classList.add('attack-anim');
                setTimeout(() => this.elements.heroChar.classList.remove('attack-anim'), 300);
                
                // Inimigo treme
                setTimeout(() => {
                    this.elements.enemyChar.classList.add('shake');
                    setTimeout(() => this.elements.enemyChar.classList.remove('shake'), 500);
                }, 200);
            },

            attackHero: function() {
                // Inimigo avança
                this.elements.enemyChar.classList.add('attack-anim');
                setTimeout(() => this.elements.enemyChar.classList.remove('attack-anim'), 300);

                // Herói treme
                setTimeout(() => {
                    this.elements.heroChar.classList.add('shake');
                    setTimeout(() => this.elements.heroChar.classList.remove('shake'), 500);
                }, 200);
            },

            showFloatingText: function(element, text) {
                const float = document.createElement('div');
                float.className = 'damage-text';
                float.innerText = text;
                element.appendChild(float);
                setTimeout(() => float.remove(), 1000);
            },

            updateUI: function() {
                this.elements.scoreDisplay.innerText = `Pontos: ${this.score}`;
                
                // HP Bars
                this.elements.heroHpBar.style.width = Math.max(0, this.heroHP) + '%';
                this.elements.enemyHpBar.style.width = Math.max(0, this.enemyHP) + '%';

                // Cor da barra
                this.elements.heroHpBar.style.backgroundColor = this.heroHP < 30 ? '#d95763' : '#5ac54f';
            },

            endGame: function() {
                clearInterval(this.timerInterval);
                
                // Calcular Nota Final (0 a 10)
                // Score Maximo possível: 10 questões * 10 pontos = 100 pts.
                // Nota = Pontos / 10.
                let finalGrade = (this.score / 10).toFixed(2);
                
                // Se o inimigo não morreu mas as perguntas acabaram, o jogo acaba.
                // Se o herói morreu, nota mantém o que conseguiu.

                let trophy = "";
                let title = "";
                let msg = "";

                if (finalGrade > 9.55) {
                    trophy = "🏆";
                    title = "Heitor Economista Tecnológico 2027!";
                    msg = "Absoluto cinema! O futuro da nação está salvo.";
                } else if (finalGrade >= 8.0) {
                    trophy = "🥈";
                    title = "Rei dos Romildos";
                    msg = "Tá levando pau mas é bom no que faz.";
                } else if (finalGrade >= 5.0) {
                    trophy = "🥉";
                    title = "Pai da Renata";
                    msg = "Ganhando 1500 reais por mês. Dá pra viver...";
                } else {
                    trophy = "🤡";
                    title = "Véi..porque";
                    msg = "A monarquia voltou por sua culpa.";
                }

                if (this.heroHP <= 0) {
                    title = "GAME OVER (Véi..porque)";
                    msg = "Você foi derrotado pelo sistema.";
                    trophy = "☠️";
                }

                document.getElementById('end-trophy').innerText = trophy;
                document.getElementById('end-title').innerText = title;
                document.getElementById('end-desc').innerText = msg;
                document.getElementById('end-score').innerText = `Nota Final: ${finalGrade}`;
                
                this.elements.endScreen.style.display = 'flex';
            }
        };

        // Iniciar
        game.init();

    </script>
</body>
</html>
