<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interdisciplinar - Revisão Geral</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #ef4444; /* Vermelho */
            --theme-dark: #dc2626;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f87171; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #ffedd5; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz Interdisciplinar</h1>
            <p>Teste seus conhecimentos em Ciências, História, Geografia, Matemática e muito mais! Cada resposta correta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Questão 1 / 50</div>
                <div id="score">Pontuação: 0</div>
                <div id="correct-answers">Corretas: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Questão</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final é:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Jogar Novamente</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        // Array com todas as 50 perguntas baseadas no material fornecido
        const allQuestions = [
            // Sistema Endócrino (5 perguntas)
            {
                question: "O que são hormônios?",
                answers: [
                    { text: "Substâncias secretadas pelas glândulas endócrinas", correct: true },
                    { text: "Células do sistema nervoso", correct: false },
                    { text: "Partículas do sangue", correct: false },
                    { text: "Enzimas digestivas", correct: false }
                ],
                explanation: "Os hormônios são substâncias secretadas pelas glândulas endócrinas que são lançadas na corrente sanguínea, atingindo assim as células dos vários tecidos do corpo humano."
            },
            {
                question: "O que é feedback negativo no sistema endócrino?",
                answers: [
                    { text: "Quando a concentração de um hormônio atinge o nível necessário e a produção é interrompida", correct: true },
                    { text: "Quando a concentração de um hormônio está baixa e a produção aumenta", correct: false },
                    { text: "Quando o corpo rejeita um hormônio", correct: false },
                    { text: "Quando um hormônio causa efeitos colaterais", correct: false }
                ],
                explanation: "No feedback negativo, quando a concentração de um hormônio atinge o nível necessário, o estímulo para a glândula que produz esse hormônio é interrompido. É como se o corpo tivesse hormônio suficiente, então a glândula 'desliga'."
            },
            {
                question: "Qual glândula é conhecida como 'glândula mestra'?",
                answers: [
                    { text: "Hipófise", correct: true },
                    { text: "Tireoide", correct: false },
                    { text: "Suprarrenal", correct: false },
                    { text: "Pâncreas", correct: false }
                ],
                explanation: "A hipófise é considerada a 'glândula mestra' porque regula o funcionamento de várias outras glândulas endócrinas."
            },
            {
                question: "Qual hormônio é produzido pelo pâncreas e diminui o nível de glicose no sangue?",
                answers: [
                    { text: "Insulina", correct: true },
                    { text: "Glucagon", correct: false },
                    { text: "Adrenalina", correct: false },
                    { text: "Cortisol", correct: false }
                ],
                explanation: "A insulina é liberada quando o nível de glicose no sangue aumenta (após uma refeição). Ela 'abre as portas' das células para a glicose entrar, diminuindo o açúcar no sangue."
            },
            {
                question: "O que caracteriza o diabetes tipo 1?",
                answers: [
                    { text: "O corpo não produz insulina suficiente", correct: true },
                    { text: "O corpo desenvolve resistência à insulina", correct: false },
                    { text: "É causado apenas por fatores genéticos", correct: false },
                    { text: "Acontece apenas em idosos", correct: false }
                ],
                explanation: "No diabetes tipo 1, o corpo não produz insulina suficiente devido a uma doença autoimune que destrói as células do pâncreas que produzem insulina."
            },
            
            // Inglês - Pronomes (5 perguntas)
            {
                question: "Qual é a forma correta do pronome objeto para 'she'?",
                answers: [
                    { text: "Her", correct: true },
                    { text: "Hers", correct: false },
                    { text: "She", correct: false },
                    { text: "Herself", correct: false }
                ],
                explanation: "Os pronomes objeto (object pronouns) são: me, you, him, her, it, us, them. Eles geralmente vêm depois do verbo ou de uma preposição."
            },
            {
                question: "Complete a frase: 'This book is ____.' (referindo-se a um livro que pertence a mim)",
                answers: [
                    { text: "mine", correct: true },
                    { text: "my", correct: false },
                    { text: "me", correct: false },
                    { text: "I", correct: false }
                ],
                explanation: "Os pronomes possessivos (mine, yours, his, hers, ours, theirs) substituem o substantivo, enquanto os adjetivos possessivos (my, your, his, her, its, our, their) são sempre seguidos por um substantivo."
            },
            {
                question: "Qual pronome reflexivo completa corretamente: 'She cut ____ while cooking.'",
                answers: [
                    { text: "herself", correct: true },
                    { text: "her", correct: false },
                    { text: "hers", correct: false },
                    { text: "she", correct: false }
                ],
                explanation: "Os pronomes reflexivos (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves) são usados quando o sujeito que pratica a ação é o mesmo que recebe a ação."
            },
            {
                question: "Qual é a diferença entre 'your' e 'yours'?",
                answers: [
                    { text: "'Your' é adjetivo possessivo e 'yours' é pronome possessivo", correct: true },
                    { text: "'Your' é pronome objeto e 'yours' é pronome sujeito", correct: false },
                    { text: "'Your' é plural e 'yours' é singular", correct: false },
                    { text: "Não há diferença, são intercambiáveis", correct: false }
                ],
                explanation: "Os adjetivos possessivos (your) indicam posse e são sempre seguidos por um substantivo. Os pronomes possessivos (yours) também indicam posse, mas substituem o substantivo."
            },
            {
                question: "Qual frase usa corretamente um pronome reflexivo para ênfase?",
                answers: [
                    { text: "He built the house by himself.", correct: true },
                    { text: "He built the house by his.", correct: false },
                    { text: "He built the house by him.", correct: false },
                    { text: "He built the house by he.", correct: false }
                ],
                explanation: "Os pronomes reflexivos também podem ser usados para dar ênfase, significando 'sozinho' ou 'em pessoa'."
            },
            
            // Lógica de Programação (5 perguntas)
            {
                question: "No problema do garçom da OBI, quando é que os copos são quebrados?",
                answers: [
                    { text: "Quando o número de latas é maior que o número de copos", correct: true },
                    { text: "Quando o número de copos é maior que o número de latas", correct: false },
                    { text: "Sempre", correct: false },
                    { text: "Nunca", correct: false }
                ],
                explanation: "No problema do garçom, se em uma bandeja o número de latas for maior que o número de copos, o garçom se atrapalha e acaba quebrando todos os copos que estavam naquela bandeja."
            },
            {
                question: "Qual é a função de uma variável em programação?",
                answers: [
                    { text: "Armazenar dados na memória", correct: true },
                    { text: "Executar cálculos automaticamente", correct: false },
                    { text: "Conectar-se à internet", correct: false },
                    { text: "Criar interfaces gráficas", correct: false }
                ],
                explanation: "Variáveis são como 'caixinhas' de memória usadas para guardar dados que o programa precisa para funcionar."
            },
            {
                question: "O que é um loop (estrutura de repetição) em programação?",
                answers: [
                    { text: "Um comando que repete um bloco de código várias vezes", correct: true },
                    { text: "Um tipo de variável", correct: false },
                    { text: "Um erro no programa", correct: false },
                    { text: "Uma função matemática", correct: false }
                ],
                explanation: "Estruturas de repetição (loops) são comandos usados para realizar a mesma tarefa várias vezes, como o comando 'while'."
            },
            {
                question: "No comando 'while', quando a repetição é interrompida?",
                answers: [
                    { text: "Quando a condição se torna falsa", correct: true },
                    { text: "Após 10 repetições", correct: false },
                    { text: "Quando o usuário clica em parar", correct: false },
                    { text: "Nunca é interrompida", correct: false }
                ],
                explanation: "O comando 'while' repete um bloco de código enquanto uma condição for verdadeira. Quando a condição se torna falsa, a repetição é interrompida."
            },
            {
                question: "No problema do garçom, se temos 3 bandejas com (10 latas, 5 copos), (4 latas, 6 copos) e (8 latas, 7 copos), quantos copos são quebrados?",
                answers: [
                    { text: "12", correct: true },
                    { text: "5", correct: false },
                    { text: "18", correct: false },
                    { text: "0", correct: false }
                ],
                explanation: "Na primeira bandeja (10>5) - quebram 5 copos. Na segunda (4<6) - não quebra nada. Na terceira (8>7) - quebram 7 copos. Total: 5 + 7 = 12 copos quebrados."
            },
            
            // História - Imperialismo (5 perguntas)
            {
                question: "O que foi o Imperialismo no final do século XIX?",
                answers: [
                    { text: "Expansão de países industrializados sobre outras regiões", correct: true },
                    { text: "Sistema político da Idade Média", correct: false },
                    { text: "Revolução industrial na Europa", correct: false },
                    { text: "Movimento artístico do século XX", correct: false }
                ],
                explanation: "O Imperialismo foi uma nova fase do colonialismo em que os países industrializados buscaram expandir sua influência, investir capitais excedentes, obter matérias-primas e assegurar novos mercados."
            },
            {
                question: "Qual era a 'Missão Civilizadora' defendida pelos europeus?",
                answers: [
                    { text: "A ideia de que levavam civilização a povos 'atrasados'", correct: true },
                    { text: "A crença em espalhar o cristianismo pelo mundo", correct: false },
                    { text: "A exportação de tecnologia para as colônias", correct: false },
                    { text: "A educação universal para todos os povos", correct: false }
                ],
                explanation: "A 'Missão Civilizadora' era uma justificativa ideológica para o imperialismo, onde os europeus defendiam que sua dominação era uma 'missão' para levar a 'civilização' a povos considerados 'atrasados'."
            },
            {
                question: "O que foi o Darwinismo Social?",
                answers: [
                    { text: "Aplicação incorreta da teoria de Darwin às sociedades humanas", correct: true },
                    { text: "Teoria científica sobre evolução das espécies", correct: false },
                    { text: "Movimento de preservação ambiental", correct: false },
                    { text: "Sistema econômico baseado na cooperação", correct: false }
                ],
                explanation: "O Darwinismo Social foi uma aplicação incorreta da teoria da seleção natural de Charles Darwin às sociedades humanas, justificando a desigualdade social e o domínio de nações europeias sobre outras."
            },
            {
                question: "O que foi a política de 'branqueamento' no Brasil pós-abolição?",
                answers: [
                    { text: "Promoção da imigração europeia para 'embranquecer' a população", correct: true },
                    { text: "Campanha de higiene pública", correct: false },
                    { text: "Movimento artístico nacional", correct: false },
                    { text: "Política de educação para todos", correct: false }
                ],
                explanation: "A política de 'branqueamento' no Brasil pós-abolição promoveu ativamente a imigração em massa de europeus (brancos), baseada na crença de que o 'sangue superior' dos brancos iria 'diluir' e extinguir o 'sangue inferior' dos negros."
            },
            {
                question: "Qual período histórico é conhecido como 'Era Vitoriana'?",
                answers: [
                    { text: "Reinado da Rainha Vitória no Império Britânico (1837-1901)", correct: true },
                    { text: "Período das grandes navegações", correct: false },
                    { text: "Era das revoluções na América", correct: false },
                    { text: "Fase inicial da industrialização", correct: false }
                ],
                explanation: "A Era Vitoriana refere-se ao reinado da Rainha Vitória (1837-1901) no Império Britânico, um período de grande poder e expansão conhecido como 'Pax Britannica' (Paz Britânica)."
            },
            
            // Geografia - Industrialização (5 perguntas)
            {
                question: "Qual foi a principal diferença entre a colonização da América Anglo-Saxônica e da América Latina?",
                answers: [
                    { text: "Colonização de povoamento vs. colonização de exploração", correct: true },
                    { text: "Colonização francesa vs. colonização espanhola", correct: false },
                    { text: "Colonização pacífica vs. colonização violenta", correct: false },
                    { text: "Colonização religiosa vs. colonização econômica", correct: false }
                ],
                explanation: "A América Anglo-Saxônica teve uma colonização de povoamento (interesse em habitar as terras), enquanto a América Latina sofreu uma colonização de exploração (interesse em extrair riquezas para as metrópoles)."
            },
            {
                question: "Onde se localizava o 'Manufacturing Belt' nos EUA?",
                answers: [
                    { text: "Região Nordeste, estendendo-se pela região dos Grandes Lagos", correct: true },
                    { text: "Costa Oeste, na Califórnia", correct: false },
                    { text: "Região Sul, no Texas", correct: false },
                    { text: "Centro-Oeste, nas planícies", correct: false }
                ],
                explanation: "O Manufacturing Belt (Cinturão Industrial) localizava-se na região Nordeste dos EUA, estendendo-se pela região dos Grandes Lagos. Foi a principal região industrial do planeta por décadas."
            },
            {
                question: "O que são as 'maquiladoras' no México?",
                answers: [
                    { text: "Fábricas de montagem na fronteira com os EUA", correct: true },
                    { text: "Plantações de café para exportação", correct: false },
                    { text: "Minas de prata históricas", correct: false },
                    { text: "Refinarias de petróleo", correct: false }
                ],
                explanation: "As maquiladoras são fábricas de montagem que importam peças dos EUA, montam o produto final no México (com mão de obra mais barata) e exportam o produto de volta para os EUA."
            },
            {
                question: "Qual é a principal região industrial da Argentina?",
                answers: [
                    { text: "Região de Buenos Aires", correct: true },
                    { text: "Patagônia", correct: false },
                    { text: "Região dos Andes", correct: false },
                    { text: "Norte do país", correct: false }
                ],
                explanation: "A indústria e os recursos da Argentina concentram-se principalmente na região de Buenos Aires, conforme mostrado no mapa do material de estudo."
            },
            {
                question: "Onde está localizado o Vale do Silício?",
                answers: [
                    { text: "Califórnia, EUA", correct: true },
                    { text: "Texas, EUA", correct: false },
                    { text: "Ontário, Canadá", correct: false },
                    { text: "Nova Inglaterra, EUA", correct: false }
                ],
                explanation: "O Vale do Silício está localizado na área de São Francisco, Califórnia, e é o centro da indústria eletrônica produtora de microchips, computadores e periféricos."
            },
            
            // Arte - Símbolos (5 perguntas)
            {
                question: "O que é um símbolo?",
                answers: [
                    { text: "Algo que representa, designa ou sugere outra coisa", correct: true },
                    { text: "Apenas uma imagem religiosa", correct: false },
                    { text: "Um tipo específico de pintura", correct: false },
                    { text: "Uma figura geométrica", correct: false }
                ],
                explanation: "Símbolo refere-se a sinais, emblemas ou insígnias que representam, designam, sugerem, evocam ou substituem alguma outra coisa."
            },
            {
                question: "Qual a diferença entre percepção objetiva e subjetiva na arte?",
