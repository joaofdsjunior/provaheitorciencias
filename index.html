<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASIL: O LORE DA REPÚBLICA (Ver. Final)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-green: #4ade80;
            --pixel-blue: #3b82f6;
            --pixel-red: #ef4444;
            --pixel-yellow: #facc15;
            --pixel-bg: #0f172a;
        }

        body {
            background-color: var(--pixel-bg);
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            image-rendering: pixelated;
        }

        #game-container {
            width: 900px;
            background-color: #1e293b;
            border: 8px solid #334155;
            position: relative;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* ÁREA DE COMBATE */
        .battle-scene {
            height: 250px;
            background: linear-gradient(#38bdf8 60%, #4ade80 60%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 60px;
            border-bottom: 8px solid #334155;
            position: relative;
        }

        .sprite {
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            position: relative;
        }

        #player-sprite { background-image: url('https://cdn-icons-png.flaticon.com/512/3242/3242274.png'); }
        #enemy-sprite { background-image: url('https://cdn-icons-png.flaticon.com/512/10044/10044809.png'); transform: scaleX(-1); }

        .hp-ui {
            position: absolute;
            top: -90px;
            width: 220px;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border: 3px solid #fff;
        }

        .hp-bar-bg { width: 100%; height: 16px; background: #333; margin-top: 5px; border: 1px solid #fff; }
        .hp-bar-fill { height: 100%; background: var(--pixel-green); width: 100%; transition: width 0.4s ease-in-out; }

        /* INTERFACE DE TEXTO */
        #ui-box {
            background: #f1f5f9;
            color: #1e293b;
            padding: 25px;
            min-height: 380px;
        }

        #question-text {
            font-size: 11px;
            line-height: 1.8;
            margin-bottom: 25px;
            min-height: 90px;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            padding: 15px;
            cursor: pointer;
            border: 4px solid #334155;
            background: #e2e8f0;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }
        button:hover { background: var(--pixel-yellow); }

        .btn-hint {
            background: var(--pixel-blue);
            color: white;
            width: 100%;
            margin-top: 20px;
            border-color: #1e40af;
        }

        /* TELAS FINAIS */
        #final-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="battle-scene">
        <div id="player-sprite" class="sprite">
            <div class="hp-ui">
                <div style="font-size: 8px; color: #fff;">HEITOR (IMPÉRIO)</div>
                <div class="hp-bar-bg"><div id="p-fill" class="hp-bar-fill"></div></div>
                <div style="font-size: 9px; color: #fff; margin-top: 5px;"><span id="p-val">400</span>/400 HP</div>
            </div>
        </div>

        <div id="enemy-sprite" class="sprite">
            <div class="hp-ui" style="right: 0;">
                <div style="font-size: 8px; color: #fff; text-align: right;">CORONEL DO CAFÉ</div>
                <div class="hp-bar-bg"><div id="e-fill" class="hp-bar-fill" style="background: var(--pixel-red);"></div></div>
                <div style="font-size: 9px; color: #fff; margin-top: 5px; text-align: left;"><span id="e-val">400</span>/400 HP</div>
            </div>
        </div>
    </div>

    <div id="ui-box">
        <div id="question-text">Inicializando batalha histórica...</div>
        <div id="options" class="options-grid"></div>
        <button class="btn-hint" onclick="handleHint()">OBTER DICA (PONTUAÇÃO REDUZIDA)</button>
    </div>

    <div id="final-screen" class="hidden"></div>
</div>

<script>
    const questions = [
        { q: "O Brasil foi o último país da América a abolir a escravidão. Quantos anos durou esse período de maus-tratos?", options: ["100 anos", "200 anos", "337 anos", "415 anos"], correct: 2, hint: "Ocorreu entre 1551 e 1888[cite: 31]." },
        { q: "Qual o principal motivo da elite agrária ter abandonado D. Pedro II após 1888?", options: ["Apoio à maçonaria", "Falta de indenização pela Lei Áurea", "Guerra com o Paraguai", "Crise do café"], correct: 1, hint: "A elite viu a libertação como 'ruína de patrimônio'[cite: 12, 43]." },
        { q: "A Lei Eusébio de Queirós (1850) focava em qual ação principal?", options: ["Libertar idosos", "Proibir o tráfico negreiro", "Dar terras a imigrantes", "Fim do Império"], correct: 1, hint: "A lei proibiu o tráfico negreiro sob pressão da Inglaterra[cite: 8, 9, 24]." },
        { q: "O que determinava a Lei do Ventre Livre de 1871?", options: ["Libertava escravos de 60 anos", "Libertava quem chegava ao Brasil", "Filhos de escravizadas nasciam livres", "Acabava com a chibata"], correct: 2, hint: "Considerada uma lei de impulso para a campanha abolicionista[cite: 14, 16]." },
        { q: "Quem assinou a Lei Áurea em 13 de Maio de 1888?", options: ["D. Pedro II", "Princesa Isabel", "Marechal Deodoro", "Joaquim Nabuco"], correct: 1, hint: "A assinatura ocorreu pelas mãos da Princesa Isabel[cite: 30, 32]." },
        { q: "Qual era a base das fortunas e privilégios dos grupos dominantes no Segundo Reinado?", options: ["Trabalho assalariado", "Mineração de prata", "Trabalho escravo", "Indústria de tecidos"], correct: 2, hint: "A base das grandes fortunas era o trabalho escravo[cite: 17, 31]." },
        { q: "A Questão Religiosa começou porque o Imperador interveio em ordens contra:", options: ["O Exército", "A Maçonaria", "Os Imigrantes", "Os Cafeicultores"], correct: 1, hint: "O imperador anulou determinações papais em favor dos maçons[cite: 60, 61]." },
        { q: "Qual grupo se fortaleceu após a Guerra do Paraguai e buscou protagonismo político?", options: ["Igreja Católica", "Imigrantes Italianos", "O Exército", "Os Modernistas"], correct: 2, hint: "O exército buscou maior protagonismo após 1870[cite: 62]." },
        { q: "Quem liderou o golpe de 15 de novembro de 1889 e proclamou a República?", options: ["Prudente de Moraes", "Benjamin Constant", "Marechal Deodoro da Fonseca", "Floriano Peixoto"], correct: 2, hint: "Ele marchou com as tropas para o Ministério da Guerra[cite: 67]." },
        { q: "O que aconteceu com a família real após a Proclamação da República?", options: ["Foram presos no Rio", "Mudaram-se para São Paulo", "Obrigados a retornar para Portugal", "Ficaram como cidadãos comuns"], correct: 2, hint: "A família real foi obrigada a retornar para Lisboa[cite: 69]." },
        { q: "Na 'República da Espada' (1889-1894), os presidentes eram:", options: ["Grandes Cafeicultores", "Civis eleitos", "Militares (fardados)", "Líderes religiosos"], correct: 2, hint: "Período marcado por presidentes fardados[cite: 70, 71]." },
        { q: "A Constituição de 1891 estabeleceu o Federalismo, que significava:", options: ["Poder total à Igreja", "Autonomia para os Estados", "Voto às mulheres", "Fim do Exército"], correct: 1, hint: "Dava maior autonomia para cada unidade federativa/estado[cite: 76, 79]." },
        { q: "Quem eram os 'Maragatos' na Revolução Federalista (1893-1895)?", options: ["Defensores do governador", "Usavam lenço branco", "Desejavam o parlamentarismo", "Eram aliados de Floriano"], correct: 2, hint: "Federalistas que desejavam o sistema parlamentarista[cite: 83, 85]." },
        { q: "A República Oligárquica era comandada sob a liderança dos:", options: ["Industriais", "Cafeicultores", "Marinheiros", "Sertanejos"], correct: 1, hint: "Famílias latifundiárias sob o comando dos cafeicultores de SP[cite: 88, 90]." },
        { q: "A Política do Café com Leite era o revezamento no poder entre:", options: ["SP e Rio de Janeiro", "Minas Gerais e RS", "São Paulo e Minas Gerais", "Bahia e Pernambuco"], correct: 2, hint: "Revezamento entre oligarquias paulista e mineira[cite: 94, 96]." },
        { q: "O Voto de Cabresto na República Velha era garantido através de:", options: ["Urnas eletrônicas", "Voto secreto e seguro", "Pressão dos coronéis locais", "Debates na TV"], correct: 2, hint: "Voto aberto sujeito às pressões dos chefes políticos[cite: 98, 100]." },
        { q: "Qual era o objetivo da 'Política dos Governadores' de Campos Sales?", options: ["Acabar com o café", "Apaziguar divergências entre Estados e União", "Dar terras aos pobres", "Expulsar imigrantes"], correct: 1, hint: "Criada para apaziguar divergências e alinhar o apoio rural[cite: 91, 92]." },
        { q: "Quem liderou o Arraial de Canudos na Bahia?", options: ["Lampião", "Padre Cícero", "Antônio Conselheiro", "João Cândido"], correct: 2, hint: "Antônio Vicente Mendes Maciel, o Antônio Conselheiro[cite: 119, 120]." },
        { q: "Qual crença de Antônio Conselheiro incomodava o governo republicano?", options: ["Que o café ia acabar", "No retorno do rei D. Sebastião", "Na vacinação obrigatória", "No voto feminino"], correct: 1, hint: "Ele acreditava no retorno mítico do rei D. Sebastião[cite: 124]." },
        { q: "O que Prudente de Moraes ordenou sobre Canudos em 1897?", options: ["Paz e anistia", "Construção de escolas", "Não deixem pedra sobre pedra", "Ajuda humanitária"], correct: 2, hint: "Ordem para destruição total do arraial[cite: 139]." },
        { q: "Qual autor escreveu 'Os Sertões' após vivenciar a Guerra de Canudos?", options: ["Machado de Assis", "Euclides da Cunha", "Aluísio Azevedo", "Oswald de Andrade"], correct: 1, hint: "Ele vivenciou o conflito como correspondente de jornal[cite: 144, 146]." },
        { q: "A Guerra do Contestado foi uma disputa de terras localizada entre:", options: ["Brasil e Argentina", "Paraná e Santa Catarina", "São Paulo e Minas Gerais", "Bahia e Sergipe"], correct: 1, hint: "Região disputada entre PR e SC[cite: 149]." },
        { q: "Quem era o líder espiritual da Guerra do Contestado?", options: ["Antônio Conselheiro", "Monge José Maria", "Padre Cícero", "João Cândido"], correct: 1, hint: "Monge José Maria, crítico da República[cite: 152, 156]." },
        { q: "Padre Cícero tornou-se prefeito de Juazeiro do Norte em 1911 após o 'milagre' de:", options: ["Uma beata sangrar na hóstia", "Chover café no sertão", "Curar o Imperador", "Acabar com o cangaço"], correct: 0, hint: "O fato do milagre da hóstia ocorreu em 1889[cite: 172, 176]." },
        { q: "O termo Cangaço vem de 'Canga', que faz referência a:", options: ["Chapéu de couro", "Arreios que amarram o boi", "Espingarda longa", "Faca de prata"], correct: 1, hint: "Canga é o arreio que amarra o boi[cite: 183]." },
        { q: "Quem foi a primeira mulher a entrar para o Cangaço?", options: ["Anita Malfatti", "Maria Bonita", "Princesa Isabel", "Tarsila do Amaral"], correct: 1, hint: "Maria Gomes da Silva, a Maria Bonita[cite: 188, 189]." },
        { q: "Por que a elite incentivou a imigração europeia?", options: ["Eram motoristas", "Projeto de 'Brasil moderno e branco'", "Para ensinar italiano", "Para acabar com o café"], correct: 1, hint: "Incentivo da elite por um Brasil moderno e branco[cite: 213, 214]." },
        { q: "O 'Sistema de Parceria' com imigrantes italianos gerava geralmente:", options: ["Enriquecimento", "Endividamento e maus tratos", "Férias", "Propriedade de terras"], correct: 1, hint: "Gerava endividamento e aprisionamento por dívidas[cite: 232, 233]." },
        { q: "O navio Kasato Maru (1908) marcou o início de qual imigração?", options: ["Alemã", "Italiana", "Japonesa", "Síria"], correct: 2, hint: "Navio japonês que atracou em Santos[cite: 239, 244]." },
        { q: "A Greve Geral de 1917 em São Paulo começou em qual local?", options: ["Ipanema", "Fábrica na Mooca", "Bairro do Bixiga", "Estação da Luz"], correct: 1, hint: "Greve contra o aumento da jornada na Mooca[cite: 293, 295]." },
        { q: "A reforma 'Bota Abaixo' no Rio de Janeiro consistia em:", options: ["Plantar árvores", "Demolir cortiços e barracos", "Construir estádios", "Mudar a capital"], correct: 1, hint: "Demolição de cortiços para modernização higienista[cite: 311, 312]." },
        { q: "As primeiras favelas cariocas surgiram devido à:", options: ["Turismo", "Expulsão de pobres na reforma Pereira Passos", "Falta de café", "Guerra Mundial"], correct: 1, hint: "A demolição expulsou pobres para os morros[cite: 315, 317]." },
        { q: "A Revolta da Vacina (1904) foi uma reação contra:", options: ["Falta de médicos", "Obrigatoriedade e desinformação", "Preço da agulha", "O Imperador"], correct: 1, hint: "Reação do povo frente à desinformação[cite: 323, 327]." },
        { q: "João Cândido liderou qual revolta na Marinha?", options: ["Vacina", "Chibata", "Canudos", "Contestado"], correct: 1, hint: "Líder da Revolta da Chibata, o Almirante Negro[cite: 333, 338]." },
        { q: "O Ciclo da Borracha desenvolveu principalmente quais cidades?", options: ["SP e Rio", "Recife e Salvador", "Manaus e Belém", "Curitiba"], correct: 2, hint: "Exploração de seringais na Amazônia[cite: 345, 346]." },
        { q: "A Semana de Arte Moderna de 1922 buscava:", options: ["Copiar a França", "Identidade Nacional", "Estilo colonial", "Apoiar oligarquias"], correct: 1, hint: "Busca por novos referenciais de identidade nacional[cite: 348, 351]." },
        { q: "O 'Manifesto Antropófago' defendia que a arte brasileira deveria:", options: ["Odiar estrangeiros", "Deglutir e transformar influências", "Ser indígena", "Parar"], correct: 1, hint: "Combinação de elementos nacionais com mundiais[cite: 367]." },
        { q: "Qual o apelido dado a João Cândido?", options: ["Mestre Sala dos Mares", "Rei do Café", "Monge do Sul", "Marechal"], correct: 0, hint: "Homenageado na música de João Bosco[cite: 344]." },
        { q: "A primeira favela foi ocupada originalmente por:", options: ["Italianos", "Barões", "Sobreviventes de Canudos", "Artistas"], correct: 2, hint: "Ocupação de ex-combatentes de Canudos[cite: 318]." },
        { q: "Quem pintou o 'Abaporu' em 1928?", options: ["Anita Malfatti", "Tarsila do Amaral", "Chiquinha Gonzaga", "Princesa Isabel"], correct: 1, hint: "Manifesto Antropófago nasceu do quadro Abaporu[cite: 370]." }
    ];

    let current = 0, pHP = 400, eHP = 400, score = 0, hintUsed = false;

    window.onload = () => render();

    function render() {
        if (current >= questions.length || eHP <= 0 || pHP <= 0) return end();
        hintUsed = false;
        const q = questions[current];
        document.getElementById('question-text').innerText = `${current + 1}. ${q.q}`;
        const div = document.getElementById('options');
        div.innerHTML = "";
        q.options.forEach((opt, i) => {
            const b = document.createElement('button');
            b.innerText = opt;
            b.onclick = () => check(i);
            div.appendChild(b);
        });
    }

    function handleHint() {
        if (hintUsed) return;
        hintUsed = true;
        alert("DICA HISTÓRICA: " + questions[current].hint);
    }

    function check(i) {
        if (i === questions[current].correct) {
            score += hintUsed ? 5 : 10;
            eHP -= 10;
        } else {
            score -= 5;
            pHP -= 10;
        }
        current++;
        update();
        render();
    }

    function update() {
        document.getElementById('p-val').innerText = pHP;
        document.getElementById('e-val').innerText = eHP;
        document.getElementById('p-fill').style.width = (pHP/400*100) + "%";
        document.getElementById('e-fill').style.width = (eHP/400*100) + "%";
    }

    function end() {
        const nota = Math.max(0, (score / 400) * 10).toFixed(2);
        let t, m;
        if (nota > 9.55) { t="🏆 OURO"; m="Heitor Economista Tecnológico 2027!"; }
        else if (nota >= 8) { t="🥈 PRATA"; m="Rei dos Romildos - Tá levando pau mas é bom no que faz."; }
        else if (nota >= 5) { t="🥉 BRONZE"; m="Pai da Renata - Ganhando 1500 reais."; }
        else { t="🤡"; m="Véi.. porque?"; }

        const sc = document.getElementById('final-screen');
        sc.innerHTML = `
            <h1 style="color:var(--pixel-yellow)">BATALHA CONCLUÍDA</h1>
            <div style="font-size:32px; margin:20px;">${t}</div>
            <p style="font-size:14px;">${m}</p>
            <h2 style="color:white; margin:30px;">NOTA FINAL: ${nota}</h2>
            <button onclick="location.reload()" style="padding:15px 40px;">RESTART</button>
        `;
        sc.classList.remove('hidden');
    }
</script>
</body>
</html>
