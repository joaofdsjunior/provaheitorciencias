<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Inglês - 5º Ano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #3b82f6; /* Azul */
            --theme-dark: #2563eb;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #60a5fa; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        /* Estilos da tela de revisão */
        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #e0e7ff; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>English Quiz!</h1>
            <p>Let's practice Adjectives! Each correct answer is worth 10 points.</p>
            <input type="text" id="player-name" placeholder="Type your name">
            <br>
            <button onclick="startGame()" class="btn-primary">Start!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Question 1 / 40</div>
                <div id="score">Score: 0</div>
                <div id="correct-answers">Correct: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">See Explanation</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Next Question</button>
        </div>

        <div id="results-screen">
            <h1>Game Over!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Your final score is:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Play Again</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Comparative - Regular (10)
            { question: "An elephant is _______ than a mouse.", answers: [{ text: "big", correct: false }, { text: "bigger", correct: true }, { text: "biggest", correct: false }, { text: "as big", correct: false }], explanation: "Quando comparamos duas coisas, usamos o comparativo. Para adjetivos curtos como 'big', dobramos a última letra e adicionamos '-er'." },
            { question: "The Pacific Ocean is _______ than the Atlantic Ocean.", answers: [{ text: "deep", correct: false }, { text: "deeper", correct: true }, { text: "as deep", correct: false }, { text: "the deepest", correct: false }], explanation: "Para comparar duas coisas com um adjetivo curto como 'deep', adicionamos '-er' no final." },
            { question: "My hair is _______ than my sister's hair.", answers: [{ text: "long", correct: false }, { text: "as long", correct: false }, { text: "the longest", correct: false }, { text: "longer", correct: true }], explanation: "Usamos 'longer' para comparar o comprimento de duas coisas." },
            { question: "A sports car is _______ than a regular car.", answers: [{ text: "fast", correct: false }, { text: "as fast", correct: false }, { text: "faster", correct: true }, { text: "fastest", correct: false }], explanation: "Para adjetivos curtos como 'fast', adicionamos '-er' para comparar dois itens." },
            { question: "The sun is _______ than the moon.", answers: [{ text: "brighter", correct: true }, { text: "bright", correct: false }, { text: "the brightest", correct: false }, { text: "as bright", correct: false }], explanation: "'Brighter' é a forma comparativa correta do adjetivo 'bright'." },
            { question: "Learning English can be _______ than learning Chinese.", answers: [{ text: "easy", correct: false }, { text: "easiest", correct: false }, { text: "easier", correct: true }, { text: "as easy", correct: false }], explanation: "Para adjetivos terminados em '-y', como 'easy', trocamos o 'y' por 'i' e adicionamos '-er'." },
            { question: "This road is _______ than the highway.", answers: [{ text: "more dangerous", correct: true }, { text: "dangerous", correct: false }, { text: "the most dangerous", correct: false }, { text: "dangerouser", correct: false }], explanation: "Para adjetivos longos como 'dangerous', usamos a palavra 'more' antes do adjetivo para fazer a comparação." },
            { question: "A book is often _______ than a movie.", answers: [{ text: "interesting", correct: false }, { text: "more interesting", correct: true }, { text: "the most interesting", correct: false }, { text: "interestinger", correct: false }], explanation: "Usamos 'more' antes de adjetivos longos como 'interesting' quando comparamos duas coisas." },
            { question: "My dog is _______ than your cat.", answers: [{ text: "friendly", correct: false }, { text: "friendlier", correct: true }, { text: "friendliest", correct: false }, { text: "more friendly", correct: false }], explanation: "Para adjetivos terminados em '-y', como 'friendly', trocamos o 'y' por 'i' e adicionamos '-er'." },
            { question: "Is São Paulo _______ than Rio de Janeiro?", answers: [{ text: "more crowded", correct: true }, { text: "crowded", correct: false }, { text: "crowdeder", correct: false }, { text: "the most crowded", correct: false }], explanation: "Para um adjetivo longo como 'crowded' (lotado), usamos 'more' antes dele para comparar duas cidades." },
            
            // Superlative - Regular (10)
            { question: "Mount Everest is _______ mountain in the world.", answers: [{ text: "high", correct: false }, { text: "higher than", correct: false }, { text: "the highest", correct: true }, { text: "as high", correct: false }], explanation: "Quando comparamos uma coisa com todas as outras de um grupo, usamos o superlativo. Para adjetivos curtos como 'high', usamos 'the' e adicionamos '-est'." },
            { question: "This is _______ book I have ever read.", answers: [{ text: "the longest", correct: true }, { text: "long", correct: false }, { text: "longer than", correct: false }, { text: "as long as", correct: false }], explanation: "Para dizer que este livro é mais longo que todos os outros, usamos o superlativo 'the longest'." },
            { question: "Who is _______ student in your class?", answers: [{ text: "old", correct: false }, { text: "older", correct: false }, { text: "the oldest", correct: true }, { text: "as old as", correct: false }], explanation: "Usamos o superlativo 'the oldest' para encontrar a única pessoa que é mais velha que todas as outras do grupo." },
            { question: "That was _______ party of the year!", answers: [{ text: "big", correct: false }, { text: "the biggest", correct: true }, { text: "bigger than", correct: false }, { text: "as big", correct: false }], explanation: "Para adjetivos curtos terminados em consoante-vogal-consoante, como 'big', dobramos a última letra e adicionamos '-est'. Por isso, 'the biggest'." },
            { question: "Spain is _______ country in Europe.", answers: [{ text: "sunny", correct: false }, { text: "sunnier", correct: false }, { text: "the sunniest", correct: true }, { text: "more sunny", correct: false }], explanation: "Para adjetivos terminados em '-y', como 'sunny', trocamos o 'y' por 'i' e adicionamos '-est' para a forma superlativa." },
            { question: "The cheetah is _______ land animal.", answers: [{ text: "the fastest", correct: true }, { text: "fast", correct: false }, { text: "faster", correct: false }, { text: "more fast", correct: false }], explanation: "Para dizer que ele é mais rápido que todos os outros animais terrestres, usamos o superlativo 'the fastest'." },
            { question: "A Bugatti is _______ car in the world.", answers: [{ text: "expensive", correct: false }, { text: "more expensive", correct: false }, { text: "the most expensive", correct: true }, { text: "expensivest", correct: false }], explanation: "Para adjetivos longos como 'expensive' (caro), usamos 'the most' antes da palavra para torná-la superlativa." },
            { question: "This is _______ game I have ever played.", answers: [{ text: "boring", correct: false }, { text: "more boring than", correct: false }, { text: "the most boring", correct: true }, { text: "boringer", correct: false }], explanation: "Usamos 'the most' antes de um adjetivo longo como 'boring' (chato) para dizer que ele é mais chato que todos os outros jogos." },
            { question: "Japanese is one of _______ languages to learn.", answers: [{ text: "difficult", correct: false }, { text: "more difficult", correct: false }, { text: "the most difficult", correct: true }, { text: "difficulter", correct: false }], explanation: "Para um adjetivo longo como 'difficult' (difícil), usamos 'the most' na forma superlativa." },
            { question: "What is _______ animal in the world?", answers: [{ text: "the most dangerous", correct: true }, { text: "dangerous", correct: false }, { text: "more dangerous", correct: false }, { text: "dangerouser", correct: false }], explanation: "Para comparar um animal com todos os outros, usamos a forma superlativa. Para um adjetivo longo como 'dangerous' (perigoso), usamos 'the most'." },

            // Comparative and Superlative - Special Cases (10)
            { question: "We have _______ computers now than we had 3 years ago.", answers: [{ text: "good", correct: false }, { text: "better", correct: true }, { text: "the best", correct: false }, { text: "gooder", correct: false }], explanation: "'Good' (bom) é um adjetivo irregular. A forma comparativa é 'better' (melhor)." },
            { question: "Yesterday the weather was bad, but today it is even _______.", answers: [{ text: "badder", correct: false }, { text: "the worst", correct: false }, { text: "worse", correct: true }, { text: "bad", correct: false }], explanation: "'Bad' (ruim) é um adjetivo irregular. Sua forma comparativa é 'worse' (pior)." },
            { question: "Cristiano Ronaldo was _______ FIFA Men's Player in 2016.", answers: [{ text: "good", correct: false }, { text: "better than", correct: false }, { text: "the best", correct: true }, { text: "the goodest", correct: false }], explanation: "Para dizer que ele foi melhor que todos os outros, usamos a forma superlativa. O superlativo de 'good' é 'the best' (o melhor)." },
            { question: "Monday is often considered _______ day of the week.", answers: [{ text: "bad", correct: false }, { text: "worse than", correct: false }, { text: "the worst", correct: true }, { text: "the baddest", correct: false }], explanation: "Para dizer que é pior que todos os outros dias, usamos a forma superlativa. O superlativo de 'bad' é 'the worst' (o pior)." },
            { question: "Neptune is _______ from the Sun than Mars.", answers: [{ text: "far", correct: false }, { text: "further", correct: true }, { text: "the furthest", correct: false }, { text: "farrer", correct: false }], explanation: "A forma comparativa do adjetivo irregular 'far' (longe) é 'further' ou 'farther' (mais longe)." },
            { question: "Of all the planets, Neptune is _______ from the Sun.", answers: [{ text: "far", correct: false }, { text: "further", correct: false }, { text: "the furthest", correct: true }, { text: "more far", correct: false }], explanation: "Para dizer que é mais distante que todos os outros planetas, usamos a forma superlativa. O superlativo de 'far' é 'the furthest' (o mais longe)." },
            { question: "Her English score is _______ mine.", answers: [{ text: "better", correct: false }, { text: "better than", correct: true }, { text: "good than", correct: false }, { text: "the best", correct: false }], explanation: "Ao comparar duas coisas com 'better', precisamos usar a palavra 'than' (do que) depois." },
            { question: "This is _______ movie I've ever seen.", answers: [{ text: "bad", correct: false }, { text: "worse", correct: false }, { text: "the worst", correct: true }, { text: "worst", correct: false }], explanation: "A forma superlativa de 'bad' (ruim) é 'the worst' (o pior), significando que é pior que todos os outros filmes." },
            { question: "I need _______ information about the trip.", answers: [{ text: "far", correct: false }, { text: "further", correct: true }, { text: "the furthest", correct: false }, { text: "more far", correct: false }], explanation: "'Further' também pode significar 'mais' ou 'adicional'. Então 'further information' significa 'mais informações'." },
            { question: "Super Mario Bros is _______ Pokémon.", answers: [{ text: "good", correct: false }, { text: "better than", correct: true }, { text: "the best", correct: false }, { text: "as good", correct: false }], explanation: "Para comparar duas coisas usando o adjetivo irregular 'good', usamos 'better than' (melhor do que)." },

            // Suffixes -ful and -less (10)
            { question: "The suffix '-ful' means:", answers: [{ text: "Without", correct: false }, { text: "Full of", correct: true }, { text: "Less", correct: false }, { text: "Before", correct: false }], explanation: "O sufixo '-ful' significa 'cheio de' ou 'com aquela qualidade'. Por exemplo, 'careful' significa 'cheio de cuidado'." },
            { question: "The suffix '-less' means:", answers: [{ text: "Full of", correct: false }, { text: "A lot", correct: false }, { text: "Without", correct: true }, { text: "After", correct: false }], explanation: "O sufixo '-less' significa 'sem'. Por exemplo, 'homeless' significa 'sem casa'." },
            { question: "A _______ person is someone who helps a lot.", answers: [{ text: "Helpless", correct: false }, { text: "Helpful", correct: true }, { text: "Helping", correct: false }, { text: "Helped", correct: false }], explanation: "Alguém 'cheio de ajuda' (full of help) é uma pessoa 'helpful'." },
            { question: "If something has no color, it is _______.", answers: [{ text: "Colorful", correct: false }, { text: "Colorless", correct: true }, { text: "Colored", correct: false }, { text: "Coloring", correct: false }], explanation: "Algo 'sem cor' (without color) é 'colorless'." },
            { question: "A rainbow is very _______.", answers: [{ text: "colorless", correct: false }, { text: "colorful", correct: true }, { text: "colored", correct: false }, { text: "color", correct: false }], explanation: "Um arco-íris é 'cheio de cor' (full of color), então ele é 'colorful'." },
            { question: "A person who is not afraid is _______.", answers: [{ text: "fearful", correct: false }, { text: "fearless", correct: true }, { text: "fearing", correct: false }, { text: "feared", correct: false }], explanation: "Alguém 'sem medo' (without fear) é 'fearless'." },
            { question: "If you have hope, you are _______.", answers: [{ text: "hopeless", correct: false }, { text: "hopeful", correct: true }, { text: "hoping", correct: false }, { text: "hoped", correct: false }], explanation: "Uma pessoa 'cheia de esperança' (full of hope) é 'hopeful'." },
            { question: "A broken toy that cannot be used is _______.", answers: [{ text: "useful", correct: false }, { text: "useless", correct: true }, { text: "used", correct: false }, { text: "using", correct: false }], explanation: "Algo que é 'sem uso' (without use) é 'useless'." },
            { question: "Thank you for the food! I am very _______.", answers: [{ text: "thankless", correct: false }, { text: "thankful", correct: true }, { text: "thanking", correct: false }, { text: "thanked", correct: false }], explanation: "Quando você está 'cheio de gratidão' (full of thanks), você está 'thankful'." },
            { question: "A soup with no flavor is _______.", answers: [{ text: "tasteless", correct: true }, { text: "tasteful", correct: false }, { text: "tasting", correct: false }, { text: "tasted", correct: false }], explanation: "Algo 'sem sabor' (without taste) é 'tasteless'." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Player 1";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Score: 0`;
            correctAnswersText.innerText = `Correct: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            const correct = selectedButton.dataset.correct === 'true';
            
            // Salvar a resposta do usuário
            const currentQuestion = questions[currentQuestionIndex];
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: correctAnswer.text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Score: ${score}`;
                correctAnswersText.innerText = `Correct: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `You answered ${correctAnswersCount} out of ${totalQuestions} questions correctly.`;
            
             if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = ''; // Limpa a revisão anterior
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                    }
                    answersHtml += `<p class="${classList}">${ans.text}</p>`;
                });

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
