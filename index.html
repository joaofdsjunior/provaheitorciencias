<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Geografia - Mundo Globalizado</title>
    <style>
        /* --- GERAL E TEMA ROBLOX --- */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

        :root {
            --roblox-blue: #00A2FF;
            --roblox-dark-blue: #0084cc;
            --roblox-grey: #A3A3A3;
            --roblox-light-grey: #E3E3E3;
            --roblox-dark-grey: #545454;
            --success-color: #00B06F;
            --danger-color: #FF4F4F;
            --background-color: #F2F2F2;
            
            --btn-c1: #7BBDFF; /* Azul */
            --btn-c2: #B57BFF; /* Roxo */
            --btn-c3: #FFB37B; /* Laranja */
            --btn-c4: #7BFFD9; /* Turquesa */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--roblox-dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--roblox-light-grey); text-align: center; overflow: hidden; }
        .fade-out { opacity: 0; transform: translateY(-20px); transition: opacity 0.3s ease-out, transform 0.3s ease-out; }
        .fade-in { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease-in, transform 0.4s ease-in; }
        h1, h2 { margin-bottom: 20px; color: var(--roblox-dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--roblox-blue); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--roblox-blue); color: white; border-bottom: 6px solid var(--roblox-dark-blue); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--roblox-dark-blue); }
        .btn-primary:hover { background-color: #00aeff; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--roblox-light-grey); margin-bottom: 15px; width: 100%; }
        
        /* Telas */
        #start-screen, #quiz-screen, #results-screen, #explanation-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--roblox-light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--roblox-dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #689fd9; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #9c68d9; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #d99668; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #68d9b8; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--roblox-dark-grey); background-color: var(--roblox-light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #008a58 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #cc3f3f !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        /* --- NOVOS ESTILOS PARA PRÊMIOS E COMPARTILHAMENTO --- */
        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }
        #share-notification { color: var(--success-color); font-family: 'Poppins', sans-serif; font-weight: 600; height: 20px; }
        .question-statements { font-family: 'Poppins', sans-serif; text-align: left; margin: 0 auto 1rem auto; max-width: 90%; font-size: 1rem; }

        /* --- OTIMIZAÇÃO PARA DESKTOP (TELAS MAIORES) --- */
        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- TELA INICIAL -->
        <div id="start-screen">
            <h1>Quiz de Geografia</h1>
            <p>Teste seus conhecimentos sobre o Mundo Globalizado! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Jogar</button>
        </div>

        <!-- TELA DO QUIZ -->
        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 50</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
        </div>
        
        <!-- TELA DE EXPLICAÇÃO -->
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <!-- TELA DE RESULTADOS -->
        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--roblox-blue);"></p>
            <button onclick="shareResult()" class="btn-primary">Desafiar Amigos!</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
            <div id="share-notification"></div>
        </div>
    </div>

    <script>
        // --- BANCO DE PERGUNTAS E MENSAGENS---
        const allQuestions = [
            // Perguntas de Múltipla Escolha (35)
            { question: "Qual fase do capitalismo é marcada pela união do capital industrial com o capital bancário?", answers: [{ text: "Comercial", correct: false }, { text: "Financeiro", correct: true }, { text: "Industrial", correct: false }, { text: "Mercantilismo", correct: false }], explanation: "O Capitalismo Financeiro, a partir do século XX, é definido pela fusão entre bancos e indústrias, formando grandes conglomerados que controlam a economia." },
            { question: "O que são empresas multinacionais ou transnacionais?", answers: [{ text: "Empresas que vendem produtos para vários países, mas produzem tudo em um só lugar.", correct: false }, { text: "Empresas estatais que atuam em setores estratégicos como petróleo e energia.", correct: false }, { text: "Empresas que possuem sede em um país e espalham filiais de produção ou venda em diversos outros países.", correct: true }, { text: "Empresas que pertencem a vários países ao mesmo tempo, através de acordos governamentais.", correct: false }], explanation: "A principal característica de uma multinacional é ter sua matriz em um país de origem e operar em escala global com filiais em outras nações." },
            { question: "A divisão do mundo em 'Norte' (rico) e 'Sul' (pobre) é uma regionalização baseada em qual critério principal?", answers: [{ text: "Geográfico, separando os hemisférios Norte e Sul pela Linha do Equador.", correct: false }, { text: "Cultural, separando países de origem anglo-saxã dos de origem latina.", correct: false }, { text: "Socioeconômico, agrupando países com base em seus níveis de desenvolvimento, industrialização e riqueza.", correct: true }, { text: "Político, separando as democracias das ditaduras.", correct: false }], explanation: "A divisão Norte-Sul é uma classificação socioeconômica. Por isso, países como Austrália e Nova Zelândia, que estão no Hemisfério Sul geográfico, pertencem ao 'Norte' rico." },
            { question: "Qual dos seguintes fatores NÃO é um atrativo para uma empresa multinacional instalar uma filial em um país subdesenvolvido?", answers: [{ text: "Mão de obra barata e abundante.", correct: false }, { text: "Leis ambientais rígidas e fiscalização intensa.", correct: true }, { text: "Incentivos fiscais, como isenção de impostos.", correct: false }, { text: "Acesso a matérias-primas a baixo custo.", correct: false }], explanation: "Multinacionais buscam maximizar lucros. Leis ambientais rígidas representam custos mais altos com adequação e multas, sendo um fator que desestimula, e não atrai, a instalação de fábricas." },
            { question: "Na Divisão Internacional do Trabalho (DIT), qual é o papel típico dos países desenvolvidos?", answers: [{ text: "Fornecer produtos agrícolas e minerais para o mercado mundial.", correct: false }, { text: "Exportar produtos industrializados de baixa tecnologia e mão de obra intensiva.", correct: false }, { text: "Exportar tecnologia de ponta, capitais para investimento e serviços especializados.", correct: true }, { text: "Ser a sede das fábricas que produzem bens de consumo para o mundo todo.", correct: false }], explanation: "Os países desenvolvidos concentram a produção de conhecimento e tecnologia. Eles exportam produtos de alto valor agregado e capital, enquanto importam matérias-primas e produtos de menor valor." },
            { question: "O que caracteriza um país como 'subdesenvolvido'?", answers: [{ text: "Possuir um grande território e uma população numerosa.", correct: false }, { text: "Ter uma economia baseada na exportação de produtos primários e grande desigualdade social.", correct: true }, { text: "Não pertencer a nenhum bloco econômico importante, como a União Europeia.", correct: false }, { text: "Ter um governo socialista e uma economia planificada pelo Estado.", correct: false }], explanation: "O subdesenvolvimento é marcado pela dependência econômica, foco no setor primário, industrialização tardia ou inexistente, e altos índices de desigualdade social e pobreza." },
            { question: "Qual foi o principal motor tecnológico para a aceleração da globalização?", answers: [{ text: "A invenção da máquina a vapor na Revolução Industrial.", correct: false }, { text: "A Revolução Técnico-Científico-Informacional, com a internet, satélites e computadores.", correct: true }, { text: "A expansão das ferrovias no século XIX.", correct: false }, { text: "O desenvolvimento da energia nuclear após a Segunda Guerra Mundial.", correct: false }], explanation: "A terceira revolução industrial, ou Revolução Técnico-Científico-Informacional, com suas tecnologias de comunicação e transporte, foi o que permitiu a integração mundial em tempo real, característica da globalização." },
            { question: "O que são países 'emergentes'?", answers: [{ text: "São os países mais pobres do mundo, sem nenhuma industrialização.", correct: false }, { text: "São países subdesenvolvidos que passaram por uma industrialização recente e apresentam crescimento econômico.", correct: true }, { text: "É um sinônimo para os países desenvolvidos do 'Norte'.", correct: false }, { text: "São países que saíram do socialismo e estão se adaptando ao capitalismo.", correct: false }], explanation: "Países emergentes, como Brasil, Rússia, Índia, China e África do Sul (BRICS), fazem parte do 'Sul' pobre, mas se destacam por sua industrialização e maior participação na economia global." },
            { question: "Durante a Guerra Fria, o mundo era considerado 'bipolar'. O que isso significava?", answers: [{ text: "Que o mundo era dividido entre o Hemisfério Norte e o Hemisfério Sul.", correct: false }, { text: "Que havia dois polos de poder militar e ideológico: os EUA (capitalista) e a URSS (socialista).", correct: true }, { text: "Que a economia era dividida entre países industrializados e países agrários.", correct: false }, { text: "Que o poder se concentrava em dois continentes: Europa e América.", correct: false }], explanation: "A ordem bipolar da Guerra Fria foi marcada pela disputa entre o bloco capitalista, liderado pelos EUA, e o bloco socialista, liderado pela União Soviética." },
            { question: "Por que uma multinacional fragmenta sua produção em vários países?", answers: [{ text: "Para gerar mais empregos em todos os continentes para ajudar no desenvolvimento local.", correct: false }, { text: "Para reduzir os custos de produção, aproveitando as vantagens de cada local (mão de obra, impostos, etc.) para aumentar o lucro.", correct: true }, { text: "Para cumprir as leis internacionais de distribuição de renda.", correct: false }, { text: "Para testar a qualidade de seus produtos em diferentes climas e culturas.", correct: false }], explanation: "A fragmentação da produção é uma estratégia para baratear o produto final, buscando o menor custo em cada etapa (mão de obra, impostos, etc.)." },
            { question: "O que é 'regionalizar' o espaço geográfico?", answers: [{ text: "Desenhar as fronteiras exatas de cada país.", correct: false }, { text: "Dividir um espaço em áreas menores com base em critérios comuns para facilitar o estudo.", correct: true }, { text: "Criar um mapa-múndi com todos os continentes e oceanos.", correct: false }, { text: "Estudar apenas as regiões mais ricas do planeta.", correct: false }], explanation: "Regionalizar é agrupar áreas que possuem características semelhantes (clima, economia, cultura, etc.) para poder analisá-las e compreendê-las melhor." },
            { question: "A fase do capitalismo marcada pelas Grandes Navegações e o acúmulo de metais preciosos é chamada de:", answers: [{ text: "Capitalismo Financeiro", correct: false }, { text: "Capitalismo Industrial", correct: false }, { text: "Capitalismo Comercial", correct: true }, { text: "Neoliberalismo", correct: false }], explanation: "O Capitalismo Comercial (séculos XV-XVIII) foi a fase inicial, baseada na exploração colonial e no mercantilismo." },
            { question: "Com o fim da Guerra Fria e o colapso da URSS, a ordem mundial deixou de ser bipolar e passou a ser:", answers: [{ text: "Unipolar, com domínio exclusivo da China.", correct: false }, { text: "Multipolar, com vários polos de poder econômico e/ou militar.", correct: true }, { text: "Apolar, sem nenhum centro de poder definido.", correct: false }, { text: "Regional, com cada continente se governando de forma isolada.", correct: false }], explanation: "A Nova Ordem Mundial é multipolar, com centros de poder como EUA, União Europeia e China disputando a influência global." },
            { question: "Quais são os três pilares do IDH (Índice de Desenvolvimento Humano)?", answers: [{ text: "PIB, inflação e taxa de juros.", correct: false }, { text: "Renda, Educação e Saúde (expectativa de vida).", correct: true }, { text: "Segurança, liberdade de imprensa e número de indústrias.", correct: false }, { text: "Crescimento populacional, urbanização e exportações.", correct: false }], explanation: "O IDH vai além da economia, analisando a renda (PIB per capita), a educação (anos de estudo) e a saúde (expectativa de vida ao nascer) para medir o desenvolvimento." },
            { question: "Como era a DIT na época do Capitalismo Comercial?", answers: [{ text: "Metrópoles produziam manufaturas e colônias forneciam metais preciosos e produtos tropicais.", correct: true }, { text: "Países desenvolvidos exportavam tecnologia e países subdesenvolvidos exportavam produtos industrializados.", correct: false }, { text: "Todos os países competiam de forma igual no mercado internacional.", correct: false }, { text: "O bloco socialista fornecia produtos industriais para o bloco capitalista.", correct: false }], explanation: "Na DIT clássica do colonialismo, a relação era simples: a colônia era forçada a fornecer matérias-primas baratas para a metrópole e a comprar os produtos manufaturados dela." },
            { question: "A classificação 'Primeiro, Segundo e Terceiro Mundo' foi muito utilizada durante qual período histórico?", answers: [{ text: "Primeira Guerra Mundial", correct: false }, { text: "Guerra Fria", correct: true }, { text: "Expansão Marítima", correct: false }, { text: "Idade Média", correct: false }], explanation: "Essa classificação era ideológica: 1º Mundo (capitalistas ricos), 2º Mundo (socialistas) e 3º Mundo (países não alinhados, em sua maioria pobres)." },
            { question: "O que defende o Neoliberalismo, política que se expandiu com a globalização?", answers: [{ text: "Uma política de forte intervenção do Estado na economia para garantir o bem-estar social.", correct: false }, { text: "Uma política que defende a mínima intervenção do Estado na economia, com privatizações e livre mercado.", correct: true }, { text: "Um novo sistema econômico que busca substituir o capitalismo.", correct: false }, { text: "Uma política de fechamento das fronteiras para proteger a indústria nacional.", correct: false }], explanation: "O Neoliberalismo prega que o Estado deve interferir o mínimo possível na economia, deixando que o mercado se autorregule. Isso inclui privatizar empresas estatais e abrir o mercado para a concorrência internacional." },
            { question: "Qual das seguintes organizações internacionais é um exemplo de bloco econômico?", answers: [{ text: "ONU (Organização das Nações Unidas)", correct: false }, { text: "União Europeia", correct: true }, { text: "OTAN (Organização do Tratado do Atlântico Norte)", correct: false }, { text: "OMS (Organização Mundial da Saúde)", correct: false }], explanation: "A União Europeia é o exemplo mais avançado de bloco econômico, com livre circulação de pessoas, mercadorias, serviços e capital, além de uma moeda única (o euro)." },
            { question: "A divisão entre países do 'centro' e da 'periferia' se refere a quê?", answers: [{ text: "À localização geográfica dos países em relação à Linha do Equador.", correct: false }, { text: "À relação de poder e dependência econômica no sistema capitalista.", correct: true }, { text: "À densidade populacional, separando países muito povoados dos pouco povoados.", correct: false }, { text: "À forma de governo, separando repúblicas de monarquias.", correct: false }], explanation: "Nessa visão, os países do 'centro' (desenvolvidos) detêm o poder de decisão e o capital, enquanto os da 'periferia' (subdesenvolvidos) são dependentes e fornecem recursos." },
            { question: "Qual o principal objetivo de um país ao participar de um bloco econômico?", answers: [{ text: "Aumentar suas forças armadas e poder militar.", correct: false }, { text: "Fortalecer suas relações comerciais com os países membros, reduzindo tarifas e barreiras.", correct: true }, { text: "Adotar a mesma cultura e língua dos outros membros.", correct: false }, { text: "Isolar-se economicamente do resto do mundo.", correct: false }], explanation: "Os blocos econômicos são criados para facilitar o comércio entre os países membros, tornando seus produtos mais competitivos e fortalecendo suas economias em conjunto." },
            { question: "Qual das seguintes opções descreve melhor a Nova DIT?", answers: [{ text: "Países pobres exportam matérias-primas e países ricos exportam tecnologia.", correct: false }, { text: "Países ricos sediam a pesquisa e o desenvolvimento, enquanto países emergentes recebem as fábricas.", correct: true }, { text: "Todos os países produzem e exportam os mesmos tipos de produtos.", correct: false }, { text: "Países socialistas produzem para países capitalistas.", correct: false }], explanation: "A Nova DIT é marcada pela descentralização da produção industrial. As fábricas se movem para o Sul em busca de vantagens, mas a tecnologia e o lucro continuam concentrados no Norte." },
            { question: "O que é um país com 'economia planificada', como era o caso da antiga URSS?", answers: [{ text: "Um país sem indústrias, focado apenas no planejamento agrícola.", correct: false }, { text: "Um país onde o Estado controla todos os meios de produção e define o que será produzido.", correct: true }, { text: "Um país que planeja sua economia com base no livre mercado e na concorrência.", correct: false }, { text: "Um país que planeja se tornar uma potência mundial em 5 anos.", correct: false }], explanation: "Na economia planificada, típica do socialismo, não há propriedade privada dos meios de produção (fábricas, terras). O Estado é o dono de tudo e planeja a produção para atender às necessidades da sociedade, sem visar o lucro." },
            { question: "As políticas da 'Glasnost' e 'Perestroika' na União Soviética representaram:", answers: [{ text: "O endurecimento do regime socialista e o fechamento da economia.", correct: false }, { text: "Uma abertura política (transparência) e uma reestruturação econômica (abertura ao mercado).", correct: true }, { text: "Uma aliança militar com os Estados Unidos para acabar com a Guerra Fria.", correct: false }, { text: "Um grande investimento em tecnologia para a corrida espacial.", correct: false }], explanation: "Implementadas por Mikhail Gorbachev, a Glasnost (transparência política) e a Perestroika (reestruturação econômica) foram tentativas de reformar o socialismo soviético, mas acabaram acelerando seu colapso." },
            { question: "Qual é a principal crítica feita à globalização por parte dos países subdesenvolvidos?", answers: [{ text: "Ela aumenta o isolamento cultural dos países.", correct: false }, { text: "Ela aprofunda a desigualdade, pois beneficia muito mais os países ricos e as grandes corporações.", correct: true }, { text: "Ela dificulta o acesso a novas tecnologias e informações.", correct: false }, { text: "Ela enfraquece as empresas multinacionais, que perdem poder.", correct: false }], explanation: "Apesar de conectar o mundo, a globalização opera em uma lógica de mercado que favorece quem já é mais forte. Os países ricos e suas empresas se beneficiam mais, muitas vezes aumentando a dependência e a desigualdade dos países pobres." },
            { question: "A linha imaginária que divide o mundo em Norte (rico) e Sul (pobre) passa por cima ou por baixo da Austrália e Nova Zelândia?", answers: [{ text: "Passa por cima, colocando-as no Sul (pobre).", correct: false }, { text: "Passa por baixo, colocando-as no Norte (rico).", correct: true }, { text: "Corta os dois países ao meio.", correct: false }, { text: "Não inclui a Oceania.", correct: false }], explanation: "A linha é socioeconômica, não geográfica. Como Austrália e Nova Zelândia são países desenvolvidos, a linha faz uma curva para o sul para incluí-los no grupo do 'Norte' rico." },
            // Perguntas de Verdadeiro ou Falso (15)
            { question: "Analise as afirmações sobre a Globalização:<br><div class='question-statements'>I - É um processo que diminuiu a desigualdade entre os países ricos e pobres.<br>II - Foi impulsionada pelos avanços na tecnologia de transporte e comunicação.<br>III - Aumentou a influência das empresas multinacionais na economia mundial.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "A II e a III são verdadeiras.", correct: true }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A globalização, na verdade, acentuou a desigualdade (I é falsa), mas foi fortemente impulsionada pela tecnologia (II é verdadeira) e fortaleceu o poder das multinacionais (III é verdadeira)." },
            { question: "Sobre a divisão Norte-Sul, julgue os itens:<br><div class='question-statements'>I - É uma divisão puramente geográfica baseada na Linha do Equador.<br>II - A Austrália, embora no hemisfério sul, é considerada um país do 'Norte'.<br>III - Todos os países do 'Sul' possuem o mesmo nível de subdesenvolvimento.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "A divisão é socioeconômica, não geográfica (I é falsa). A Austrália é um país rico, logo, do 'Norte' (II é verdadeira). Os países do 'Sul' são muito diversos, incluindo desde emergentes como o Brasil até os mais pobres da África (III é falsa)." },
            { question: "A respeito das empresas multinacionais, analise:<br><div class='question-statements'>I - Elas sempre instalam suas sedes e centros de pesquisa nos países mais pobres.<br>II - Elas buscam mão de obra barata e incentivos fiscais para instalar suas fábricas.<br>III - A fragmentação da produção em vários países é uma estratégia para reduzir custos.</div>", answers: [{ text: "A I e a II são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: true }, { text: "A I e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "As sedes e a tecnologia ficam nos países ricos (I é falsa). A busca por vantagens como mão de obra barata e a fragmentação da produção são estratégias comuns (II e III são verdadeiras)." },
            { question: "Sobre a Divisão Internacional do Trabalho (DIT), julgue as sentenças:<br><div class='question-statements'>I - Na DIT atual, países subdesenvolvidos exportam apenas produtos agrícolas.<br>II - Países desenvolvidos concentram a exportação de tecnologia e capitais.<br>III - É uma divisão igualitária que beneficia todos os países da mesma forma.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "Muitos países subdesenvolvidos (emergentes) também exportam produtos industrializados (I é falsa). A DIT é desigual e reforça a dependência (III é falsa). Apenas a afirmação II está correta." },
            { question: "Analise os indicadores socioeconômicos:<br><div class='question-statements'>I - Um país com baixo IDH geralmente possui alta expectativa de vida e baixa mortalidade infantil.<br>II - O PIB per capita é a soma de todas as riquezas de um país dividida pela sua população.<br>III - Países desenvolvidos costumam ter altas taxas de analfabetismo.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "Baixo IDH significa indicadores sociais ruins (I é falsa). Países desenvolvidos têm baixíssimo analfabetismo (III é falsa). A definição de PIB per capita está correta (II é verdadeira)." },
            { question: "Sobre as fases do capitalismo, julgue os itens:<br><div class='question-statements'>I - O Capitalismo Comercial foi marcado pela Revolução Industrial.<br>II - O Capitalismo Financeiro é caracterizado por grandes bancos e corporações.<br>III - O Mercantilismo foi a política da fase Industrial.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: true }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A Revolução Industrial marca o Capitalismo Industrial (I é falsa). O Mercantilismo foi a política do Capitalismo Comercial (III é falsa). Apenas a afirmação II está correta." },
            { question: "A respeito da Ordem Mundial, analise:<br><div class='question-statements'>I - Durante a Guerra Fria, a ordem era multipolar.<br>II - Com o fim da URSS, a ordem passou a ser bipolar.<br>III - Atualmente, vivemos em uma ordem multipolar, com vários centros de poder.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: true }, { text: "Todas são falsas.", correct: false }], explanation: "A ordem da Guerra Fria era bipolar (I é falsa). Com o fim da URSS, tornou-se unipolar por um tempo e hoje é multipolar (II é falsa). A afirmação III é a única correta." },
            { question: "Sobre a regionalização do mundo, julgue as afirmações:<br><div class='question-statements'>I - O critério natural (clima, relevo) é o único utilizado para regionalizar.<br>II - A divisão Norte-Sul é um exemplo de regionalização socioeconômica.<br>III - As regionalizações são divisões rígidas que nunca mudam.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "Existem vários critérios além do natural (I é falsa). As regionalizações são dinâmicas e mudam com o tempo (III é falsa). A divisão Norte-Sul é o principal exemplo de critério socioeconômico (II é verdadeira)." },
            { question: "Analise as afirmações sobre países desenvolvidos e subdesenvolvidos:<br><div class='question-statements'>I - Países desenvolvidos são as antigas colônias de exploração.<br>II - Países subdesenvolvidos são as antigas metrópoles.<br>III - A relação histórica de exploração colonial é um fator que ajuda a explicar o subdesenvolvimento.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: true }, { text: "Todas são falsas.", correct: false }], explanation: "A relação é o oposto: países desenvolvidos são, em geral, as antigas metrópoles (II é falsa), e os subdesenvolvidos, as antigas colônias (I é falsa). A herança da exploração colonial é, sim, uma causa histórica do subdesenvolvimento (III é verdadeira)." },
            { question: "Sobre a globalização, julgue os itens:<br><div class='question-statements'>I - Padroniza hábitos de consumo.<br>II - Beneficia todos os países igualmente.<br>III - Diminuiu a importância das fronteiras para a economia.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "A I e a III são verdadeiras.", correct: true }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A globalização de fato padroniza o consumo (I é verdadeira) e diminui a importância das fronteiras para as empresas (III é verdadeira). No entanto, ela não é igualitária e tende a beneficiar mais os países ricos (II é falsa)." },
            { question: "Sobre os BRICS (Brasil, Rússia, Índia, China e África do Sul):<br><div class='question-statements'>I - São todos considerados países desenvolvidos do Norte.<br>II - São um grupo de países emergentes com economia em crescimento.<br>III - Possuem baixíssimos níveis de desigualdade social, similar aos países europeus.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "Os BRICS são o principal exemplo de países emergentes do Sul (I é falsa). Apesar do crescimento econômico, todos ainda enfrentam grandes desafios e desigualdades sociais (III é falsa). Apenas a afirmação II está correta." },
            { question: "Sobre a Nova DIT, julgue:<br><div class='question-statements'>I - O Sul passou a exportar também produtos industrializados.<br>II - A produção de tecnologia continua concentrada no Norte.<br>III - A dependência entre Norte e Sul deixou de existir.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "A I e a II são verdadeiras.", correct: true }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "Com a ida de fábricas para o Sul, esses países passaram a exportar industrializados (I é verdadeira). A tecnologia e a pesquisa, no entanto, continuam no Norte (II é verdadeira). A relação de dependência apenas mudou de forma, mas não acabou (III é falsa)." },
            { question: "A respeito do Capitalismo Financeiro, analise:<br><div class='question-statements'>I - É a fase do surgimento das primeiras fábricas.<br>II - O controle da economia é de grandes bancos e corporações.<br>III - O Estado não interfere na economia.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "As fábricas surgem no Capitalismo Industrial (I é falsa). Embora o neoliberalismo defenda a mínima intervenção, o Estado ainda atua na economia, por exemplo, para salvar bancos em crises (III é falsa). A principal característica é o domínio de bancos e grandes empresas (II é verdadeira)." },
            { question: "Sobre as multinacionais, julgue os itens:<br><div class='question-statements'>I - O lucro gerado nas filiais volta para o país de origem.<br>II - Elas pagam salários iguais aos do país de origem.<br>III - Elas ajudam a espalhar um padrão de consumo global.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "A I e a III são verdadeiras.", correct: true }, { text: "Todas são verdadeiras.", correct: false }], explanation: "O lucro volta para a matriz (I é verdadeira) e elas padronizam o consumo (III é verdadeira). Elas buscam países pobres para pagar salários mais baixos (II é falsa)." },
            { question: "Analise as afirmações sobre a Ordem Mundial:<br><div class='question-statements'>I - A ordem bipolar era militar e ideológica.<br>II - A ordem multipolar atual se baseia apenas no poder militar.<br>III - Japão e Alemanha são polos de poder econômico.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "A I e a III são verdadeiras.", correct: true }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A ordem bipolar era militar e ideológica (I é verdadeira). A multipolar é principalmente econômica, mas também militar e cultural (II é falsa). Japão e Alemanha são grandes potências econômicas (III é verdadeira)." }
        ];
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?" ];

        // --- ELEMENTOS DO DOM ---
        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const shareNotification = document.getElementById('share-notification');
        
        // --- VARIÁVEIS DO JOGO ---
        let questions = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        // --- FUNÇÕES DE NAVEGAÇÃO ---
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; allScreens[screenName].classList.add('fade-in'); }

        // --- FUNÇÕES DO JOGO ---
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions];
            shuffleArray(questions);
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question; // Usar innerHTML para renderizar as tags <br>
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { while (answersContainer.firstChild) { answersContainer.removeChild(answersContainer.firstChild); } }

        function selectAnswer(e) {
            const selectedButton = e.target;
            const correct = selectedButton.dataset.correct === 'true';

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) button.classList.add('correct');
                button.disabled = true;
            });
            
            setTimeout(() => showExplanation(correct), 1500);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const maxScore = totalQuestions * 10;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score} / ${maxScore}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Heitor de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function shareResult() {
            const textToCopy = `Consegui ${score} pontos no Quiz de Geografia! Tente me superar! Para jogar, peça o arquivo "quiz.html" para o Heitor.`;
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            shareNotification.innerText = 'Mensagem copiada!';
            setTimeout(() => {
                shareNotification.innerText = '';
            }, 2000);
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
