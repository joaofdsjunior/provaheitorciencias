<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Ciências - Prova de Amanhã</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #10b981; /* Verde */
            --theme-dark: #059669;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #14b8a6; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #e0e7ff; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz de Ciências</h1>
            <p>Preparação final para a prova! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Sistema Nervoso (10)
            { question: "Qual a função principal do Sistema Nervoso?", answers: [{ text: "Transportar sangue pelo corpo.", correct: false }, { text: "Coordenar as ações do corpo e processar informações.", correct: true }, { text: "Digestar os alimentos.", correct: false }, { text: "Produzir hormônios.", correct: false }], explanation: "O Sistema Nervoso é como o 'chefe' do corpo, controlando tudo, desde os movimentos até os pensamentos e sentimentos." },
            { question: "O Sistema Nervoso Central (SNC) é composto por quais órgãos?", answers: [{ text: "Nervos e gânglios.", correct: false }, { text: "Encéfalo e medula espinhal.", correct: true }, { text: "Coração e pulmões.", correct: false }, { text: "Músculos e ossos.", correct: false }], explanation: "O SNC é o centro de processamento. O encéfalo (cérebro, cerebelo, tronco) pensa e comanda, e a medula espinhal leva e traz informações entre o encéfalo e o corpo." },
            { question: "Qual a função do Sistema Nervoso Periférico (SNP)?", answers: [{ text: "Pensar e tomar decisões.", correct: false }, { text: "Conectar o Sistema Nervoso Central ao resto do corpo.", correct: true }, { text: "Bombear o sangue.", correct: false }, { text: "Produzir energia.", correct: false }], explanation: "O SNP é formado pelos nervos, que funcionam como 'fios' levando informações dos sentidos para o SNC e trazendo os comandos do SNC para os músculos e órgãos." },
            { question: "Qual o nome da célula principal do Sistema Nervoso?", answers: [{ text: "Glóbulo vermelho", correct: false }, { text: "Neurônio", correct: true }, { text: "Hormônio", correct: false }, { text: "Glândula", correct: false }], explanation: "Os neurônios são as células especializadas em transmitir os impulsos nervosos, permitindo a comunicação rápida por todo o corpo." },
            { question: "O que é uma sinapse?", answers: [{ text: "Um tipo de osso.", correct: false }, { text: "A conexão entre dois neurônios por onde passa a informação.", correct: true }, { text: "Uma parte do coração.", correct: false }, { text: "Um hormônio do crescimento.", correct: false }], explanation: "A sinapse é o 'ponto de encontro' entre neurônios. A informação passa de um para o outro através de sinais químicos (neurotransmissores)." },
            { question: "Qual parte do encéfalo é responsável pelo equilíbrio e coordenação dos movimentos?", answers: [{ text: "Córtex", correct: false }, { text: "Cerebelo", correct: true }, { text: "Tronco encefálico", correct: false }, { text: "Medula", correct: false }], explanation: "O cerebelo, localizado na parte de trás do encéfalo, é essencial para que nossos movimentos sejam precisos e coordenados, como andar de bicicleta." },
            { question: "O que são atos reflexos?", answers: [{ text: "Movimentos que aprendemos.", correct: false }, { text: "Respostas rápidas e involuntárias a um estímulo, controladas pela medula.", correct: true }, { text: "Pensamentos profundos.", correct: false }, { text: "Ações que só o cérebro controla.", correct: false }], explanation: "O reflexo é uma resposta automática para proteger o corpo, como tirar a mão do fogo. A medula comanda a ação antes mesmo de o cérebro 'saber' o que aconteceu." },
            { question: "Qual parte do neurônio geralmente recebe os impulsos nervosos de outros neurônios?", answers: [{ text: "Axônio", correct: false }, { text: "Dendritos", correct: true }, { text: "Corpo Celular", correct: false }, { text: "Bainha de Mielina", correct: false }], explanation: "Os dendritos são como 'antenas' do neurônio, captando os sinais vindos de outras células nervosas." },
            { question: "Qual parte do neurônio geralmente transmite o impulso nervoso para outros neurônios ou músculos?", answers: [{ text: "Dendritos", correct: false }, { text: "Axônio", correct: true }, { text: "Corpo Celular", correct: false }, { text: "Sinapse", correct: false }], explanation: "O axônio é o 'fio' longo que conduz o impulso nervoso para longe do corpo celular, em direção à próxima célula." },
             { question: "Qual o nome das substâncias químicas liberadas na sinapse para transmitir a informação entre neurônios?", answers: [{ text: "Hormônios", correct: false }, { text: "Neurotransmissores", correct: true }, { text: "Enzimas", correct: false }, { text: "Anticorpos", correct: false }], explanation: "Neurotransmissores como a dopamina, serotonina e acetilcolina são os mensageiros químicos que permitem a comunicação entre as células nervosas." },

            // Sistema Endócrino (15)
            { question: "O que são glândulas endócrinas?", answers: [{ text: "Glândulas que produzem suor.", correct: false }, { text: "Glândulas que produzem hormônios e os liberam diretamente no sangue.", correct: true }, { text: "Glândulas que produzem lágrimas.", correct: false }, { text: "Glândulas que ajudam na digestão.", correct: false }], explanation: "As glândulas endócrinas são as 'fábricas' de hormônios. Elas não têm canais, então liberam os hormônios direto na corrente sanguínea." },
            { question: "O que são hormônios?", answers: [{ text: "Células nervosas.", correct: false }, { text: "Mensageiros químicos que viajam pelo sangue e controlam funções do corpo.", correct: true }, { text: "Nutrientes dos alimentos.", correct: false }, { text: "Partes dos músculos.", correct: false }], explanation: "Hormônios são como 'mensagens' enviadas pelas glândulas para outras partes do corpo, dizendo o que fazer (crescer, sentir fome, dormir, etc.)." },
            { question: "Qual glândula é chamada de 'glândula mestra' por controlar outras glândulas?", answers: [{ text: "Tireoide", correct: false }, { text: "Hipófise", correct: true }, { text: "Pâncreas", correct: false }, { text: "Suprarrenais", correct: false }], explanation: "A hipófise, localizada na base do cérebro, produz hormônios que comandam o funcionamento de várias outras glândulas importantes." },
            { question: "Qual hormônio produzido pela Hipófise é responsável pelo crescimento do corpo?", answers: [{ text: "Insulina", correct: false }, { text: "GH (Hormônio do Crescimento)", correct: true }, { text: "Adrenalina", correct: false }, { text: "Tiroxina", correct: false }], explanation: "O GH (Growth Hormone) atua principalmente durante a infância e adolescência, estimulando o crescimento dos ossos e músculos." },
            { question: "A glândula Tireoide, localizada no pescoço, produz hormônios que controlam principalmente o quê?", answers: [{ text: "O nível de açúcar no sangue.", correct: false }, { text: "O metabolismo (velocidade com que o corpo usa energia).", correct: true }, { text: "A resposta ao medo.", correct: false }, { text: "O sono.", correct: false }], explanation: "Os hormônios da tireoide (T3 e T4) regulam a 'velocidade' do nosso corpo, influenciando o gasto de energia, a temperatura e o funcionamento de vários órgãos." },
            { question: "Qual glândula produz a Insulina e o Glucagon, hormônios que controlam o açúcar no sangue?", answers: [{ text: "Hipófise", correct: false }, { text: "Pâncreas", correct: true }, { text: "Tireoide", correct: false }, { text: "Suprarrenais", correct: false }], explanation: "O pâncreas tem essa função dupla: a insulina baixa o açúcar no sangue (ajuda a entrar nas células) e o glucagon aumenta (libera o açúcar guardado no fígado)." },
            { question: "O que acontece no corpo de uma pessoa com Diabetes tipo 1?", answers: [{ text: "O corpo produz insulina demais.", correct: false }, { text: "O pâncreas não consegue produzir insulina (ou produz muito pouca).", correct: true }, { text: "O corpo não responde à adrenalina.", correct: false }, { text: "A tireoide não funciona.", correct: false }], explanation: "No Diabetes tipo 1, o próprio sistema de defesa do corpo ataca as células do pâncreas que produzem insulina. Sem insulina, o açúcar não entra nas células e se acumula no sangue." },
            { question: "As glândulas Suprarrenais (ou Adrenais) ficam localizadas onde?", answers: [{ text: "No pescoço.", correct: false }, { text: "Acima dos rins.", correct: true }, { text: "Dentro do cérebro.", correct: false }, { text: "No abdômen, perto do estômago.", correct: false }], explanation: "As suprarrenais são pequenas glândulas que ficam como 'chapéus' em cima de cada rim." },
            { question: "Qual hormônio é produzido pelas Suprarrenais em situações de susto, estresse ou emoção forte?", answers: [{ text: "Insulina", correct: false }, { text: "Adrenalina", correct: true }, { text: "GH", correct: false }, { text: "Melatonina", correct: false }], explanation: "A adrenalina prepara o corpo para uma reação rápida ('luta ou fuga'), acelerando o coração, aumentando a respiração e enviando mais sangue para os músculos." },
            { question: "Os Ovários (nas meninas) e os Testículos (nos meninos) produzem quais tipos de hormônios?", answers: [{ text: "Hormônios do crescimento.", correct: false }, { text: "Hormônios sexuais (estrogênio, progesterona, testosterona).", correct: true }, { text: "Insulina e glucagon.", correct: false }, { text: "Adrenalina e cortisol.", correct: false }], explanation: "Essas glândulas (gônadas) produzem os hormônios responsáveis pelas características sexuais secundárias (pelos, voz, etc.) e pela reprodução." },
            { question: "Qual o principal hormônio sexual masculino?", answers: [{ text: "Estrogênio", correct: false }, { text: "Testosterona", correct: true }, { text: "Progesterona", correct: false }, { text: "Adrenalina", correct: false }], explanation: "A testosterona é responsável pelo desenvolvimento das características masculinas (voz grossa, pelos, músculos) e pela produção de espermatozoides." },
            { question: "Quais são os dois principais hormônios sexuais femininos?", answers: [{ text: "Testosterona e Adrenalina", correct: false }, { text: "Estrogênio e Progesterona", correct: true }, { text: "Insulina e Glucagon", correct: false }, { text: "GH e TSH", correct: false }], explanation: "O estrogênio e a progesterona regulam o ciclo menstrual, desenvolvem as características femininas e são essenciais para a gravidez." },
            { question: "Qual glândula produz a Melatonina, hormônio que regula o sono?", answers: [{ text: "Hipófise", correct: false }, { text: "Pineal", correct: true }, { text: "Tireoide", correct: false }, { text: "Pâncreas", correct: false }], explanation: "A glândula pineal, localizada no cérebro, produz melatonina principalmente à noite, induzindo o sono." },
            { question: "Qual sistema de controle do corpo tem efeitos mais duradouros?", answers: [{ text: "Sistema Nervoso", correct: false }, { text: "Sistema Endócrino", correct: true }, { text: "Ambos têm a mesma duração.", correct: false }, { text: "Nenhum deles.", correct: false }], explanation: "Os impulsos nervosos são rápidos, mas seu efeito acaba logo. Os hormônios agem mais devagar, mas seus efeitos podem durar horas, dias ou até mais." },
            { question: "Qual a função do Glucagon?", answers: [{ text: "Diminuir o açúcar no sangue.", correct: false }, { text: "Aumentar o açúcar no sangue, liberando a reserva do fígado.", correct: true }, { text: "Controlar o metabolismo.", correct: false }, { text: "Estimular o crescimento.", correct: false }], explanation: "O Glucagon age de forma oposta à insulina. Ele é liberado quando o açúcar no sangue está baixo (hipoglicemia) para normalizar os níveis." },

            // Sistema Reprodutor (15)
            { question: "Qual o nome dos gametas (células reprodutivas) masculinos e femininos?", answers: [{ text: "Hormônios e Glândulas", correct: false }, { text: "Espermatozoides (masculino) e Óvulos (feminino)", correct: true }, { text: "Testosterona e Estrogênio", correct: false }, { text: "Neurônios e Sinapses", correct: false }], explanation: "Os gametas são as células que se unem na fecundação para formar um novo ser. O masculino é o espermatozoide, e o feminino é o óvulo." },
            { question: "Onde são produzidos os espermatozoides?", answers: [{ text: "Na próstata.", correct: false }, { text: "Nos testículos.", correct: true }, { text: "Na uretra.", correct: false }, { text: "Nas vesículas seminais.", correct: false }], explanation: "Os testículos são as gônadas masculinas, responsáveis pela produção contínua de espermatozoides e do hormônio testosterona." },
            { question: "Onde são produzidos e armazenados os óvulos?", answers: [{ text: "No útero.", correct: false }, { text: "Nas tubas uterinas.", correct: false }, { text: "Nos ovários.", correct: true }, { text: "Na vagina.", correct: false }], explanation: "Os ovários são as gônadas femininas. As mulheres já nascem com todos os seus óvulos (ainda imaturos), que amadurecem um a cada ciclo menstrual." },
            { question: "O que é a ovulação?", answers: [{ text: "A produção de espermatozoides.", correct: false }, { text: "A liberação de um óvulo maduro pelo ovário.", correct: true }, { text: "A menstruação.", correct: false }, { text: "A fecundação.", correct: false }], explanation: "A ovulação ocorre geralmente na metade do ciclo menstrual, quando um óvulo está pronto para ser fecundado e é liberado na tuba uterina." },
            { question: "Onde geralmente ocorre a fecundação (encontro do espermatozoide com o óvulo)?", answers: [{ text: "No ovário.", correct: false }, { text: "Nas tubas uterinas (trompas de Falópio).", correct: true }, { text: "No útero.", correct: false }, { text: "Na vagina.", correct: false }], explanation: "Após a ovulação, o óvulo segue pela tuba uterina. Se houver espermatozoides presentes ali, pode ocorrer a fecundação." },
            { question: "Após a fecundação, onde o embrião se fixa e se desenvolve durante a gravidez?", answers: [{ text: "Na tuba uterina.", correct: false }, { text: "No útero.", correct: true }, { text: "No ovário.", correct: false }, { text: "Na bexiga.", correct: false }], explanation: "O óvulo fecundado (zigoto) viaja até o útero e se implanta na parede uterina (nidação), onde continuará a se desenvolver." },
            { question: "Qual a função da placenta durante a gravidez?", answers: [{ text: "Produzir óvulos.", correct: false }, { text: "Permitir a troca de nutrientes, oxigênio e resíduos entre a mãe e o feto.", correct: true }, { text: "Proteger o bebê contra choques.", correct: false }, { text: "Produzir leite.", correct: false }], explanation: "A placenta é um órgão temporário fundamental que conecta a circulação sanguínea da mãe e do feto, garantindo a nutrição e a respiração do bebê." },
            { question: "Qual destes é um método contraceptivo de barreira?", answers: [{ text: "Pílula anticoncepcional", correct: false }, { text: "Camisinha (preservativo)", correct: true }, { text: "DIU hormonal", correct: false }, { text: "Laqueadura", correct: false }], explanation: "Métodos de barreira impedem fisicamente o encontro do espermatozoide com o óvulo. A camisinha (masculina ou feminina) é o principal exemplo." },
            { question: "Além de evitar a gravidez, qual outra função importante tem a camisinha?", answers: [{ text: "Regular o ciclo menstrual.", correct: false }, { text: "Proteger contra Infecções Sexualmente Transmissíveis (ISTs).", correct: true }, { text: "Aumentar a fertilidade.", correct: false }, { text: "Não tem outra função.", correct: false }], explanation: "A camisinha é o único método que oferece dupla proteção: evita a gravidez e previne a transmissão da maioria das ISTs, como HIV, sífilis e gonorreia." },
            { question: "O que são ISTs (Infecções Sexualmente Transmissíveis)?", answers: [{ text: "Doenças causadas por hormônios.", correct: false }, { text: "Infecções que podem ser passadas de uma pessoa para outra durante a relação sexual.", correct: true }, { text: "Doenças que afetam apenas o sistema nervoso.", correct: false }, { text: "Alergias a métodos contraceptivos.", correct: false }], explanation: "ISTs são causadas por bactérias, vírus ou outros microrganismos e transmitidas principalmente pelo contato sexual sem proteção (camisinha)." },
            { question: "Qual método contraceptivo hormonal impede a ovulação?", answers: [{ text: "Camisinha", correct: false }, { text: "Pílula anticoncepcional", correct: true }, { text: "DIU de cobre", correct: false }, { text: "Tabelinha", correct: false }], explanation: "As pílulas contêm hormônios (estrogênio e/ou progesterona) que 'enganam' o corpo, impedindo que a hipófise libere os hormônios que causam a ovulação." },
            { question: "Qual estrutura do sistema reprodutor masculino amadurece e armazena os espermatozoides?", answers: [{ text: "Próstata", correct: false }, { text: "Epidídimo", correct: true }, { text: "Vesícula seminal", correct: false }, { text: "Testículo", correct: false }], explanation: "Após serem produzidos nos testículos, os espermatozoides vão para o epidídimo, um tubo enovelado onde terminam seu amadurecimento e ficam armazenados." },
            { question: "O DIU de cobre é um método contraceptivo que funciona principalmente:", answers: [{ text: "Impedindo a ovulação.", correct: false }, { text: "Criando uma barreira física.", correct: false }, { text: "Dificultando a movimentação dos espermatozoides e a implantação do óvulo.", correct: true }, { text: "Liberando hormônios.", correct: false }], explanation: "O cobre liberado pelo DIU cria um ambiente hostil aos espermatozoides dentro do útero, além de alterar o endométrio, dificultando a nidação." },
             { question: "Qual o nome do período fértil no ciclo menstrual da mulher?", answers: [{ text: "Menstruação", correct: false }, { text: "Ovulação", correct: true }, { text: "Gestação", correct: false }, { text: "Puberdade", correct: false }], explanation: "O período fértil acontece próximo à ovulação, que é quando o óvulo é liberado e pode ser fecundado pelo espermatozoide." },
             { question: "Qual destes NÃO é um método contraceptivo?", answers: [{ text: "Camisinha", correct: false }, { text: "Ducha vaginal após a relação", correct: true }, { text: "Pílula anticoncepcional", correct: false }, { text: "DIU", correct: false }], explanation: "Lavar a vagina após a relação não impede a gravidez, pois os espermatozoides são muito rápidos e podem alcançar o útero antes disso. Não é um método seguro." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        // Removi a referência a subjectTagContainer pois este quiz é só de Ciências
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            
            // Verifica se a pergunta existe antes de tentar acessá-la
            if (currentQuestion && currentQuestion.question) {
                questionText.innerHTML = currentQuestion.question; // Usar innerHTML para interpretar tags como <br>
            } else {
                questionText.innerHTML = 'Erro: Pergunta não carregada.'; // Mensagem de erro
                // Opcional: pode parar o quiz ou pular para a próxima
                console.error("Erro: Pergunta indefinida no índice", currentQuestionIndex);
                // showNextQuestion(); // Pula para a próxima ou mostra resultados se for a última
                return; // Impede a execução do resto da função se a pergunta falhar
            }
            
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            // Adiciona verificação se currentQuestion.answers existe
            if (currentQuestion.answers) {
                currentQuestion.answers.forEach((answer, index) => {
                    const button = document.createElement('button');
                    button.innerHTML = answer.text; // Usar innerHTML para respostas também
                    button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                    if (answer.correct) button.dataset.correct = true;
                    button.addEventListener('click', selectAnswer);
                    answersContainer.appendChild(button);
                });
            } else {
                 answersContainer.innerHTML = '<p>Erro ao carregar respostas.</p>'; // Mensagem de erro
                 console.error("Erro: Respostas indefinidas para a pergunta no índice", currentQuestionIndex);
            }
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            questionText.innerHTML = ''; // Limpa o texto da pergunta anterior
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            
            // Verifica se a pergunta atual existe
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando responder pergunta indefinida no índice", currentQuestionIndex);
                 return;
            }

            const correct = selectedButton.dataset.correct === 'true';
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText, 
                correctAnswer: correctAnswer ? correctAnswer.text : 'N/A', 
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true') { 
                    button.classList.add('correct');
                }
                button.disabled = true; 
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
             // Verifica se a pergunta atual existe
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando mostrar explicação para pergunta indefinida no índice", currentQuestionIndex);
                 showNextQuestion(); // Pula para a próxima ou mostra resultados
                 return;
            }

            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = currentQuestion.explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            // Garante que totalQuestions não seja zero antes de dividir
            const percentage = totalQuestions > 0 ? (correctAnswersCount / totalQuestions) * 100 : 0; 

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                if (answerData.answers) {
                    answerData.answers.forEach(ans => {
                        let classList = 'review-answer';
                        let indicator = ''; 
                        if (ans.text === answerData.correctAnswer) {
                            classList += ' correct-answer-highlight';
                        }
                        if (ans.text === answerData.userAnswer) {
                            classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                            indicator = answerData.wasCorrect ? ' ✅' : ' ❌'; 
                        }
                        answersHtml += `<p class="${classList}">${ans.text}${indicator}</p>`; 
                    });
                } else {
                    answersHtml = '<p>Erro ao carregar opções.</p>';
                }

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question ? answerData.question.replace(/<br>/g, ' ') : 'Pergunta não encontrada'}</h3> 
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation || 'Explicação não disponível.'}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Verifica se a array de perguntas está vazia ou não foi definida
            if (!allQuestions || allQuestions.length === 0) {
                 document.body.innerHTML = '<h1>Erro: Nenhuma pergunta foi carregada. Verifique o código.</h1>';
                 console.error("Erro Crítico: Array 'allQuestions' está vazia ou indefinida.");
                 return;
            }
            showScreen('start');
        });

    </script>
</body>
</html>
