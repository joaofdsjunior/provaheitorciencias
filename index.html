<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Inglês - Modals e Tempos Verbais</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #ef4444; /* Vermelho */
            --theme-dark: #dc2626;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f87171; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #ffedd5; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); } /* Cor ajustada */

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>English Quiz</h1>
            <p>Let's practice Modals and Verb Tenses! Each correct answer is worth 10 points.</p>
            <input type="text" id="player-name" placeholder="Type your name">
            <br>
            <button onclick="startGame()" class="btn-primary">Start!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Question 1 / 40</div>
                <div id="score">Score: 0</div>
                <div id="correct-answers">Correct: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">See Explanation</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Next Question</button>
        </div>

        <div id="results-screen">
            <h1>Game Over!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Your final score is:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Play Again</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Modal Verbs (20 Questions)
            { question: "Which modal verb expresses ability in the present?", answers: [{ text: "Could", correct: false }, { text: "Can", correct: true }, { text: "Should", correct: false }, { text: "Might", correct: false }], explanation: "'Can' é usado para dizer que alguém consegue ou sabe fazer algo agora. Ex: 'I can swim' (Eu sei nadar)." },
            { question: "Which modal verb expresses ability in the past?", answers: [{ text: "Can", correct: false }, { text: "Must", correct: false }, { text: "Could", correct: true }, { text: "Should", correct: false }], explanation: "'Could' é o passado de 'can', usado para dizer que alguém conseguia fazer algo no passado. Ex: 'When I was young, I could run fast' (Quando eu era jovem, eu conseguia correr rápido)." },
            { question: "Which modal verb is used to give advice or suggestions?", answers: [{ text: "Must", correct: false }, { text: "Might", correct: false }, { text: "Can", correct: false }, { text: "Should", correct: true }], explanation: "'Should' significa 'deveria' e é usado para dar conselhos. Ex: 'You should study more' (Você deveria estudar mais)." },
            { question: "Which modal verb expresses a strong obligation or necessity?", answers: [{ text: "Should", correct: false }, { text: "Could", correct: false }, { text: "Must", correct: true }, { text: "Might", correct: false }], explanation: "'Must' indica uma obrigação forte, algo que você tem que fazer. Ex: 'You must wear a uniform' (Você tem que usar uniforme)." },
            { question: "Which modal verb expresses possibility (maybe)?", answers: [{ text: "Can", correct: false }, { text: "Should", correct: false }, { text: "Must", correct: false }, { text: "Might", correct: true }], explanation: "'Might' (assim como 'may') indica que algo é possível, mas não certo. Ex: 'It might rain tomorrow' (Pode ser que chova amanhã)." },
            { question: "Complete: 'She _______ speak three languages.'", answers: [{ text: "can", correct: true }, { text: "could", correct: false }, { text: "should", correct: false }, { text: "must", correct: false }], explanation: "A frase fala sobre uma habilidade no presente, então usamos 'can'." },
            { question: "Complete: 'When he was 5, he _______ already read.'", answers: [{ text: "can", correct: false }, { text: "could", correct: true }, { text: "should", correct: false }, { text: "might", correct: false }], explanation: "A frase fala sobre uma habilidade no passado ('When he was 5'), então usamos 'could'." },
            { question: "Complete: 'You look tired. You _______ go to bed early.'", answers: [{ text: "must", correct: false }, { text: "can", correct: false }, { text: "should", correct: true }, { text: "might", correct: false }], explanation: "Esta é uma sugestão ou conselho, por isso usamos 'should'." },
            { question: "Complete: 'Students _______ do their homework every day.'", answers: [{ text: "might", correct: false }, { text: "could", correct: false }, { text: "must", correct: true }, { text: "can", correct: false }], explanation: "Fazer a lição de casa é geralmente uma obrigação forte para estudantes, então 'must' é o mais adequado." },
            { question: "Complete: 'Where is John? He _______ be late.'", answers: [{ text: "should", correct: false }, { text: "must", correct: false }, { text: "might", correct: true }, { text: "can", correct: false }], explanation: "Não temos certeza se ele está atrasado, é apenas uma possibilidade. Por isso, usamos 'might'." },
            { question: "Choose the correct sentence:", answers: [{ text: "She cans play the piano.", correct: false }, { text: "She can play the piano.", correct: true }, { text: "She can plays the piano.", correct: false }, { text: "She play can the piano.", correct: false }], explanation: "Depois de 'can' (e outros modals), o verbo principal fica na forma base, sem 's', 'ing' ou 'to'. O correto é 'can play'." },
            { question: "Choose the correct sentence:", answers: [{ text: "You should to listen.", correct: false }, { text: "You should listening.", correct: false }, { text: "You should listen.", correct: true }, { text: "You listens should.", correct: false }], explanation: "Depois de 'should', o verbo principal ('listen') fica na sua forma base, sem o 'to'." },
            { question: "What is the negative form of 'must'?", answers: [{ text: "Don't must", correct: false }, { text: "Mustn't (must not)", correct: true }, { text: "Not must", correct: false }, { text: "Shouldn't", correct: false }], explanation: "A forma negativa de 'must' é 'must not' ou a contração 'mustn't', que significa 'não dever' ou 'ser proibido'." },
            { question: "What does 'You mustn't talk in the library' mean?", answers: [{ text: "You don't need to talk.", correct: false }, { text: "You are prohibited from talking.", correct: true }, { text: "Maybe you will talk.", correct: false }, { text: "You should talk quietly.", correct: false }], explanation: "'Mustn't' expressa uma proibição forte." },
            { question: "Which modal verb can be used to make a polite request?", answers: [{ text: "Must", correct: false }, { text: "Could", correct: true }, { text: "Should", correct: false }, { text: "Might", correct: false }], explanation: "'Could' (assim como 'Can' ou 'May') pode ser usado para pedir algo educadamente. Ex: 'Could you help me, please?' (Você poderia me ajudar, por favor?)." },
            { question: "Complete: 'He _______ be tired, he worked all day.'", answers: [{ text: "might", correct: false }, { text: "must", correct: true }, { text: "can", correct: false }, { text: "should", correct: false }], explanation: "Neste caso, 'must' não indica obrigação, mas sim uma dedução lógica, quase uma certeza. Se ele trabalhou o dia todo, ele 'deve' estar cansado." },
            { question: "Complete: 'It's cloudy. It _______ rain later.'", answers: [{ text: "must", correct: false }, { text: "can", correct: false }, { text: "could", correct: true }, { text: "should", correct: false }], explanation: "'Could' (assim como 'might' ou 'may') é usado para indicar uma possibilidade futura. Se está nublado, 'poderia' chover." },
            { question: "Complete: 'You _______ eat fruit and vegetables to be healthy.'", answers: [{ text: "should", correct: true }, { text: "mustn't", correct: false }, { text: "could", correct: false }, { text: "might", correct: false }], explanation: "Comer frutas e vegetais é um bom conselho para ser saudável, por isso usamos 'should'." },
            { question: "Complete: 'I _______ swim when I was three.'", answers: [{ text: "can", correct: false }, { text: "couldn't", correct: true }, { text: "mustn't", correct: false }, { text: "shouldn't", correct: false }], explanation: "A frase fala de uma habilidade (ou falta dela) no passado ('when I was three'). A forma negativa de 'could' é 'couldn't'." },
            { question: "Complete: 'We _______ buy tickets before the show.'", answers: [{ text: "must", correct: true }, { text: "might", correct: false }, { text: "could", correct: false }, { text: "shouldn't", correct: false }], explanation: "Comprar ingressos antes é geralmente uma necessidade ou obrigação para garantir a entrada, então 'must' é apropriado." },

            // Present Perfect vs Simple Past (20 Questions)
            { question: "Which tense talks about a finished action at a specific time in the past?", answers: [{ text: "Present Perfect", correct: false }, { text: "Simple Past", correct: true }, { text: "Past Continuous", correct: false }, { text: "Present Simple", correct: false }], explanation: "O Simple Past é usado para ações que começaram e terminaram em um tempo definido no passado (yesterday, last year, two hours ago)." },
            { question: "Which tense talks about an action that happened at an unspecified time in the past OR has a connection to the present?", answers: [{ text: "Present Perfect", correct: true }, { text: "Simple Past", correct: false }, { text: "Past Perfect", correct: false }, { text: "Future Simple", correct: false }], explanation: "O Present Perfect (have/has + particípio) é usado quando o tempo exato não importa, ou quando a ação tem um resultado ou relevância no presente." },
            { question: "Choose the correct sentence:", answers: [{ text: "I have seen that movie yesterday.", correct: false }, { text: "I saw that movie yesterday.", correct: true }, { text: "I seen that movie yesterday.", correct: false }, { text: "I see that movie yesterday.", correct: false }], explanation: "A palavra 'yesterday' indica um tempo específico no passado. Por isso, usamos o Simple Past ('saw')." },
            { question: "Choose the correct sentence:", answers: [{ text: "She lived here since 2010.", correct: false }, { text: "She has lived here since 2010.", correct: true }, { text: "She did live here since 2010.", correct: false }, { text: "She lives here since 2010.", correct: false }], explanation: "'Since' (desde) indica o início de uma ação que continua até o presente. Nesses casos, usamos o Present Perfect ('has lived')." },
            { question: "Complete: 'We _______ to Paris last summer.'", answers: [{ text: "have gone", correct: false }, { text: "went", correct: true }, { text: "gone", correct: false }, { text: "go", correct: false }], explanation: "'Last summer' é um tempo específico no passado. O Simple Past de 'go' é 'went'." },
            { question: "Complete: 'I _______ never _______ sushi before.'", answers: [{ text: "did / eat", correct: false }, { text: "have / eaten", correct: true }, { text: "ate / eaten", correct: false }, { text: "eat / ate", correct: false }], explanation: "A palavra 'before' (antes) e 'never' indicam uma experiência de vida (ou falta dela) até o momento presente. Usamos o Present Perfect ('have eaten')." },
            { question: "Complete: 'They _______ the game two hours ago.'", answers: [{ text: "have finished", correct: false }, { text: "finished", correct: true }, { text: "finish", correct: false }, { text: "finishes", correct: false }], explanation: "'Two hours ago' marca um tempo específico e finalizado no passado, pedindo o Simple Past ('finished')." },
            { question: "Complete: 'My father _______ in that company for 10 years.' (He still works there)", answers: [{ text: "worked", correct: false }, { text: "has worked", correct: true }, { text: "work", correct: false }, { text: "did work", correct: false }], explanation: "A expressão 'for 10 years' junto com a informação de que ele ainda trabalha lá indica uma ação que começou no passado e continua no presente. Usamos o Present Perfect ('has worked')." },
            { question: "Complete: '_______ you ever _______ to Japan?'", answers: [{ text: "Did / go", correct: false }, { text: "Have / been", correct: true }, { text: "Did / been", correct: false }, { text: "Have / went", correct: false }], explanation: "'Ever' (alguma vez) é usado em perguntas sobre experiências de vida. A estrutura correta é 'Have you ever been...?' (Você alguma vez já esteve...?)." },
            { question: "Complete: 'She _______ her keys. She can't find them now.'", answers: [{ text: "lost", correct: false }, { text: "has lost", correct: true }, { text: "did lose", correct: false }, { text: "loses", correct: false }], explanation: "A ação de perder as chaves aconteceu no passado, mas tem um resultado claro no presente (ela não consegue achá-las agora). Usamos o Present Perfect ('has lost')." },
            { question: "When do we use 'for' with the Present Perfect?", answers: [{ text: "To indicate the starting point.", correct: false }, { text: "To indicate a period of time.", correct: true }, { text: "To indicate a specific past time.", correct: false }, { text: "We don't use 'for'.", correct: false }], explanation: "'For' é usado para indicar a duração da ação. Ex: 'for two hours', 'for three years'." },
            { question: "When do we use 'since' with the Present Perfect?", answers: [{ text: "To indicate the starting point.", correct: true }, { text: "To indicate a period of time.", correct: false }, { text: "To indicate a finished past time.", correct: false }, { text: "We don't use 'since'.", correct: false }], explanation: "'Since' é usado para indicar quando a ação começou. Ex: 'since Monday', 'since 2020'." },
            { question: "Which sentence is correct?", answers: [{ text: "I have studied English since 5 years.", correct: false }, { text: "I have studied English for 5 years.", correct: true }, { text: "I studied English since 5 years.", correct: false }, { text: "I studied English for 5 years ago.", correct: false }], explanation: "Para indicar a duração de 5 anos, usamos 'for'." },
            { question: "Which sentence is correct?", answers: [{ text: "He has started his job last month.", correct: false }, { text: "He started his job last month.", correct: true }, { text: "He start his job last month.", correct: false }, { text: "He has start his job last month.", correct: false }], explanation: "'Last month' é um tempo específico no passado, então usamos o Simple Past ('started')." },
            { question: "Complete: 'They _______ just _______.'", answers: [{ text: "did / arrive", correct: false }, { text: "have / arrived", correct: true }, { text: "arrived / arrived", correct: false }, { text: "arrive / arrived", correct: false }], explanation: "'Just' (acabou de) é frequentemente usado com o Present Perfect para indicar uma ação muito recente." },
            { question: "Complete: 'My sister _______ her homework yet.'", answers: [{ text: "hasn't finished", correct: true }, { text: "didn't finish", correct: false }, { text: "not finished", correct: false }, { text: "finished", correct: false }], explanation: "'Yet' (ainda) é usado em frases negativas e perguntas com o Present Perfect para indicar que algo esperado não aconteceu até agora." },
            { question: "Complete: 'I _______ lunch already.'", answers: [{ text: "eated", correct: false }, { text: "have eaten", correct: true }, { text: "ate", correct: false }, { text: "did eat", correct: false }], explanation: "'Already' (já) é usado com o Present Perfect para indicar que uma ação aconteceu antes do esperado." },
            { question: "Choose the correct past participle for the verb 'see'.", answers: [{ text: "Saw", correct: false }, { text: "Seen", correct: true }, { text: "Seed", correct: false }, { text: "Seeing", correct: false }], explanation: "O particípio passado de 'see' (ver) é 'seen'. Usamos o particípio no Present Perfect (have/has seen)." },
            { question: "Choose the correct past participle for the verb 'write'.", answers: [{ text: "Wrote", correct: false }, { text: "Written", correct: true }, { text: "Writed", correct: false }, { text: "Writing", correct: false }], explanation: "O particípio passado de 'write' (escrever) é 'written'. Ex: 'I have written a letter'." },
            { question: "Complete: 'He _______ that book last week.'", answers: [{ text: "has read", correct: false }, { text: "read", correct: true }, { text: "reads", correct: false }, { text: "did read", correct: false }], explanation: "'Last week' indica um tempo específico no passado. O Simple Past de 'read' é escrito como 'read', mas pronunciado como 'red'." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acortou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Player 1";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Score: 0`;
            correctAnswersText.innerText = `Correct: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            
            if (currentQuestion && currentQuestion.question) {
                questionText.innerHTML = currentQuestion.question; 
            } else {
                questionText.innerHTML = 'Erro: Pergunta não carregada.'; 
                console.error("Erro: Pergunta indefinida no índice", currentQuestionIndex);
                return; 
            }
            
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            if (currentQuestion.answers) {
                currentQuestion.answers.forEach((answer, index) => {
                    const button = document.createElement('button');
                    button.innerHTML = answer.text;
                    button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                    if (answer.correct) button.dataset.correct = true;
                    button.addEventListener('click', selectAnswer);
                    answersContainer.appendChild(button);
                });
            } else {
                 answersContainer.innerHTML = '<p>Erro ao carregar respostas.</p>';
                 console.error("Erro: Respostas indefinidas para a pergunta no índice", currentQuestionIndex);
            }
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            questionText.innerHTML = ''; 
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando responder pergunta indefinida no índice", currentQuestionIndex);
                 return;
            }

            const correct = selectedButton.dataset.correct === 'true';
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText, 
                correctAnswer: correctAnswer ? correctAnswer.text : 'N/A', 
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Score: ${score}`;
                correctAnswersText.innerText = `Correct: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true') { 
                    button.classList.add('correct');
                }
                button.disabled = true; 
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando mostrar explicação para pergunta indefinida no índice", currentQuestionIndex);
                 showNextQuestion();
                 return;
            }

            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = currentQuestion.explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = totalQuestions > 0 ? (correctAnswersCount / totalQuestions) * 100 : 0; 

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`; 
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                if (answerData.answers) {
                    answerData.answers.forEach(ans => {
                        let classList = 'review-answer';
                        let indicator = ''; 
                        if (ans.text === answerData.correctAnswer) {
                            classList += ' correct-answer-highlight';
                        }
                        if (ans.text === answerData.userAnswer) {
                            classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                            indicator = answerData.wasCorrect ? ' ✅' : ' ❌'; 
                        }
                        answersHtml += `<p class="${classList}">${ans.text}${indicator}</p>`; 
                    });
                } else {
                    answersHtml = '<p>Erro ao carregar opções.</p>';
                }

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question ? answerData.question.replace(/<br>/g, ' ') : 'Pergunta não encontrada'}</h3> 
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation || 'Explicação não disponível.'}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!allQuestions || allQuestions.length === 0) {
                 document.body.innerHTML = '<h1>Erro: Nenhuma pergunta foi carregada. Verifique o código.</h1>';
                 console.error("Erro Crítico: Array 'allQuestions' está vazia ou indefinida.");
                 return;
            }
            showScreen('start');
        });

    </script>
</body>
</html>
