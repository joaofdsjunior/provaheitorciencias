<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Ciências - P1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

        :root {
            --theme-color: #10b981; /* Verde */
            --theme-dark: #059669;
            --grey: #A3A3A3;
            --light-grey: #E3E3E3;
            --dark-grey: #545454;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --background-color: #F2F2F2;
            
            --btn-c1: #6ee7b7; 
            --btn-c2: #5eead4;
            --btn-c3: #67e8f9;
            --btn-c4: #7dd3fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #2dd4bf; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #34d399; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #2dd4bf; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #22d3ee; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #38bdf8; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #16a34a !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #dc2626 !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz de Ciências</h1>
            <p>Prepare-se para a P1! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Eletricidade (20)
            { question: "Qual partícula atômica possui carga elétrica negativa e se move para gerar a corrente elétrica?", answers: [{ text: "Próton", correct: false }, { text: "Nêutron", correct: false }, { text: "Elétron", correct: true }, { text: "Íon", correct: false }], explanation: "Os elétrons possuem carga negativa e são os responsáveis por se moverem nos materiais condutores, criando a corrente elétrica." },
            { question: "Um corpo que possui mais prótons do que elétrons está eletrizado de que forma?", answers: [{ text: "Positivamente", correct: true }, { text: "Negativamente", correct: false }, { text: "Neutro", correct: false }, { text: " magneticamente", correct: false }], explanation: "Se há mais cargas positivas (prótons) do que negativas (elétrons), a carga total do corpo é positiva." },
            { question: "Qual dos seguintes materiais é considerado um bom isolante elétrico?", answers: [{ text: "Cobre", correct: false }, { text: "Borracha", correct: true }, { text: "Alumínio", correct: false }, { text: "Corpo humano", correct: false }], explanation: "A borracha dificulta muito a passagem de elétrons, sendo um excelente isolante, usado para encapar fios." },
            { question: "Para que uma corrente elétrica seja estabelecida em um fio, é necessário que haja:", answers: [{ text: "Uma grande quantidade de nêutrons.", correct: false }, { text: "Uma diferença de potencial (ddp) entre as pontas.", correct: true }, { text: "Um campo magnético forte.", correct: false }, { text: "Que o fio seja de plástico.", correct: false }], explanation: "A diferença de potencial, ou tensão (medida em Volts), é o que 'empurra' os elétrons, criando o movimento ordenado que chamamos de corrente." },
            { question: "Se uma carga de 30 Coulombs (C) atravessa um fio em 10 segundos (s), qual a intensidade da corrente elétrica em Ampères (A)?", answers: [{ text: "300 A", correct: false }, { text: "10 A", correct: false }, { text: "0.33 A", correct: false }, { text: "3 A", correct: true }], explanation: "Usando a fórmula i = Q / Δt, temos i = 30 C / 10 s. O resultado é 3 A." },
            { question: "Uma corrente de 5 A percorre um fio durante 1 minuto. Qual a quantidade de carga que passou pelo fio?", answers: [{ text: "5 C", correct: false }, { text: "60 C", correct: false }, { text: "300 C", correct: true }, { text: "12 C", correct: false }], explanation: "Primeiro, converta o tempo para segundos: 1 minuto = 60s. Depois, use a fórmula Q = i * Δt. Temos Q = 5 A * 60 s, que resulta em 300 C." },
            { question: "Em uma ligação de pilhas em série, o que acontece com a tensão (voltagem) total?", answers: [{ text: "Ela é a mesma de uma única pilha.", correct: false }, { text: "Ela se divide entre as pilhas.", correct: false }, { text: "Ela é a soma das tensões de cada pilha.", correct: true }, { text: "Ela se torna zero.", correct: false }], explanation: "Na ligação em série, as tensões se somam. Por exemplo, 3 pilhas de 1,5V em série fornecem uma tensão total de 4,5V." },
            { question: "Qual é a principal característica de um circuito em paralelo?", answers: [{ text: "Se uma lâmpada queimar, todas as outras apagam.", correct: false }, { text: "A corrente elétrica tem apenas um caminho para percorrer.", correct: false }, { text: "A tensão (voltagem) é a mesma para todos os componentes.", correct: true }, { text: "A corrente elétrica é a mesma em todos os pontos.", correct: false }], explanation: "Em um circuito em paralelo, a tensão fornecida pela fonte (pilha, tomada) é a mesma em todos os 'braços' do circuito. É por isso que os aparelhos em casa recebem a mesma voltagem." },
            { question: "Por que as instalações elétricas de uma residência são feitas em paralelo?", answers: [{ text: "Para gastar menos fio.", correct: false }, { text: "Para que, se um aparelho queimar, os outros continuem funcionando.", correct: true }, { text: "Para que a corrente elétrica seja maior.", correct: false }, { text: "Para que a conta de luz seja mais barata.", correct: false }], explanation: "A grande vantagem do circuito em paralelo é a independência dos componentes. Se a lâmpada da sala queima, a TV da sala continua funcionando." },
            { question: "O que acontece com o brilho das lâmpadas em um circuito em série se adicionarmos mais lâmpadas?", answers: [{ text: "O brilho aumenta.", correct: false }, { text: "O brilho diminui.", correct: true }, { text: "O brilho não se altera.", correct: false }, { text: "As lâmpadas queimam.", correct: false }], explanation: "Em série, a tensão total é dividida entre as lâmpadas. Quanto mais lâmpadas, menor a 'fatia' de tensão para cada uma, e consequentemente, menor o brilho." },
            { question: "Um aparelho resistivo, como um chuveiro, transforma energia elétrica principalmente em qual outra forma de energia?", answers: [{ text: "Energia cinética (movimento)", correct: false }, { text: "Energia sonora (som)", correct: false }, { text: "Energia luminosa (luz)", correct: false }, { text: "Energia térmica (calor)", correct: true }], explanation: "Aparelhos resistivos, como chuveiros e ferros de passar, são projetados para aquecer, transformando eletricidade em calor através do Efeito Joule." },
            { question: "O que é um gerador elétrico?", answers: [{ text: "Um aparelho que transforma energia elétrica em movimento.", correct: false }, { text: "Um aparelho que transforma outras formas de energia (química, mecânica) em energia elétrica.", correct: true }, { text: "Um aparelho que armazena informações.", correct: false }, { text: "Um aparelho que apenas consome energia elétrica.", correct: false }], explanation: "Geradores produzem energia elétrica. Uma pilha, por exemplo, é um gerador que transforma energia química em elétrica." },
            { question: "Se 12 Coulombs de carga passam por uma seção de um fio a cada minuto, qual é a corrente?", answers: [{ text: "12 A", correct: false }, { text: "720 A", correct: false }, { text: "0,2 A", correct: true }, { text: "5 A", correct: false }], explanation: "Primeiro, converta o tempo: 1 minuto = 60s. Usando i = Q / Δt, temos i = 12 C / 60 s, que resulta em 0,2 A." },
            { question: "Um motor de liquidificador é um exemplo de aparelho que transforma energia elétrica em:", answers: [{ text: "Energia térmica", correct: false }, { text: "Energia cinética", correct: true }, { text: "Energia química", correct: false }, { text: "Energia sonora", correct: false }], explanation: "Motores são projetados para gerar movimento (energia cinética) a partir da eletricidade." },
            { question: "Qual partícula atômica está localizada no núcleo e não possui carga elétrica?", answers: [{ text: "Elétron", correct: false }, { text: "Próton", correct: false }, { text: "Nêutron", correct: true }, { text: "Fóton", correct: false }], explanation: "O nêutron, como o nome sugere, é eletricamente neutro e fica junto com os prótons no núcleo do átomo." },
            { question: "O que acontece com a corrente total em um circuito de pilhas em paralelo?", answers: [{ text: "A corrente total é a soma das correntes de cada pilha.", correct: true }, { text: "A corrente total é a mesma de uma única pilha.", correct: false }, { text: "A corrente total diminui a cada pilha adicionada.", correct: false }, { text: "A corrente se torna zero.", correct: false }], explanation: "A ligação em paralelo é usada para aumentar a duração (autonomia) do circuito. A corrente total fornecida é a soma das correntes individuais das pilhas." },
            { question: "Por que um pássaro pousado em um fio de alta tensão não toma choque?", answers: [{ text: "Porque os pés do pássaro são isolantes perfeitos.", correct: false }, { text: "Porque não há diferença de potencial (ddp) entre os seus dois pés.", correct: true }, { text: "Porque o fio não tem corrente elétrica passando.", correct: false }, { text: "Porque os pássaros são imunes à eletricidade.", correct: false }], explanation: "Para haver choque, é preciso que a corrente passe pelo corpo, e para isso é necessária uma diferença de potencial. Como os dois pés estão praticamente no mesmo potencial, a corrente 'prefere' continuar no fio, que é um caminho muito mais fácil." },
            { question: "O que o amperímetro mede em um circuito elétrico?", answers: [{ text: "A tensão (Volts)", correct: false }, { text: "A resistência (Ohms)", correct: false }, { text: "A intensidade da corrente (Ampères)", correct: true }, { text: "A potência (Watts)", correct: false }], explanation: "O amperímetro é o aparelho usado para medir a intensidade da corrente elétrica, em Ampères (A)." },
            { question: "Se um corpo está com excesso de elétrons, sua carga elétrica é:", answers: [{ text: "Positiva", correct: false }, { text: "Negativa", correct: true }, { text: "Neutra", correct: false }, { text: "Nula", correct: false }], explanation: "Como os elétrons têm carga negativa, um excesso deles torna a carga total do corpo negativa." },
            { question: "Em qual tipo de ligação a tensão (voltagem) é dividida entre os componentes?", answers: [{ text: "Em paralelo", correct: false }, { text: "Em série", correct: true }, { text: "Em ambas", correct: false }, { text: "Em nenhuma", correct: false }], explanation: "Na ligação em série, a tensão total da fonte é distribuída entre todos os componentes do circuito." },
            
            // Sistema Locomotor (20)
            { question: "Quais são os dois principais componentes do sistema locomotor?", answers: [{ text: "Cérebro e nervos", correct: false }, { text: "Ossos e músculos", correct: true }, { text: "Coração e vasos sanguíneos", correct: false }, { text: "Estômago e intestino", correct: false }], explanation: "O sistema locomotor é formado pela ação conjunta do esqueleto (ossos), que dá a estrutura, e dos músculos, que geram a força para o movimento." },
            { question: "Qual tipo de músculo é responsável pelos movimentos voluntários, como andar e levantar objetos?", answers: [{ text: "Estriado cardíaco", correct: false }, { text: "Liso", correct: false }, { text: "Estriado esquelético", correct: true }, { text: "Adiposo", correct: false }], explanation: "Os músculos estriados esqueléticos são aqueles que controlamos conscientemente, pois estão ligados ao esqueleto." },
            { question: "O crânio, a coluna vertebral e as costelas fazem parte de qual divisão do esqueleto?", answers: [{ text: "Esqueleto apendicular", correct: false }, { text: "Esqueleto axial", correct: true }, { text: "Esqueleto superior", correct: false }, { text: "Esqueleto inferior", correct: false }], explanation: "O esqueleto axial forma o eixo central de sustentação do corpo. O apendicular corresponde aos membros (braços e pernas)." },
            { question: "Qual é a função dos ossos relacionada à produção de células sanguíneas?", answers: [{ text: "Sustentação", correct: false }, { text: "Proteção", correct: false }, { text: "Armazenamento de minerais", correct: false }, { text: "Produção na medula óssea vermelha", correct: true }], explanation: "Dentro de alguns ossos, como os da bacia, fica a medula óssea vermelha, uma 'fábrica' de células sanguíneas (hemácias, leucócitos e plaquetas)." },
            { question: "No movimento de esticar o braço, qual músculo contrai e qual relaxa?", answers: [{ text: "O bíceps contrai e o tríceps relaxa.", correct: false }, { text: "O tríceps contrai e o bíceps relaxa.", correct: true }, { text: "Ambos contraem.", correct: false }, { text: "Ambos relaxam.", correct: false }], explanation: "Esse é o movimento antagônico. Para esticar o braço, o tríceps (músculo de trás) contrai, enquanto o bíceps (músculo da frente) relaxa." },
            { question: "O tecido muscular que forma o coração e tem contração rápida e involuntária é o:", answers: [{ text: "Estriado esquelético", correct: false }, { text: "Estriado cardíaco", correct: true }, { text: "Liso", correct: false }, { text: "Conjuntivo", correct: false }], explanation: "O músculo cardíaco (ou miocárdio) é único: suas fibras são estriadas, permitindo contrações fortes e rápidas, mas seu controle é involuntário." },
            { question: "Qual das seguintes funções NÃO é realizada pelo sistema esquelético?", answers: [{ text: "Proteção de órgãos internos.", correct: false }, { text: "Produção de hormônios como a testosterona.", correct: true }, { text: "Sustentação do corpo.", correct: false }, { text: "Armazenamento de cálcio.", correct: false }], explanation: "A produção de hormônios é função do sistema endócrino (glândulas), não do esquelético. As outras três são funções importantes dos ossos." },
            { question: "O que são tendões?", answers: [{ text: "Estruturas que ligam um osso a outro osso.", correct: false }, { text: "Estruturas que ligam os músculos aos ossos.", correct: true }, { text: "O tecido que forma o coração.", correct: false }, { text: "A parte interna dos ossos.", correct: false }], explanation: "Tendões são cordões fibrosos e resistentes que conectam os músculos aos ossos, permitindo que a força da contração muscular puxe o osso e gere movimento." },
            { question: "O movimento de órgãos como o estômago e o intestino é realizado por qual tipo de músculo?", answers: [{ text: "Estriado cardíaco", correct: false }, { text: "Liso", correct: true }, { text: "Estriado esquelético", correct: false }, { text: "Nervoso", correct: false }], explanation: "O músculo liso tem contração lenta e involuntária, sendo perfeito para realizar os movimentos internos do corpo, como a digestão (peristaltismo)." },
            { question: "O fêmur, o úmero e a tíbia fazem parte de qual divisão do esqueleto?", answers: [{ text: "Esqueleto axial", correct: false }, { text: "Esqueleto apendicular", correct: true }, { text: "Esqueleto craniano", correct: false }, { text: "Esqueleto torácico", correct: false }], explanation: "Esses são ossos longos que compõem os membros superiores (úmero) e inferiores (fêmur, tíbia), fazendo parte do esqueleto apendicular." },
            { question: "A fadiga muscular, ou dor após exercício intenso, está relacionada ao acúmulo de que substância?", answers: [{ text: "Glicose", correct: false }, { text: "Oxigênio", correct: false }, { text: "Ácido lático", correct: true }, { text: "Cálcio", correct: false }], explanation: "Durante exercícios muito intensos, o músculo pode realizar fermentação para obter energia rápida. Esse processo produz ácido lático, cujo acúmulo causa a sensação de queimação e dor." },
            { question: "Por que os ossos são considerados órgãos passivos e os músculos são órgãos ativos do movimento?", answers: [{ text: "Porque os ossos não se movem e os músculos sim.", correct: false }, { text: "Porque os músculos geram a força, e os ossos são apenas movidos por essa força.", correct: true }, { text: "Porque os ossos são mais duros que os músculos.", correct: false }, { text: "Porque os músculos gastam mais energia.", correct: false }], explanation: "Os músculos são ativos porque eles produzem a força (contração). Os ossos são passivos porque eles são as alavancas que são movidas pela força dos músculos." },
            { question: "A coluna vertebral é composta por ossos chamados:", answers: [{ text: "Falanges", correct: false }, { text: "Costelas", correct: false }, { text: "Vértebras", correct: true }, { text: "Tarsos", correct: false }], explanation: "A coluna é formada por uma pilha de vértebras, que protegem a medula espinhal e dão flexibilidade ao tronco." },
            { question: "Qual a principal fonte de energia para a contração muscular?", answers: [{ text: "Proteínas", correct: false }, { text: "Vitaminas", correct: false }, { text: "Água", correct: false }, { text: "Alimentos (glicose)", correct: true }], explanation: "A energia para os músculos trabalharem vem da quebra de nutrientes obtidos pela alimentação, principalmente a glicose, através da respiração celular." },
            { question: "O que são anabolizantes e por que são perigosos?", answers: [{ text: "Suplementos vitamínicos que aumentam a energia.", correct: false }, { text: "Hormônios sintéticos que imitam a testosterona e podem causar graves problemas de saúde.", correct: true }, { text: "Medicamentos para aliviar a dor muscular.", correct: false }, { text: "Bebidas energéticas usadas por atletas.", correct: false }], explanation: "Anabolizantes são drogas perigosas que forçam o aumento da massa muscular, mas com sérios efeitos colaterais, como problemas no fígado, coração e alterações hormonais." },
            { question: "Qual é a função do osso esterno?", answers: [{ text: "Proteger o cérebro.", correct: false }, { text: "Conectar as costelas na parte da frente do tórax.", correct: true }, { text: "Articular o braço com o ombro.", correct: false }, { text: "Formar a base da coluna.", correct: false }], explanation: "O esterno é o osso chato localizado no meio do peito, onde a maioria das costelas se conecta, ajudando a formar a caixa torácica." },
            { question: "O que é o movimento antagônico do deltoide e do grande dorsal?", answers: [{ text: "Flexionar e estender o cotovelo.", correct: false }, { text: "Levantar e abaixar o braço.", correct: true }, { text: "Girar o pescoço.", correct: false }, { text: "Flexionar o joelho.", correct: false }], explanation: "O deltoide (no ombro) é o principal músculo que levanta o braço, enquanto o grande dorsal (nas costas) é um dos principais que o abaixa." },
            { question: "Qual a diferença fundamental entre a matéria orgânica e inorgânica dos ossos?", answers: [{ text: "Orgânica dá rigidez (cálcio) e inorgânica dá flexibilidade (colágeno).", correct: false }, { text: "Orgânica dá flexibilidade (colágeno) e inorgânica dá rigidez (cálcio).", correct: true }, { text: "Ambas dão rigidez.", correct: false }, { text: "Ambas dão flexibilidade.", correct: false }], explanation: "A parte orgânica, principalmente a proteína colágeno, dá elasticidade ao osso. A parte inorgânica, formada por sais de cálcio e fósforo, confere dureza e rigidez." },
            { question: "A clavícula e a escápula formam qual estrutura?", answers: [{ text: "A cintura pélvica (quadril).", correct: false }, { text: "A cintura escapular (ombro).", correct: true }, { text: "A caixa torácica.", correct: false }, { text: "A articulação do joelho.", correct: false }], explanation: "A cintura escapular é o conjunto de ossos que conecta os membros superiores (braços) ao esqueleto axial." },
            { question: "Qual tipo de músculo não possui estrias e tem contração lenta e involuntária?", answers: [{ text: "Cardíaco", correct: false }, { text: "Esquelético", correct: false }, { text: "Liso", correct: true }, { text: "Antagônico", correct: false }], explanation: "O músculo liso, encontrado nas paredes de órgãos internos, é o único que não possui as estrias transversais visíveis no microscópio." },
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions];
            shuffleArray(questions);
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;

            const correct = selectedButton.dataset.correct === 'true';

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) button.classList.add('correct');
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
             if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Heitor de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
