<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interdisciplinar - 8º Ano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #ef4444;
            --theme-dark: #dc2626;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Fredoka One', cursive; 
            background-color: var(--background-color); 
            color: var(--dark-grey); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .container { 
            background-color: white; 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); 
            border: 5px solid var(--light-grey); 
            text-align: center; 
        }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.1rem; 
            padding: 15px 20px; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.1s ease-in-out; 
            margin: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        button:active { transform: translateY(4px); }
        .btn-primary { 
            background-color: var(--theme-color); 
            color: white; 
            border-bottom: 6px solid var(--theme-dark); 
        }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f87171; }
        input { 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 1.1rem; 
            padding: 15px; 
            border-radius: 12px; 
            border: 3px solid var(--light-grey); 
            margin-bottom: 15px; 
            width: 100%; 
        }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { 
            background: var(--light-grey); 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 15px; 
        }
        #quiz-screen #answers-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
        }
        #answers-container button { 
            width: 100%; 
            min-height: 60px; 
            color: var(--dark-grey); 
            border: none; 
            border-bottom-width: 6px; 
            border-bottom-style: solid; 
            text-transform: none; 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 0.9rem; 
            padding: 10px; 
        }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            text-align: center; 
            font-size: 1.2rem; 
            margin-top: 20px; 
            color: var(--dark-grey); 
            background-color: var(--light-grey); 
            padding: 10px; 
            border-radius: 15px; 
        }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { 
            min-height: 350px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { 
            font-family: 'Poppins', sans-serif; 
            font-size: 1.1rem; 
            font-weight: 600; 
            max-width: 90%; 
            margin-bottom: 25px; 
        }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { 
            margin-top: 2rem; 
            max-height: 60vh; 
            overflow-y: auto; 
            padding-right: 1rem; 
            text-align: left;
        }
        .review-item { 
            background-color: var(--light-grey); 
            border-radius: 12px; 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
        }
        .review-item h3 { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.2rem; 
            margin-bottom: 1rem; 
        }
        .review-item p { 
            font-family: 'Poppins', sans-serif; 
            margin-bottom: 0.5rem; 
            font-size: 0.9rem; 
        }
        .review-answer { 
            padding: 0.5rem; 
            border-radius: 8px; 
            margin-bottom: 0.25rem; 
        }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { 
            background-color: #ffedd5; 
            padding: 1rem; 
            margin-top: 1rem; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            border-left: 5px solid var(--theme-color); 
        }

        @keyframes correct-animation { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 
            100% { transform: scale(1); } 
        }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 
            0%, 100% { transform: translateX(0); } 
            20% { transform: translateX(-10px); } 
            40% { transform: translateX(10px); } 
            60% { transform: translateX(-10px); } 
            80% { transform: translateX(10px); } 
        }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1>Quiz Interdisciplinar</h1>
            <p>Preparação para as provas P2 e Institucionais do 8º ano! 50 questões - Cada resposta correta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar Prova!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Questão 1 / 50</div>
                <div id="score">Pontuação: 0</div>
                <div id="correct-answers">Corretas: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Questão</button>
        </div>

        <div id="results-screen">
            <h1>Prova Finalizada!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final é:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Refazer Prova</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

            },
            {
                question: "O que é feedback negativo?",
                answers: [
                    { text: "Aumenta produção", correct: false },
                    { text: "Rejeita hormônio", correct: false },
                    { text: "Para glândulas", correct: false },
                    { text: "Para produção quando atinge nível", correct: true }
                ],
                explanation: "Interrompe produção quando suficiente."
            },
            {
                question: "Hormônio do crescimento é produzido por?",
                answers: [
                    { text: "Tireoide", correct: false },
                    { text: "Pâncreas", correct: false },
                    { text: "Suprarrenal", correct: false },
                    { text: "Hipófise", correct: true }
                ],
                explanation: "GH (Hormônio do Crescimento) da hipófise."
            },
            {
                question: "O que é hipertireoidismo?",
                answers: [
                    { text: "Falta hormônio tireoide", correct: false },
                    { text: "Excesso insulina", correct: false },
                    { text: "Falta insulina", correct: false },
                    { text: "Excesso hormônio tireoide", correct: true }
                ],
                explanation: "Metabolismo acelerado, perda peso."
            },
            {
                question: "Hormônio antidiurético (ADH) atua em?",
                answers: [
                    { text: "Fígado", correct: false },
                    { text: "Pulmões", correct: false },
                    { text: "Coração", correct: false },
                    { text: "Rins", correct: true }
                ],
                explanation: "Aumenta reabsorção de água nos rins."
            },
            {
                question: "O que é bócio?",
                answers: [
                    { text: "Aumento pâncreas", correct: false },
                    { text: "Aumento hipófise", correct: false },
                    { text: "Aumento fígado", correct: false },
                    { text: "Aumento da tireoide", correct: true }
                ],
                explanation: "Causado muitas vezes por falta de iodo."
            },

            // ARTE (4 perguntas)
            {
                question: "Diferença percepção objetiva e subjetiva?",
                answers: [
                    { text: "Objetiva: científica", correct: false },
                    { text: "Objetiva: antiga", correct: false },
                    { text: "Objetiva: realista", correct: false },
                    { text: "Objetiva: forma; Subjetiva: interpretação", correct: true }
                ],
                explanation: "Objetiva: elementos visuais. Subjetiva: significado."
            },
            {
                question: "O que é símbolo?",
                answers: [
                    { text: "Só imagem religiosa", correct: false },
                    { text: "Tipo pintura", correct: false },
                    { text: "Figura geométrica", correct: false },

                ],
                explanation: "Sugere, evoca ou substitui algo."
            },
            {
                question: "Propósito original símbolo paz (CND)?",
                answers: [

                    { text: "Amor universal", correct: false },

                ],
                explanation: "Criado para Campanha pelo Desarmamento Nuclear."
            },
            {
                question: "O que é ícone no contexto religioso?",
                answers: [
                    { text: "Estatueta pagã", correct: false },

                    { text: "Arquitetura religiosa", correct: false },
                    { text: "Imagem sagrada", correct: true }
                ],
                explanation: "Imagens em igrejas cristãs."
            },

            // PROGRAMAÇÃO (3 perguntas)
            {
                question: "O que loop permite em programação?",
                answers: [
                    { text: "Armazenar dados", correct: false },
                    { text: "Conectar internet", correct: false },
                    { text: "Criar interfaces", correct: false },
                    { text: "Repetir código", correct: true }
                ],
                explanation: "Executar mesma tarefa várias vezes."
            },
            {
                question: "No problema garçom, 8 latas e 5 copos?",
                answers: [
                    { text: "Não quebra", correct: false },
                    { text: "Quebra 3 copos", correct: false },
                    { text: "Derruba latas", correct: false },
                    { text: "Quebra 5 copos", correct: true }
                ],
                explanation: "Latas > Copos = quebra todos copos."
            },
            {
                question: "Quando loop 'while' para?",
                answers: [
                    { text: "Após 100 repetições", correct: false },
                    { text: "Quando computador desliga", correct: false },
                    { text: "Quando usuário clica", correct: false },
                    { text: "Quando condição falsa", correct: true }
                ],
                explanation: "Repete enquanto condição verdadeira."
            },

            // MATEMÁTICA (3 perguntas)
            {
                question: "Quando grandezas inversamente proporcionais?",
                answers: [
                    { text: "Ambas aumentam", correct: false },
                    { text: "Não relacionadas", correct: false },
                    { text: "Ambas constantes", correct: false },
                    { text: "Uma aumenta, outra diminui", correct: true }
                ],
                explanation: "Velocidade e tempo: mesma distância."
            },
            {
                question: "O que é dízima periódica composta?",
                answers: [
                    { text: "Repete após vírgula", correct: false },
                    { text: "Sem parte decimal", correct: false },
                    { text: "Número inteiro", correct: false },
                    { text: "Tem anteperíodo", correct: true }
                ],
                explanation: "Exemplo: 0,2777... (anteperíodo: 2, período: 7)."
            },
            {
                question: "Gráfico grandezas diretamente proporcionais?",
                answers: [
                    { text: "Hipérbole", correct: false },
                    { text: "Parábola", correct: false },
                    { text: "Circunferência", correct: false },
                    { text: "Reta pela origem", correct: true }
                ],
                explanation: "Reta que passa pelo ponto (0,0)."
            }
        ];

        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        
        // Variáveis do jogo
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let playerName = "";

        // Elementos da interface
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            results: document.getElementById('results-screen'),
            explanation: document.getElementById('explanation-screen'),
            review: document.getElementById('review-screen')
        };
        
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        const seeExplanationBtn = document.getElementById('see-explanation-btn');

        // Funções principais
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.style.display = 'none');
            screens[screenName].style.display = 'block';
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function startGame() {
            playerName = playerNameInput.value.trim() || "Estudante";
            if (playerName === "") {
                alert("Por favor, digite seu nome!");
                return;
            }
            
            questions = shuffleArray(allQuestions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            
            scoreText.innerText = `Pontuação: 0`;
            correctAnswersText.innerText = `Corretas: 0`;
            
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            
            if (currentQuestionIndex >= questions.length) {
                showResults();
                return;
            }
            
            const currentQuestion = questions[currentQuestionIndex];
            progressText.innerText = `Questão ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.innerHTML = currentQuestion.question;
            
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            
            // Embaralhar as respostas de cada pergunta
            const shuffledAnswers = shuffleArray([...currentQuestion.answers]);
            
            shuffledAnswers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() {
            seeExplanationBtn.style.display = 'none';
            questionText.innerHTML = '';
            while (answersContainer.firstChild) {
                answersContainer.removeChild(answersContainer.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedButton = e.target;
            const correct = selectedButton.dataset.correct === 'true';
            const currentQuestion = questions[currentQuestionIndex];
            
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: currentQuestion.answers.find(ans => ans.correct).text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontuação: ${score}`;
                correctAnswersText.innerText = `Corretas: ${correctAnswersCount}`;
                selectedButton.classList.add('correct', 'correct-animation');
            } else {
                selectedButton.classList.add('incorrect', 'incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true') {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            const currentQuestion = questions[currentQuestionIndex];
            showScreen('explanation');
            
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = currentQuestion.explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            showScreen('quiz');
            showQuestion();
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    let indicator = '';
                    
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                        indicator = answerData.wasCorrect ? ' ✅' : ' ❌';
                    }
                    
                    answersHtml += `<p class="${classList}">${ans.text}${indicator}</p>`;
                });

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
            playerNameInput.focus();
        }

        // Configurar eventos
        document.addEventListener('DOMContentLoaded', function() {
            reviewBtn.addEventListener('click', showReview);
            
            playerNameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    startGame();
                }
            });
            
            playerNameInput.focus();
        });
    </script>
</body>
</html>
