<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interdisciplinar - 8º Ano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #ef4444;
            --theme-dark: #dc2626;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Fredoka One', cursive; 
            background-color: var(--background-color); 
            color: var(--dark-grey); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .container { 
            background-color: white; 
            padding: 20px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 800px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); 
            border: 5px solid var(--light-grey); 
            text-align: center; 
        }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.1rem; 
            padding: 15px 20px; 
            border-radius: 12px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.1s ease-in-out; 
            margin: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        button:active { transform: translateY(4px); }
        .btn-primary { 
            background-color: var(--theme-color); 
            color: white; 
            border-bottom: 6px solid var(--theme-dark); 
        }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f87171; }
        input { 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 1.1rem; 
            padding: 15px; 
            border-radius: 12px; 
            border: 3px solid var(--light-grey); 
            margin-bottom: 15px; 
            width: 100%; 
        }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { 
            background: var(--light-grey); 
            padding: 20px; 
            margin-bottom: 25px; 
            border-radius: 15px; 
        }
        #quiz-screen #answers-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
        }
        #answers-container button { 
            width: 100%; 
            min-height: 60px; 
            color: var(--dark-grey); 
            border: none; 
            border-bottom-width: 6px; 
            border-bottom-style: solid; 
            text-transform: none; 
            font-family: 'Poppins', sans-serif; 
            font-weight: 600; 
            font-size: 0.9rem; 
            padding: 10px; 
        }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            text-align: center; 
            font-size: 1.2rem; 
            margin-top: 20px; 
            color: var(--dark-grey); 
            background-color: var(--light-grey); 
            padding: 10px; 
            border-radius: 15px; 
        }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { 
            min-height: 350px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { 
            font-family: 'Poppins', sans-serif; 
            font-size: 1.1rem; 
            font-weight: 600; 
            max-width: 90%; 
            margin-bottom: 25px; 
        }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { 
            margin-top: 2rem; 
            max-height: 60vh; 
            overflow-y: auto; 
            padding-right: 1rem; 
            text-align: left;
        }
        .review-item { 
            background-color: var(--light-grey); 
            border-radius: 12px; 
            padding: 1.5rem; 
            margin-bottom: 1rem; 
        }
        .review-item h3 { 
            font-family: 'Fredoka One', cursive; 
            font-size: 1.2rem; 
            margin-bottom: 1rem; 
        }
        .review-item p { 
            font-family: 'Poppins', sans-serif; 
            margin-bottom: 0.5rem; 
            font-size: 0.9rem; 
        }
        .review-answer { 
            padding: 0.5rem; 
            border-radius: 8px; 
            margin-bottom: 0.25rem; 
        }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { 
            background-color: #ffedd5; 
            padding: 1rem; 
            margin-top: 1rem; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            border-left: 5px solid var(--theme-color); 
        }

        @keyframes correct-animation { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 
            100% { transform: scale(1); } 
        }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 
            0%, 100% { transform: translateX(0); } 
            20% { transform: translateX(-10px); } 
            40% { transform: translateX(10px); } 
            60% { transform: translateX(-10px); } 
            80% { transform: translateX(10px); } 
        }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="start-screen">
            <h1>Quiz Interdisciplinar</h1>
            <p>Preparação para as provas P2 e Institucionais do 8º ano! Cada resposta correta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar Prova!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Questão 1 / 25</div>
                <div id="score">Pontuação: 0</div>
                <div id="correct-answers">Corretas: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Questão</button>
        </div>

        <div id="results-screen">
            <h1>Prova Finalizada!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final é:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Refazer Prova</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        // Array com 25 perguntas focadas nos tópicos das provas P2 e Institucionais
        const allQuestions = [
            // HISTÓRIA (5 perguntas)
            {
                question: "Qual era a principal justificativa ideológica do Imperialismo europeu no século XIX?",
                answers: [
                    { text: "A 'Missão Civilizadora' de levar progresso a povos 'atrasados'", correct: true },
                    { text: "A necessidade de espalhar a democracia pelo mundo", correct: false },
                    { text: "O desejo de acabar com a escravidão", correct: false },
                    { text: "A busca por liberdade religiosa", correct: false }
                ],
                explanation: "Os europeus defendiam que sua dominação era uma 'missão' para levar a 'civilização' a povos considerados 'atrasados', justificando assim a exploração."
            },
            {
                question: "O que foi o Darwinismo Social?",
                answers: [
                    { text: "Aplicação incorreta da teoria evolutiva para justificar desigualdades", correct: true },
                    { text: "Teoria científica sobre evolução das espécies", correct: false },
                    { text: "Movimento de preservação ambiental", correct: false },
                    { text: "Sistema econômico baseado na cooperação", correct: false }
                ],
                explanation: "O Darwinismo Social foi uma aplicação incorreta da teoria da seleção natural às sociedades humanas, justificando a desigualdade social e o domínio de nações europeias sobre outras."
            },
            {
                question: "Qual era a diferença fundamental entre a colonização da América Anglo-Saxônica e da América Latina?",
                answers: [
                    { text: "Povoamento versus exploração", correct: true },
                    { text: "Religiosa versus econômica", correct: false },
                    { text: "Pacífica versus violenta", correct: false },
                    { text: "Temporária versus permanente", correct: false }
                ],
                explanation: "A América Anglo-Saxônica teve colonização de povoamento (interesse em habitar as terras), enquanto a América Latina sofreu colonização de exploração (interesse em extrair riquezas)."
            },
            {
                question: "O que caracterizava a 'Era Vitoriana' no Império Britânico?",
                answers: [
                    { text: "Período de grande expansão colonial e poder britânico", correct: true },
                    { text: "Era das revoluções industriais", correct: false },
                    { text: "Fase de declínio do imperialismo", correct: false },
                    { text: "Período de guerras constantes na Europa", correct: false }
                ],
                explanation: "A Era Vitoriana (1837-1901) foi o auge do Império Britânico, conhecido como 'o império onde o Sol nunca se põe', com grande expansão colonial e poderio naval."
            },
            {
                question: "Qual era o objetivo da política de 'branqueamento' no Brasil pós-abolição?",
                answers: [
                    { text: "Promover imigração europeia para 'embranquecer' a população", correct: true },
                    { text: "Melhorar as condições de higiene pública", correct: false },
                    { text: "Valorizar a cultura africana", correct: false },
                    { text: "Distribuir terras para ex-escravizados", correct: false }
                ],
                explanation: "A política de 'branqueamento' promoveu a imigração europeia baseada na crença racista de que o 'sangue superior' dos brancos iria 'diluir' a população negra."
            },

            // INGLÊS (4 perguntas)
            {
                question: "Complete a frase em inglês: 'This pen is ____' (significando que a caneta pertence a mim)",
                answers: [
                    { text: "mine", correct: true },
                    { text: "my", correct: false },
                    { text: "me", correct: false },
                    { text: "I", correct: false }
                ],
                explanation: "'Mine' é o pronome possessivo que substitui 'my pen', indicando posse sem repetir o substantivo."
            },
            {
                question: "Qual destes NÃO é um pronome possessivo em inglês?",
                answers: [
                    { text: "Your", correct: true },
                    { text: "Mine", correct: false },
                    { text: "Hers", correct: false },
                    { text: "Ours", correct: false }
                ],
                explanation: "'Your' é um adjetivo possessivo (sempre seguido por substantivo), enquanto 'mine', 'hers' e 'ours' são pronomes possessivos (substituem o substantivo)."
            },
            {
                question: "Qual destes pronomes reflexivos em inglês está correto para 'nós mesmos'?",
                answers: [
                    { text: "Ourselves", correct: true },
                    { text: "Ourself", correct: false },
                    { text: "Ourselfs", correct: false },
                    { text: "Ours", correct: false }
                ],
                explanation: "Os pronomes reflexivos são: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. 'Ourselves' é a forma correta para 'nós mesmos'."
            },
            {
                question: "Quando usamos pronomes reflexivos em inglês para dar ênfase?",
                answers: [
                    { text: "Para indicar que alguém fez algo sozinho", correct: true },
                    { text: "Para mostrar posse de objetos", correct: false },
                    { text: "Para fazer perguntas", correct: false },
                    { text: "Para descrever características físicas", correct: false }
                ],
                explanation: "Pronomes reflexivos podem ser usados para ênfase, significando 'sozinho' ou 'em pessoa', como em 'He built the house by himself'."
            },

            // GEOGRAFIA (4 perguntas)
            {
                question: "Qual destas formações vegetais é caracterizada por musgos e liquens em clima polar?",
                answers: [
                    { text: "Tundra", correct: true },
                    { text: "Taiga", correct: false },
                    { text: "Savana", correct: false },
                    { text: "Floresta Tropical", correct: false }
                ],
                explanation: "A Tundra é composta por musgos e liquens, associada ao clima polar, e aparece em um curto período de verão no extremo norte do continente."
            },
            {
                question: "O que são 'maquiladoras' no contexto mexicano?",
                answers: [
                    { text: "Fábricas de montagem na fronteira com os EUA", correct: true },
                    { text: "Plantações de café para exportação", correct: false },
                    { text: "Minas de prata históricas", correct: false },
                    { text: "Mercados de artesanato local", correct: false }
                ],
                explanation: "Maquiladoras são fábricas de montagem que importam peças dos EUA, montam o produto final no México com mão de obra mais barata e exportam de volta para os EUA."
            },
            {
                question: "Qual destes problemas ambientais está associado ao fracking?",
                answers: [
                    { text: "Contaminação de águas subterrâneas", correct: true },
                    { text: "Destruição da camada de ozônio", correct: false },
                    { text: "Aumento do nível do mar", correct: false },
                    { text: "Chuva ácida", correct: false }
                ],
                explanation: "O fracking (fraturamento hidráulico) apresenta riscos de contaminação de aquíferos (águas subterrâneas) devido a possíveis vazamentos de produtos químicos usados no processo."
            },
            {
                question: "Qual destas características NÃO pertence à Floresta Tropical?",
                answers: [
                    { text: "Folhas que caem no outono (caducifólia)", correct: true },
                    { text: "Alta biodiversidade", correct: false },
                    { text: "Grande quantidade de chuvas", correct: false },
                    { text: "Folhas largas (latifoliada)", correct: false }
                ],
                explanation: "A Floresta Tropical é higrófila (precisa de muita água), latifoliada (folhas largas) e heterogênea (muitas espécies). Já a perda de folhas no outono é característica da Floresta Temperada."
            },

            // PORTUGUÊS (3 perguntas)
            {
                question: "Qual a diferença principal entre FATO e OPINIÃO?",
                answers: [
                    { text: "Fato é comprovável; opinião é julgamento pessoal", correct: true },
                    { text: "Fato é sempre verdadeiro; opinião é sempre falsa", correct: false },
                    { text: "Fato é científico; opinião é religiosa", correct: false },
                    { text: "Fato é moderno; opinião é antiga", correct: false }
                ],
                explanation: "Fato é uma informação objetiva, imparcial e comprovável. Opinião é um julgamento pessoal, subjetivo, baseado em experiências e valores."
            },
            {
                question: "O que caracteriza um ESTEREÓTIPO?",
                answers: [
                    { text: "Generalização falsa e preconceituosa sobre um grupo", correct: true },
                    { text: "Opinião baseada em fatos científicos", correct: false },
                    { text: "Descrição detalhada de características individuais", correct: false },
                    { text: "Análise objetiva de dados estatísticos", correct: false }
                ],
                explanation: "Estereótipo é um tipo de opinião baseada em ideias preconcebidas e generalizações falsas sobre um grupo de pessoas."
            },
            {
                question: "Qual é a função de uma ORAÇÃO SUBORDINADA ADJETIVA?",
                answers: [
                    { text: "Caracterizar um substantivo da oração principal", correct: true },
                    { text: "Indicar tempo ou causa de uma ação", correct: false },
                    { text: "Expressar uma conclusão", correct: false },
                    { text: "Mostrar alternância entre ideias", correct: false }
                ],
                explanation: "Orações subordinadas adjetivas funcionam como adjetivos, caracterizando um substantivo da oração principal. São iniciadas por pronomes relativos (que, o qual, onde)."
            },

            // CIÊNCIAS (4 perguntas)
            {
                question: "Qual destes hormônios é produzido pelo pâncreas e reduz o nível de glicose no sangue?",
                answers: [
                    { text: "Insulina", correct: true },
                    { text: "Adrenalina", correct: false },
                    { text: "Cortisol", correct: false },
                    { text: "Glucagon", correct: false }
                ],
                explanation: "A insulina é liberada quando o nível de glicose no sangue aumenta e ajuda as células a absorverem a glicose, reduzindo o açúcar no sangue."
            },
            {
                question: "O que caracteriza o diabetes tipo 1?",
                answers: [
                    { text: "O corpo não produz insulina suficiente", correct: true },
                    { text: "O corpo desenvolve resistência à insulina", correct: false },
                    { text: "É causado apenas por obesidade", correct: false },
                    { text: "Acontece apenas em adultos", correct: false }
                ],
                explanation: "No diabetes tipo 1, o corpo não produz insulina suficiente devido a uma doença autoimune que destrói as células do pâncreas produtoras de insulina."
            },
            {
                question: "O que é a hipófise no sistema endócrino?",
                answers: [
                    { text: "A glândula mestra que controla outras glândulas", correct: true },
                    { text: "A glândula que produz insulina", correct: false },
                    { text: "A glândula do estresse", correct: false },
                    { text: "A glândula do crescimento ósseo", correct: false }
                ],
                explanation: "A hipófise é considerada a 'glândula mestra' porque regula o funcionamento de várias outras glândulas endócrinas através de hormônios estimulantes."
            },
            {
                question: "No sistema endócrino, o que acontece no mecanismo de feedback negativo?",
                answers: [
                    { text: "A produção de hormônio para quando atinge o nível necessário", correct: true },
                    { text: "A produção de hormônio aumenta continuamente", correct: false },
                    { text: "O corpo rejeita o hormônio produzido", correct: false },
                    { text: "As glândulas param de funcionar permanentemente", correct: false }
                ],
                explanation: "No feedback negativo, quando a concentração de um hormônio atinge o nível necessário, o estímulo para a glândula que produz esse hormônio é interrompido."
            },

            // ARTE (2 perguntas)
            {
                question: "Qual a diferença entre percepção OBJETIVA e SUBJETIVA na arte?",
                answers: [
                    { text: "Objetiva foca na forma; subjetiva na interpretação", correct: true },
                    { text: "Objetiva é científica; subjetiva é emocional", correct: false },
                    { text: "Objetiva é antiga; subjetiva é moderna", correct: false },
                    { text: "Objetiva é realista; subjetiva é abstrata", correct: false }
                ],
                explanation: "Percepção objetiva foca na exterioridade e aspectos formais da obra. Percepção subjetiva foca na interioridade, aspectos sensíveis, emocionais e interpretação pessoal."
            },
            {
                question: "O que é um SÍMBOLO na arte?",
                answers: [
                    { text: "Algo que representa, designa ou sugere outra coisa", correct: true },
                    { text: "Apenas uma imagem religiosa", correct: false },
                    { text: "Um tipo específico de pintura", correct: false },
                    { text: "Uma figura geométrica", correct: false }
                ],
                explanation: "Símbolo refere-se a sinais, emblemas ou insígnias que representam, designam, sugerem, evocam ou substituem alguma outra coisa."
            },

            // PROGRAMAÇÃO (2 perguntas)
            {
                question: "Em programação, o que uma estrutura de repetição (loop) permite fazer?",
                answers: [
                    { text: "Executar o mesmo código várias vezes", correct: true },
                    { text: "Armazenar diferentes tipos de dados", correct: false },
                    { text: "Conectar-se à internet", correct: false },
                    { text: "Criar interfaces gráficas", correct: false }
                ],
                explanation: "Estruturas de repetição (loops) são comandos usados para realizar a mesma tarefa várias vezes sem precisar reescrever o código."
            },
            {
                question: "No problema do garçom da OBI, se em uma bandeja há 8 latas e 5 copos, o que acontece?",
                answers: [
                    { text: "Todos os 5 copos são quebrados", correct: true },
                    { text: "Nenhum copo é quebrado", correct: false },
                    { text: "Apenas 3 copos são quebrados", correct: false },
                    { text: "As latas são derrubadas", correct: false }
                ],
                explanation: "Quando o número de latas é maior que o número de copos (8 > 5), o garçom se atrapalha e quebra todos os copos daquela bandeja."
            },

            // MATEMÁTICA (2 perguntas)
            {
                question: "Quando duas grandezas são INVERSAMENTE PROPORCIONAIS?",
                answers: [
                    { text: "Quando uma aumenta e a outra diminui na mesma proporção", correct: true },
                    { text: "Quando as duas aumentam juntas", correct: false },
