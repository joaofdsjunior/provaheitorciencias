<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Português - Orações Adjetivas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #f59e0b; /* Laranja */
            --theme-dark: #d97706;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #f97316; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #fffbeb; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz de Português</h1>
            <p>Teste seus conhecimentos sobre Orações, Fato e Opinião! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Orações Subordinadas Adjetivas (10)
            { question: "Na frase: 'Os alunos que estudam muito passam de ano', a oração 'que estudam muito' é:", answers: [{ text: "Explicativa (com vírgula)", correct: false }, { text: "Restritiva (sem vírgula)", correct: true }, { text: "Fato", correct: false }, { text: "Opinião", correct: false }], explanation: "É Restritiva. A oração está restringindo o grupo de alunos. Não são 'todos' os alunos, apenas 'aqueles que estudam muito'. Por isso, é escrita sem vírgulas." },
            { question: "Na frase: 'O Sol, que é uma estrela, ilumina a Terra', a oração 'que é uma estrela' é:", answers: [{ text: "Restritiva (sem vírgula)", correct: false }, { text: "Explicativa (com vírgula)", correct: true }, { text: "Fato", correct: false }, { text: "Opinião", correct: false }], explanation: "É Explicativa. A informação está entre vírgulas e dá uma explicação extra sobre o Sol (que é único). Se tirarmos a oração, a frase principal continua fazendo sentido." },
            { question: "Qual a diferença de sentido entre 'Meninas que não caíram na conversa mole' e 'Meninas, que não caíram na conversa mole'?", answers: [{ text: "Nenhuma, as duas significam a mesma coisa.", correct: false }, { text: "A primeira (sem vírgula) restringe o grupo; a segunda (com vírgula) explica sobre todas as meninas.", correct: true }, { text: "A primeira é uma opinião, a segunda é um fato.", correct: false }, { text: "A primeira está certa e a segunda errada.", correct: false }], explanation: "A oração restritiva (sem vírgula) individualiza ('só as meninas que não caíram...'). A explicativa (com vírgula) generaliza ('todas as meninas, e aliás, elas não caíram...')." },
            { question: "Qual tipo de oração adjetiva usa vírgulas para separar a explicação?", answers: [{ text: "Restritiva", correct: false }, { text: "Explicativa", correct: true }, { text: "Assindética", correct: false }, { text: "Coordenada", correct: false }], explanation: "A vírgula é a marca principal da Oração Subordinada Adjetiva Explicativa, indicando que é uma informação adicional, e não essencial." },
            { question: "Em 'Adoramos os esportistas que têm uma alimentação adequada', a oração adjetiva:", answers: [{ text: "Explica todos os esportistas.", correct: false }, { text: "Restringe, informando que adoramos apenas os esportistas com alimentação adequada.", correct: true }, { text: "É uma opinião.", correct: false }, { text: "Está separada por vírgulas.", correct: false }], explanation: "A ausência de vírgulas torna a oração restritiva. Isso significa que não adoramos 'todos' os esportistas, mas sim um grupo específico: 'aqueles que têm alimentação adequada'." },
            { question: "Transforme a frase 'Recepcionaram o hóspede estrangeiro' em uma oração adjetiva.", answers: [{ text: "Recepcionaram o hóspede, que era estrangeiro.", correct: true }, { text: "Recepcionaram o hóspede e ele era estrangeiro.", correct: false }, { text: "Recepcionaram o hóspede pois era estrangeiro.", correct: false }, { text: "Recepcionaram o hóspede e o estrangeiro.", correct: false }], explanation: "O pronome relativo 'que' substitui a palavra 'hóspede' e introduz a oração adjetiva ('que era estrangeiro'), que equivale ao adjetivo 'estrangeiro'." },
            { question: "As orações subordinadas adjetivas são introduzidas por qual tipo de palavra?", answers: [{ text: "Conjunções coordenativas (mas, pois, e...)", correct: false }, { text: "Pronomes relativos (que, o qual, onde, cujo...)", correct: true }, { text: "Advérbios de tempo (ontem, hoje...)", correct: false }, { text: "Preposições (de, com, em...)", correct: false }], explanation: "Os pronomes relativos são a marca principal dessas orações, pois eles 'retomam' um termo da oração principal (o antecedente)." },
            { question: "Em 'Meu pai, que é professor, adora ler', a oração 'que é professor' é explicativa. Por quê?", answers: [{ text: "Porque eu só tenho um pai e a informação é uma explicação extra.", correct: true }, { text: "Porque 'professor' é um adjetivo.", correct: false }, { text: "Porque a frase não tem vírgula.", correct: false }, { text: "Porque nem todo pai é professor (restringe).", correct: false }], explanation: "Como 'Meu pai' é um termo único e já definido, a oração entre vírgulas serve apenas para dar uma qualidade a ele, e não para limitar ou restringir." },
            { question: "Qual frase possui uma Oração Subordinada Adjetiva RESTRITIVA?", answers: [{ text: "O homem, que é um ser racional, domina a natureza.", correct: false }, { text: "O Brasil, que fica na América do Sul, é um país grande.", correct: false }, { text: "As pessoas que não praticam esportes são mais sedentárias.", correct: true }, { text: "O café, que é uma bebida saborosa, é exportado pelo Brasil.", correct: false }], explanation: "A oração 'que não praticam esportes' está sem vírgulas e restringe o grupo de 'pessoas'. Ela define 'quais' pessoas são mais sedentárias." },
            { question: "Qual frase NÃO pode ter a oração adjetiva transformada em explicativa (com vírgulas)?", answers: [{ text: "Os cães que latem muito me irritam.", correct: false }, { text: "Os políticos que são honestos merecem respeito.", correct: false }, { text: "Todos os homens são persistentes e não costumam desistir.", correct: true }, { text: "Os alunos que estudam aprendem.", correct: false }], explanation: "A frase 'Todos os homens são persistentes...' não possui um pronome relativo ('que'). Ela é composta por duas orações coordenadas ('são persistentes' E 'não costumam...'). As outras poderiam usar vírgulas (mudando o sentido)." },

            // Fato vs. Opinião (10)
            { question: "O que é um FATO?", answers: [{ text: "Algo que pode ser comprovado (verdadeiro ou falso).", correct: true }, { text: "Um julgamento pessoal ou um sentimento sobre algo.", correct: false }, { text: "Uma explicação sobre o porquê de algo acontecer.", correct: false }, { text: "Uma mentira.", correct: false }], explanation: "Um fato é uma informação objetiva, algo que aconteceu ou que existe e pode ser verificado (Ex: 'A casa é amarela')." },
            { question: "O que é uma OPINIÃO?", answers: [{ text: "Algo que pode ser provado com dados.", correct: false }, { text: "Uma informação que está em um dicionário.", correct: false }, { text: "Um julgamento pessoal, um sentimento ou o que alguém acha sobre algo.", correct: true }, { text: "Uma notícia de jornal.", correct: false }], explanation: "Uma opinião é subjetiva, é o que alguém pensa ou sente. (Ex: 'A casa amarela é a mais bonita da rua')." },
            { question: "Qual das frases abaixo expressa um FATO?", answers: [{ text: "Gostaria que a rua fosse mais colorida.", correct: false }, { text: "A rua ficou mais alegre!", correct: false }, { text: "A fachada da casa foi pintada.", correct: true }, { text: "A pintura da casa ficou horrível.", correct: false }], explanation: "As outras opções são opiniões ('Gostaria que...', 'mais alegre', 'horrível'). Que a fachada foi pintada é um acontecimento que pode ser verificado." },
            { question: "Qual das frases abaixo expressa uma OPINIÃO?", answers: [{ text: "O filme 'Rei Leão' é uma animação da Disney.", correct: false }, { text: "O filme 'Rei Leão' é o melhor filme já feito.", correct: true }, { text: "O filme 'Rei Leão' arrecadou milhões na bilheteria.", correct: false }, { text: "O filme 'Rei Leão' tem músicas de Elton John.", correct: false }], explanation: "Dizer que é 'o melhor' é um julgamento pessoal, uma opinião. As outras frases são fatos que podem ser comprovados." },
            { question: "O que é uma INTERPRETAÇÃO?", answers: [{ text: "É o mesmo que um fato.", correct: false }, { text: "É o ato de dar sentido aos fatos, buscando causas e consequências.", correct: true }, { text: "É o mesmo que uma opinião.", correct: false }, { text: "É uma informação falsa.", correct: false }], explanation: "A interpretação é uma análise dos fatos. (Ex: Fato: 'O time perdeu'. Interpretação: 'O time perdeu porque o técnico escalou mal')." },
            { question: "Na frase: 'A mãe foi viajar porque considerou importante estudar em outro país'. A parte 'porque considerou importante...' é:", answers: [{ text: "Um Fato (o que aconteceu).", correct: false }, { text: "Uma Opinião (o que ela sentiu).", correct: false }, { text: "Uma Interpretação (uma possível causa para o fato).", correct: true }, { text: "Nenhuma das anteriores.", correct: false }], explanation: "O fato é 'A mãe foi viajar'. A oração seguinte é uma interpretação, uma possível explicação (talvez não seja a única) para o fato ter acontecido." },
            { question: "Qual das frases abaixo é uma OPINIÃO?", answers: [{ text: "Aquele aluno é muito chato.", correct: true }, { text: "Aquele aluno chegou atrasado.", correct: false }, { text: "Aquele aluno estuda na 8ª série.", correct: false }, { text: "Aquele aluno usa óculos.", correct: false }], explanation: "'Chato' é um julgamento pessoal, uma opinião. As outras frases são fatos observáveis." },
            { question: "Qual das frases abaixo é um FATO?", answers: [{ text: "Acho que vai chover amanhã.", correct: false }, { text: "Tomara que não chova amanhã.", correct: false }, { text: "Que chuva desagradável!", correct: false }, { text: "Choveu ontem.", correct: true }], explanation: "Dizer que choveu ontem é um fato (aconteceu ou não aconteceu). As outras opções expressam achismo, desejo ou sentimento (opiniões)." },
            { question: "O que é uma interpretação 'subjetiva'?", answers: [{ text: "Uma análise imparcial, baseada apenas em dados.", correct: false }, { text: "Uma análise pessoal, influenciada pelas emoções e experiências de quem interpreta.", correct: true }, { text: "Uma análise que está sempre correta.", correct: false }, { text: "Uma análise que está sempre errada.", correct: false }], explanation: "Subjetivo é o contrário de objetivo. Uma interpretação subjetiva é aquela que carrega as marcas, sentimentos e opiniões de quem a faz." },
            { question: "Em qual gênero a interpretação é geralmente mais OBJETIVA (imparcial)?", answers: [{ text: "Notícia de jornal", correct: true }, { text: "Poema", correct: false }, { text: "Artigo de opinião", correct: false }, { text: "Diário pessoal", correct: false }], explanation: "Embora nem sempre 100% imparcial, a notícia busca relatar os fatos como aconteceram. Poemas, diários e artigos de opinião são, por natureza, mais subjetivos." },

            // Pronomes Relativos e Preposições (10)
            { question: "Complete a frase: 'Estes são os discos ____ eu mais gosto.'", answers: [{ text: "que", correct: false }, { text: "de que", correct: true }, { text: "onde", correct: false }, { text: "cujo", correct: false }], explanation: "Quem gosta, gosta 'DE' alguma coisa. A preposição 'de' é exigida pelo verbo 'gostar' e deve aparecer antes do pronome relativo." },
            { question: "Complete a frase: 'A casa ____ meus pais moram fica na esquina.'", answers: [{ text: "que", correct: false }, { text: "onde", correct: true }, { text: "cuja", correct: false }, { text: "a qual", correct: false }], explanation: "'Onde' é usado como pronome relativo para se referir a um lugar (a casa). É o mesmo que 'em que' (meus pais moram 'NA' casa)." },
            { question: "Complete a frase: 'A garota ____ eu me apaixonei é sua irmã.'", answers: [{ text: "que", correct: false }, { text: "a qual", correct: false }, { text: "de quem", correct: false }, { text: "por quem", correct: true }], explanation: "Quem se apaixona, se apaixona 'POR' alguém. A preposição 'por' é exigida pelo verbo 'apaixonar-se' e deve aparecer antes do pronome 'quem' (usado para pessoas)." },
            { question: "Complete a frase: 'Esse é o agasalho ____ eu preciso.'", answers: [{ text: "que", correct: false }, { text: "de que", correct: true }, { text: "o qual", correct: false }, { text: "cujo", correct: false }], explanation: "Quem precisa, precisa 'DE' algo. O verbo 'precisar' exige a preposição 'de' antes do pronome relativo." },
            { question: "O pronome relativo 'CUJO' (e suas variações) indica:", answers: [{ text: "Lugar", correct: false }, { text: "Posse (algo 'de' alguém)", correct: true }, { text: "Tempo", correct: false }, { text: "Modo", correct: false }], explanation: "'Cujo' é usado para indicar posse. Ex: 'O menino, CUJO pai é médico...' (o pai 'do' menino)." },
            { question: "Qual frase usa o pronome relativo 'onde' corretamente?", answers: [{ text: "O livro onde eu li é bom.", correct: false }, { text: "A cidade onde eu nasci é pequena.", correct: true }, { text: "O dia onde nos conhecemos foi especial.", correct: false }, { text: "A festa onde fomos foi divertida.", correct: false }], explanation: "'Onde' só pode ser usado para indicar um lugar físico (cidade, casa, rua). Nas outras frases, o correto seria 'que', 'em que' ou 'na qual'." },
            { question: "Complete a frase: 'Essas são as dúvidas ____ você convive.'", answers: [{ text: "que", correct: false }, { text: "com que", correct: true }, { text: "as quais", correct: false }, { text: "cujas", correct: false }], explanation: "Quem convive, convive 'COM' algo. A preposição 'com' é exigida pelo verbo e deve aparecer antes do pronome relativo." },
            { question: "Complete a frase: 'A mulher ____ filhos foram premiados é minha vizinha.'", answers: [{ text: "que", correct: false }, { text: "cujos", correct: true }, { text: "onde", correct: false }, { text: "quem", correct: false }], explanation: "Usamos 'cujos' para indicar posse (os filhos 'DA' mulher). Note que 'cujos' concorda com a coisa possuída ('filhos')." },
            { question: "Complete a frase: 'Cancelaram o encontro ____ você faz referência.'", answers: [{ text: "que", correct: false }, { text: "a que", correct: true }, { text: "o qual", correct: false }, { text: "onde", correct: false }], explanation: "Quem faz referência, faz referência 'A' alguma coisa. A preposição 'a' é exigida pelo nome 'referência'." },
            { question: "Complete a frase: 'Fotografei a casa. Meus pais moraram na casa.' Juntando as duas com um pronome relativo, temos:", answers: [{ text: "Fotografei a casa que meus pais moraram.", correct: false }, { text: "Fotografei a casa onde (em que) meus pais moraram.", correct: true }, { text: "Fotografei a casa cuja meus pais moraram.", correct: false }, { text: "Fotografei a casa de que meus pais moraram.", correct: false }], explanation: "Como 'casa' é um lugar, usamos 'onde' (que significa 'em que', pois eles moraram 'NA' casa)." },

            // Revisão (Orações Coordenadas e Adverbiais) (10)
            { question: "Na frase 'Ele fica falando ENQUANTO se mexe pela cozinha', a palavra 'enquanto' dá ideia de:", answers: [{ text: "Causa", correct: false }, { text: "Tempo simultâneo", correct: true }, { text: "Condição", correct: false }, { text: "Oposição", correct: false }], explanation: "'Enquanto' é uma conjunção subordinativa adverbial temporal, indicando que as duas ações (falar e se mexer) acontecem ao mesmo tempo." },
            { question: "Na frase 'Ele se desculpa: não estava em casa QUANDO eu cheguei', a palavra 'quando' dá ideia de:", answers: [{ text: "Lugar", correct: false }, { text: "Causa", correct: false }, { text: "Tempo", correct: true }, { text: "Modo", correct: false }], explanation: "'Quando' é a principal conjunção subordinativa adverbial temporal, indicando o momento em que a ação aconteceu." },
            { question: "'Ele se desculpa... PORQUE estava na Casa Museu'. A palavra 'porque' indica:", answers: [{ text: "Tempo", correct: false }, { text: "Causa (ou explicação)", correct: true }, { text: "Finalidade", correct: false }, { text: "Condição", correct: false }], explanation: "Aqui, 'porque' está introduzindo o motivo, a causa ou a explicação do porquê ele estava se desculpando (ou de não estar em casa)." },
            { question: "Na frase 'Estudou muito, mas não passou'. A conjunção 'mas' indica:", answers: [{ text: "Adição", correct: false }, { text: "Oposição (Adversativa)", correct: true }, { text: "Explicação", correct: false }, { text: "Alternância", correct: false }], explanation: "'Mas', 'porém', 'contudo' são conjunções coordenadas adversativas, pois indicam uma quebra de expectativa ou uma ideia oposta." },
            { question: "Na frase 'Ele entrou e saiu rapidamente'. A conjunção 'e' indica:", answers: [{ text: "Adição (Aditiva)", correct: true }, { text: "Oposição", correct: false }, { text: "Conclusão", correct: false }, { text: "Alternância", correct: false }], explanation: "A conjunção 'e' é a principal conjunção coordenada aditiva, usada para somar ideias ou ações." },
            { question: "Complete: 'Preciso do agasalho. _____ (ele) preciso.'", answers: [{ text: "De que", correct: true }, { text: "Que", correct: false }, { text: "Onde", correct: false }, { text: "Com que", correct: false }], explanation: "O verbo 'precisar' exige a preposição 'de' (precisar DE algo). Portanto, a preposição deve aparecer antes do pronome: 'de que'." },
            { question: "Qual o pronome relativo na frase: 'Eu também já fui criança, que nunca tinha visto a cara dele antes'?", answers: [{ text: "Eu", correct: false }, { text: "que", correct: true }, { text: "dele", correct: false }, { text: "antes", correct: false }], explanation: "O pronome relativo 'que' está retomando o termo anterior ('criança') e iniciando a oração subordinada adjetiva." },
            { question: "O que é uma Oração Coordenada ASSINDÉTICA?", answers: [{ text: "Uma oração que usa conjunção (mas, e, pois...).", correct: false }, { text: "Uma oração que NÃO usa conjunção, sendo separada por vírgula.", correct: true }, { text: "Uma oração que usa pronome relativo.", correct: false }, { text: "Uma oração que não faz sentido.", correct: false }], explanation: "O prefixo 'A-' significa 'não' ou 'sem'. 'Assindética' significa 'sem síndeto' (sem conjunção). Ex: 'Cheguei, vi, venci' (são três orações assindéticas)." },
            { question: "Qual frase abaixo é uma OPINIÃO e não um fato?", answers: [{ text: "A garota provavelmente estranhará viver com o pai.", correct: true }, { text: "A mãe foi viajar.", correct: false }, { text: "O pai tem uma profissão.", correct: false }, { text: "A garota terá a oportunidade de se aproximar do pai.", correct: false }], explanation: "A palavra 'provavelmente' indica uma suposição, uma interpretação ou opinião, e não um fato concreto." },
            { question: "Na frase 'Todos os esportistas que têm uma alimentação adequada raramente adoecem', a oração adjetiva (sem vírgula) é:", answers: [{ text: "Explicativa", correct: false }, { text: "Restritiva", correct: true }, { text: "Aditiva", correct: false }, { text: "Adversativa", correct: false }], explanation: "Sem vírgula, a oração restringe o grupo. Ela quer dizer que 'apenas' o grupo de esportistas que come bem é que raramente adoece (e não todos os esportistas)." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            
            // Verifica se a pergunta existe antes de tentar acessá-la
            if (currentQuestion && currentQuestion.question) {
                questionText.innerHTML = currentQuestion.question; 
            } else {
                questionText.innerHTML = 'Erro: Pergunta não carregada.'; 
                console.error("Erro: Pergunta indefinida no índice", currentQuestionIndex);
                return; 
            }
            
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            if (currentQuestion.answers) {
                currentQuestion.answers.forEach((answer, index) => {
                    const button = document.createElement('button');
                    button.innerHTML = answer.text;
                    button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                    if (answer.correct) button.dataset.correct = true;
                    button.addEventListener('click', selectAnswer);
                    answersContainer.appendChild(button);
                });
            } else {
                 answersContainer.innerHTML = '<p>Erro ao carregar respostas.</p>';
                 console.error("Erro: Respostas indefinidas para a pergunta no índice", currentQuestionIndex);
            }
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            questionText.innerHTML = ''; 
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando responder pergunta indefinida no índice", currentQuestionIndex);
                 return;
            }

            const correct = selectedButton.dataset.correct === 'true';
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText, 
                correctAnswer: correctAnswer ? correctAnswer.text : 'N/A', 
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true') { 
                    button.classList.add('correct');
                }
                button.disabled = true; 
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            const currentQuestion = questions[currentQuestionIndex];
            if (!currentQuestion) {
                 console.error("Erro: Tentando mostrar explicação para pergunta indefinida no índice", currentQuestionIndex);
                 showNextQuestion();
                 return;
            }

            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = currentQuestion.explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = totalQuestions > 0 ? (correctAnswersCount / totalQuestions) * 100 : 0; 

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                if (answerData.answers) {
                    answerData.answers.forEach(ans => {
                        let classList = 'review-answer';
                        let indicator = ''; 
                        if (ans.text === answerData.correctAnswer) {
                            classList += ' correct-answer-highlight';
                        }
                        if (ans.text === answerData.userAnswer) {
                            classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                            indicator = answerData.wasCorrect ? ' ✅' : ' ❌'; 
                        }
                        answersHtml += `<p class="${classList}">${ans.text}${indicator}</p>`; 
                    });
                } else {
                    answersHtml = '<p>Erro ao carregar opções.</p>';
                }

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question ? answerData.question.replace(/<br>/g, ' ') : 'Pergunta não encontrada'}</h3> 
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation || 'Explicação não disponível.'}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!allQuestions || allQuestions.length === 0) {
                 document.body.innerHTML = '<h1>Erro: Nenhuma pergunta foi carregada. Verifique o código.</h1>';
                 console.error("Erro Crítico: Array 'allQuestions' está vazia ou indefinida.");
                 return;
            }
            showScreen('start');
        });

    </script>
</body>
</html>
