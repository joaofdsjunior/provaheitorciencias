<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Inglês - 5º Ano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #3b82f6; /* Azul */
            --theme-dark: #2563eb;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #60a5fa; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        /* Estilos da tela de revisão */
        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #e0e7ff; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>English Quiz!</h1>
            <p>Let's practice Adjectives! Each correct answer is worth 10 points.</p>
            <input type="text" id="player-name" placeholder="Type your name">
            <br>
            <button onclick="startGame()" class="btn-primary">Start!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Question 1 / 40</div>
                <div id="score">Score: 0</div>
                <div id="correct-answers">Correct: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">See Explanation</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Next Question</button>
        </div>

        <div id="results-screen">
            <h1>Game Over!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Your final score is:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Play Again</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // Comparative
            { question: "A giraffe is _______ than a goat.", answers: [{ text: "tall", correct: false }, { text: "taller", correct: true }, { text: "the tallest", correct: false }, { text: "as tall as", correct: false }], explanation: "Para comparar a altura de duas coisas, usamos o comparativo. Adicionamos '-er' ao adjetivo curto 'tall'." },
            { question: "This summer is _______ than last summer.", answers: [{ text: "hot", correct: false }, { text: "hotter", correct: true }, { text: "the hottest", correct: false }, { text: "as hot as", correct: false }], explanation: "Para adjetivos curtos como 'hot' (consoante-vogal-consoante), dobramos a última letra e adicionamos '-er' para comparar." },
            { question: "History is _______ for me than Math.", answers: [{ text: "more difficult", correct: true }, { text: "difficult", correct: false }, { text: "the most difficult", correct: false }, { text: "difficulter", correct: false }], explanation: "Para adjetivos longos como 'difficult', usamos 'more' antes da palavra para fazer uma comparação." },
            { question: "My new shoes are _______ than my old ones.", answers: [{ text: "more comfortable", correct: true }, { text: "comfortabler", correct: false }, { text: "the most comfortable", correct: false }, { text: "comfortable", correct: false }], explanation: "'Comfortable' é um adjetivo longo, então usamos 'more' para comparar dois itens." },
            { question: "Is a car _______ than a bicycle?", answers: [{ text: "expensive", correct: false }, { text: "more expensive", correct: true }, { text: "the most expensive", correct: false }, { text: "expensiver", correct: false }], explanation: "Para comparar o preço de duas coisas com um adjetivo longo como 'expensive', usamos 'more'." },
            { question: "This puppy is _______ than that one.", answers: [{ text: "small", correct: false }, { text: "smaller", correct: true }, { text: "the smallest", correct: false }, { text: "as small as", correct: false }], explanation: "Usamos o comparativo 'smaller' para comparar o tamanho de dois filhotes." },
            { question: "A turtle is _______ than a rabbit.", answers: [{ text: "slow", correct: false }, { text: "slower", correct: true }, { text: "the slowest", correct: false }, { text: "as slow as", correct: false }], explanation: "Para comparar a velocidade de dois animais com o adjetivo 'slow', adicionamos '-er'." },
            { question: "My mom's cake is _______ than the one from the store.", answers: [{ text: "good", correct: false }, { text: "better", correct: true }, { text: "the best", correct: false }, { text: "gooder", correct: false }], explanation: "'Good' (bom) é um adjetivo irregular. Sua forma comparativa é 'better' (melhor)." },
            { question: "This test was _______ than I expected.", answers: [{ text: "bad", correct: false }, { text: "worse", correct: true }, { text: "the worst", correct: false }, { text: "badder", correct: false }], explanation: "'Bad' (ruim) é um adjetivo irregular. A forma comparativa correta é 'worse' (pior)." },
            { question: "My city is _______ from the capital than your city.", answers: [{ text: "far", correct: false }, { text: "further", correct: true }, { text: "the furthest", correct: false }, { text: "farrer", correct: false }], explanation: "O comparativo de 'far' (longe) é 'further' ou 'farther' (mais longe)." },
            
            // Superlative
            { question: "Which planet is _______ to the Sun?", answers: [{ text: "close", correct: false }, { text: "closer", correct: false }, { text: "the closest", correct: true }, { text: "as close as", correct: false }], explanation: "Para encontrar o planeta que está mais perto que todos os outros, usamos o superlativo. Para adjetivos curtos como 'close', usamos 'the' e adicionamos '-est'." },
            { question: "This is _______ movie I have ever seen!", answers: [{ text: "the funniest", correct: true }, { text: "funny", correct: false }, { text: "funnier", correct: false }, { text: "more funny", correct: false }], explanation: "Para dizer que este é o filme mais engraçado de todos, usamos o superlativo. Para adjetivos terminados em '-y', como 'funny', trocamos o 'y' por 'i' e adicionamos '-est'." },
            { question: "Antarctica is _______ continent on Earth.", answers: [{ text: "cold", correct: false }, { text: "colder", correct: false }, { text: "the coldest", correct: true }, { text: "more cold", correct: false }], explanation: "Para comparar a Antártica com todos os outros continentes, usamos o superlativo 'the coldest'." },
            { question: "That was _______ pizza I've ever eaten!", answers: [{ text: "good", correct: false }, { text: "better", correct: false }, { text: "the best", correct: true }, { text: "the goodest", correct: false }], explanation: "O superlativo do adjetivo irregular 'good' (bom) é 'the best' (o melhor)." },
            { question: "What is _______ animal in the jungle?", answers: [{ text: "the most powerful", correct: true }, { text: "powerful", correct: false }, { text: "more powerful", correct: false }, { text: "powerfuller", correct: false }], explanation: "'Powerful' é um adjetivo longo. Para encontrar o animal mais poderoso de todos, usamos 'the most' antes dele." },
            { question: "My grandfather is _______ person in my family.", answers: [{ text: "old", correct: false }, { text: "older", correct: false }, { text: "the oldest", correct: true }, { text: "more old", correct: false }], explanation: "Usamos 'the oldest' para dizer que ele é a pessoa mais velha de todas na família." },
            { question: "This is _______ building in our city.", answers: [{ text: "tall", correct: false }, { text: "taller", correct: false }, { text: "the tallest", correct: true }, { text: "more tall", correct: false }], explanation: "Para encontrar o prédio mais alto de todos na cidade, usamos o superlativo 'the tallest'." },
            { question: "That was _______ day of my life.", answers: [{ text: "happy", correct: false }, { text: "happier", correct: false }, { text: "the happiest", correct: true }, { text: "more happy", correct: false }], explanation: "Para o superlativo de 'happy', trocamos o 'y' por 'i' e adicionamos '-est', formando 'the happiest'." },
            { question: "I think science is _______ subject.", answers: [{ text: "interesting", correct: false }, { text: "more interesting", correct: false }, { text: "the most interesting", correct: true }, { text: "interestinger", correct: false }], explanation: "Como 'interesting' é um adjetivo longo, usamos 'the most' para formar o superlativo." },
            { question: "This homework was _______ of all.", answers: [{ text: "bad", correct: false }, { text: "worse", correct: false }, { text: "the worst", correct: true }, { text: "the baddest", correct: false }], explanation: "O superlativo do adjetivo irregular 'bad' (ruim) é 'the worst' (o pior)." },

            // as...as
            { question: "My brother is _______ me.", answers: [{ text: "tall than", correct: false }, { text: "as tall as", correct: true }, { text: "taller", correct: false }, { text: "the tallest", correct: false }], explanation: "Para dizer que duas pessoas têm a mesma altura, usamos a comparação de igualdade 'as tall as' (tão alto quanto)." },
            { question: "This game is not _______ the other one.", answers: [{ text: "as fun as", correct: true }, { text: "funner than", correct: false }, { text: "the funnest", correct: false }, { text: "more fun", correct: false }], explanation: "Usamos 'not as...as' para dizer que algo não é igual a outra coisa em alguma característica. Ex: 'not as fun as' (não tão divertido quanto)." },
            { question: "She is _______ her sister.", answers: [{ text: "as smart as", correct: true }, { text: "smarter", correct: false }, { text: "smart than", correct: false }, { text: "the smartest", correct: false }], explanation: "Para comparar a inteligência de duas pessoas e dizer que são iguais, usamos 'as smart as'." },
            { question: "Is winter in Moscow _______ in Ottawa?", answers: [{ text: "cold", correct: false }, { text: "colder than", correct: false }, { text: "as cold as", correct: true }, { text: "the coldest", correct: false }], explanation: "A pergunta quer saber se a temperatura é igual nos dois lugares, então usamos a estrutura 'as cold as'." },
            { question: "This dress is _______ mine.", answers: [{ text: "sparkling", correct: false }, { text: "more sparkling", correct: false }, { text: "as sparkling as", correct: true }, { text: "the most sparkling", correct: false }], explanation: "Para dizer que os dois vestidos têm o mesmo brilho, usamos a comparação de igualdade 'as sparkling as'." },

            // Suffixes -ful and -less
            { question: "A story without an end is _______.", answers: [{ text: "endful", correct: false }, { text: "endless", correct: true }, { text: "ending", correct: false }, { text: "ended", correct: false }], explanation: "O sufixo '-less' significa 'sem'. Portanto, 'endless' significa 'sem fim'." },
            { question: "If you are full of care, you are very _______.", answers: [{ text: "careless", correct: false }, { text: "careful", correct: true }, { text: "caring", correct: false }, { text: "cared", correct: false }], explanation: "O sufixo '-ful' significa 'cheio de'. Alguém 'cheio de cuidado' (full of care) é 'careful'." },
            { question: "A person with no home is _______.", answers: [{ text: "homeful", correct: false }, { text: "homeless", correct: true }, { text: "homy", correct: false }, { text: "homed", correct: false }], explanation: "Usamos o sufixo '-less' para indicar a falta de algo. 'Homeless' significa 'sem casa'." },
            { question: "A machine that helps a lot is very _______.", answers: [{ text: "useless", correct: false }, { text: "useful", correct: true }, { text: "used", correct: false }, { text: "use", correct: false }], explanation: "Algo 'cheio de uso' ou 'cheio de utilidade' (full of use) é 'useful'." },
            { question: "If a night has no moon, it is a _______ night.", answers: [{ text: "moonful", correct: false }, { text: "moonless", correct: true }, { text: "moony", correct: false }, { text: "mooned", correct: false }], explanation: "Uma noite 'sem lua' (without a moon) é uma noite 'moonless'." },
            { question: "A person who has a lot of power is _______.", answers: [{ text: "powerless", correct: false }, { text: "powerful", correct: true }, { text: "powered", correct: false }, { text: "powering", correct: false }], explanation: "Alguém 'cheio de poder' (full of power) é 'powerful'." },
            { question: "A drink with no sugar is _______.", answers: [{ text: "sugarful", correct: false }, { text: "sugarless", correct: true }, { text: "sugary", correct: false }, { text: "sugared", correct: false }], explanation: "'Sugarless' significa 'sem açúcar'." },
            { question: "A child who doesn't play with anyone is _______.", answers: [{ text: "playful", correct: false }, { text: "playless", correct: true }, { text: "playing", correct: false }, { text: "played", correct: false }], explanation: "Embora 'playless' não seja uma palavra muito comum, ela segue a regra do '-less' significando 'sem brincadeira'. O oposto seria 'playful' (brincalhão)." },
            { question: "A beautiful flower is _______.", answers: [{ text: "beautiless", correct: false }, { text: "beautiful", correct: true }, { text: "beautify", correct: false }, { text: "beauties", correct: false }], explanation: "Algo 'cheio de beleza' (full of beauty) é 'beautiful'." },
            { question: "If you have no reason to be sad, your tears are _______.", answers: [{ text: "meaningful", correct: false }, { text: "meaningless", correct: true }, { text: "meant", correct: false }, { text: "meaning", correct: false }], explanation: "Algo 'sem significado' (without meaning) é 'meaningless'." },

            // Simple Past Review
            { question: "Last summer, Anna's holiday _______ great.", answers: [{ text: "is", correct: false }, { text: "was", correct: true }, { text: "be", correct: false }, { text: "were", correct: false }], explanation: "Usamos 'was' para o passado do verbo 'be' com 'holiday' (it). 'Last summer' indica que a ação está no passado." },
            { question: "She _______ sports in the mornings.", answers: [{ text: "do", correct: false }, { text: "did", correct: true }, { text: "does", correct: false }, { text: "done", correct: false }], explanation: "O passado do verbo 'do' é 'did'. A frase inteira está contando uma história no passado." },
            { question: "At weekends, they _______ to interesting places.", answers: [{ text: "drive", correct: false }, { text: "drove", correct: true }, { text: "driven", correct: false }, { text: "drives", correct: false }], explanation: "'Drive' (dirigir) é um verbo irregular, e sua forma no passado é 'drove'." },
            { question: "Anna _______ the food at the college.", answers: [{ text: "not like", correct: false }, { text: "didn't liked", correct: false }, { text: "didn't like", correct: true }, { text: "don't like", correct: false }], explanation: "Para fazer a negativa no passado, usamos o auxiliar 'didn't' e o verbo volta para sua forma normal ('like')." },
            { question: "All the students in her class _______ sorry to go home.", answers: [{ text: "is", correct: false }, { text: "was", correct: false }, { text: "were", correct: true }, { text: "be", correct: false }], explanation: "Usamos 'were' para o passado do verbo 'be' com 'students' (they). A frase está no passado." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Player 1";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Score: 0`;
            correctAnswersText.innerText = `Correct: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Question ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            const correct = selectedButton.dataset.correct === 'true';
            
            const currentQuestion = questions[currentQuestionIndex];
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            userAnswers.push({
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: correctAnswer.text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Score: ${score}`;
                correctAnswersText.innerText = `Correct: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `You answered ${correctAnswersCount} out of ${totalQuestions} questions correctly.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                    }
                    answersHtml += `<p class="${classList}">${ans.text} ${ans.text === answerData.userAnswer ? (answerData.wasCorrect ? '✅' : '❌') : ''}</p>`;
                });

                item.innerHTML = `
                    <h3>${index + 1}. ${answerData.question}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
