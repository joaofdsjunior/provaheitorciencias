<!DOCTYPE html><!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de História - Primeiro Reinado</title>
    <style>
        /* --- GERAL E TEMA ROBLOX --- */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

        :root {
            --roblox-blue: #00A2FF;
            --roblox-dark-blue: #0084cc;
            --roblox-grey: #A3A3A3;
            --roblox-light-grey: #E3E3E3;
            --roblox-dark-grey: #545454;
            --success-color: #00B06F;
            --danger-color: #FF4F4F;
            --background-color: #F2F2F2;
            
            --btn-c1: #7BBDFF; /* Azul */
            --btn-c2: #B57BFF; /* Roxo */
            --btn-c3: #FFB37B; /* Laranja */
            --btn-c4: #7BFFD9; /* Turquesa */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--roblox-dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--roblox-light-grey); text-align: center; overflow: hidden; }
        .fade-out { opacity: 0; transform: translateY(-20px); transition: opacity 0.3s ease-out, transform 0.3s ease-out; }
        .fade-in { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease-in, transform 0.4s ease-in; }
        h1, h2 { margin-bottom: 20px; color: var(--roblox-dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--roblox-blue); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--roblox-blue); color: white; border-bottom: 6px solid var(--roblox-dark-blue); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--roblox-dark-blue); }
        .btn-primary:hover { background-color: #00aeff; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--roblox-light-grey); margin-bottom: 15px; width: 100%; }
        
        /* Telas */
        #start-screen, #quiz-screen, #results-screen, #explanation-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--roblox-light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--roblox-dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #689fd9; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #9c68d9; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #d99668; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #68d9b8; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--roblox-dark-grey); background-color: var(--roblox-light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #008a58 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #cc3f3f !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        /* --- NOVOS ESTILOS PARA PRÊMIOS E COMPARTILHAMENTO --- */
        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }
        #share-notification { color: var(--success-color); font-family: 'Poppins', sans-serif; font-weight: 600; height: 20px; }
        .question-statements { font-family: 'Poppins', sans-serif; text-align: left; margin: 0 auto 1rem auto; max-width: 90%; font-size: 1rem; }

        /* --- OTIMIZAÇÃO PARA DESKTOP (TELAS MAIORES) --- */
        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- TELA INICIAL -->
        <div id="start-screen">
            <h1>Quiz de História</h1>
            <p>Teste seus conhecimentos sobre o Primeiro Reinado! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Jogar</button>
        </div>

        <!-- TELA DO QUIZ -->
        <div id="quiz-screen">
            <div id="question-container"><h2 id="question-text"></h2></div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 50</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
        </div>
        
        <!-- TELA DE EXPLICAÇÃO -->
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <!-- TELA DE RESULTADOS -->
        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--roblox-blue);"></p>
            <button onclick="shareResult()" class="btn-primary">Desafiar Amigos!</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
            <div id="share-notification"></div>
        </div>
    </div>

    <script>
        // --- BANCO DE PERGUNTAS E MENSAGENS---
        const allQuestions = [
            // Perguntas de Múltipla Escolha
            { question: "Qual foi o primeiro país a reconhecer a independência do Brasil?", answers: [{ text: "Portugal", correct: false }, { text: "Estados Unidos", correct: true }, { text: "Inglaterra", correct: false }, { text: "França", correct: false }], explanation: "Os EUA foram os primeiros a reconhecer a independência em 1824, aplicando a Doutrina Monroe." },
            { question: "Qual o nome do conflito que resultou na independência do Uruguai?", answers: [{ text: "Guerra do Paraguai", correct: false }, { text: "Confederação do Equador", correct: false }, { text: "Guerra da Cisplatina", correct: true }, { text: "Guerra dos Farrapos", correct: false }], explanation: "A Guerra da Cisplatina (1825-1828) entre Brasil e Argentina levou à criação da República do Uruguai como um estado independente." },
            { question: "A 'Noite da Agonia' está relacionada a qual evento do Primeiro Reinado?", answers: [{ text: "À abdicação de D. Pedro I.", correct: false }, { text: "À dissolução da Assembleia Constituinte.", correct: true }, { text: "À coroação do imperador.", correct: false }, { text: "À 'Noite das Garrafadas'.", correct: false }], explanation: "A 'Noite da Agonia' foi quando D. Pedro I, com apoio militar, fechou a Assembleia Constituinte de 1823 por discordar do texto que limitaria seus poderes." },
            { question: "Qual o nome do jornalista opositor a D. Pedro I cujo assassinato em 1830 agravou a crise política?", answers: [{ text: "Frei Caneca", correct: false }, { text: "José Bonifácio", correct: false }, { text: "Líbero Badaró", correct: true }, { text: "Cipriano Barata", correct: false }], explanation: "Líbero Badaró era um jornalista crítico ao governo. Seu assassinato gerou grande comoção e aumentou a impopularidade do imperador." },
            { question: "O que foi a 'Noite das Garrafadas'?", answers: [{ text: "Um confronto entre apoiadores portugueses de D. Pedro I e seus opositores brasileiros.", correct: true }, { text: "Uma festa popular para comemorar o aniversário do imperador.", correct: false }, { text: "Uma revolta de escravizados no Rio de Janeiro.", correct: false }, { text: "A celebração da vitória na Guerra da Cisplatina.", correct: false }], explanation: "A 'Noite das Garrafadas' foi um conflito de rua que expôs a forte tensão entre o 'partido brasileiro' e o 'partido português', acelerando a queda de D. Pedro I." },
            { question: "Qual a principal consequência política da abdicação de D. Pedro I?", answers: [{ text: "A proclamação da República.", correct: false }, { text: "O início do Período Regencial.", correct: true }, { text: "A volta do Brasil a ser colônia de Portugal.", correct: false }, { text: "Uma nova guerra contra a Argentina.", correct: false }], explanation: "Como o herdeiro, D. Pedro II, tinha apenas 5 anos, o Brasil passou a ser governado por regentes, dando início ao conturbado Período Regencial." },
            { question: "O que o termo 'outorgada', usado para a Constituição de 1824, significa?", answers: [{ text: "Que foi votada pelo povo.", correct: false }, { text: "Que foi imposta pelo governante.", correct: true }, { text: "Que foi copiada de outro país.", correct: false }, { text: "Que foi aprovada por uma assembleia.", correct: false }], explanation: "Uma constituição 'outorgada' é imposta pelo poder central, como fez D. Pedro I, ao contrário de uma 'promulgada', que é criada por representantes eleitos." },
            { question: "Qual o principal objetivo da Doutrina Monroe, que influenciou o reconhecimento da independência do Brasil?", answers: [{ text: "Promover o livre comércio na América.", correct: false }, { text: "Impedir a intervenção ou colonização europeia na América.", correct: true }, { text: "Criar uma aliança militar americana.", correct: false }, { text: "Estabelecer o dólar como moeda única.", correct: false }], explanation: "O lema 'A América para os americanos' era um aviso dos EUA para que as potências europeias não tentassem recolonizar ou interferir nas novas nações do continente." },
            { question: "Qual o papel da Inglaterra no reconhecimento da independência do Brasil por Portugal?", answers: [{ text: "Apoiou Portugal militarmente.", correct: false }, { text: "Mediou o acordo e forneceu o empréstimo para a indenização.", correct: true }, { text: "Lutou ao lado do Brasil.", correct: false }, { text: "Manteve-se neutra no conflito.", correct: false }], explanation: "A Inglaterra tinha interesses comerciais e, por isso, mediou o acordo, garantindo sua influência econômica sobre o Brasil através do empréstimo para pagar Portugal." },
            { question: "Qual o nome do herdeiro que D. Pedro I deixou no Brasil ao abdicar?", answers: [{ text: "D. Miguel", correct: false }, { text: "Pedro de Alcântara (futuro D. Pedro II)", correct: true }, { text: "José Bonifácio", correct: false }, { text: "D. Maria da Glória", correct: false }], explanation: "Ao abdicar, D. Pedro I deixou seu filho de apenas cinco anos, Pedro de Alcântara, como herdeiro do trono brasileiro." },
            { question: "O que o voto censitário, presente na Constituição de 1824, levava em consideração?", answers: [{ text: "A idade e o gênero da pessoa.", correct: false }, { text: "A renda da pessoa.", correct: true }, { text: "O nível de escolaridade.", correct: false }, { text: "A religião da pessoa.", correct: false }], explanation: "O voto censitário baseia-se na renda (censo). Apenas homens com uma renda mínima podiam votar, excluindo a maioria da população." },
            { question: "Frei Caneca foi um importante líder de qual revolta?", answers: [{ text: "Guerra dos Farrapos", correct: false }, { text: "Confederação do Equador", correct: true }, { text: "Revolta dos Malês", correct: false }, { text: "Inconfidência Mineira", correct: false }], explanation: "Frei Caneca foi um dos principais líderes e mártires da Confederação do Equador, movimento republicano e separatista de Pernambuco." },
            { question: "O que era o regime do Padroado no Brasil Império?", answers: [{ text: "A obrigação de todos seguirem o catolicismo.", correct: false }, { text: "O controle do Estado sobre a Igreja Católica, incluindo a nomeação de bispos.", correct: true }, { text: "A separação total entre Igreja e Estado.", correct: false }, { text: "Um imposto pago à Igreja.", correct: false }], explanation: "O Padroado era um sistema em que o imperador tinha poder sobre a Igreja, como o direito de nomear bispos, tornando-a submissa ao Estado." },
            { question: "A Constituição de 1824 manteve qual estrutura social e econômica vinda do período colonial?", answers: [{ text: "A monocultura de exportação.", correct: false }, { text: "A escravidão.", correct: true }, { text: "O pacto colonial.", correct: false }, { text: "As capitanias hereditárias.", correct: false }], explanation: "Apesar da independência política, a Constituição de 1824 manteve a escravidão como base da mão de obra e da sociedade brasileira." },
            { question: "Qual nação europeia mais se beneficiou economicamente com a independência do Brasil?", answers: [{ text: "França", correct: false }, { text: "Inglaterra", correct: true }, { text: "Espanha", correct: false }, { text: "Holanda", correct: false }], explanation: "A Inglaterra se beneficiou ao assumir o papel de principal parceira comercial do Brasil e ao financiar a dívida da independência, garantindo sua influência." },
            { question: "O que D. Pedro I fez com a primeira Assembleia Constituinte de 1823?", answers: [{ text: "Aprovou a constituição proposta por ela.", correct: false }, { text: "Dissolveu-a à força.", correct: true }, { text: "Ignorou suas decisões.", correct: false }, { text: "Transformou-a em seu conselho de ministros.", correct: false }], explanation: "D. Pedro I dissolveu a Assembleia na 'Noite da Agonia' porque o projeto de constituição limitava seus poderes, especialmente o de veto." },
            { question: "Qual era o principal produto de exportação do Brasil durante o Primeiro Reinado?", answers: [{ text: "Borracha", correct: false }, { text: "Açúcar e Algodão", correct: true }, { text: "Ouro", correct: false }, { text: "Soja", correct: false }], explanation: "O café só se tornaria o principal produto mais tarde. No Primeiro Reinado, produtos como açúcar, algodão e tabaco ainda dominavam a pauta de exportação." },
            { question: "A crise de sucessão do trono português envolveu uma disputa entre D. Pedro (e sua filha) e quem?", answers: [{ text: "D. João VI", correct: false }, { text: "D. Miguel, seu irmão.", correct: true }, { text: "Carlota Joaquina, sua mãe.", correct: false }, { text: "Napoleão Bonaparte.", correct: false }], explanation: "Após a morte de D. João VI, a disputa pelo trono português se deu entre a linha de D. Pedro I (representada por sua filha D. Maria da Glória) e seu irmão absolutista, D. Miguel." },
            { question: "Qual província não aderiu à Confederação do Equador?", answers: [{ text: "Pernambuco", correct: false }, { text: "Bahia", correct: true }, { text: "Ceará", correct: false }, { text: "Paraíba", correct: false }], explanation: "A Bahia, apesar de ter tido lutas pela independência, não aderiu formalmente à Confederação do Equador, que se concentrou em Pernambuco, Paraíba, Rio Grande do Norte e Ceará." },
            { question: "Qual o nome dado ao período que se seguiu à abdicação de D. Pedro I?", answers: [{ text: "Segundo Reinado", correct: false }, { text: "Período Regencial", correct: true }, { text: "República Velha", correct: false }, { text: "Estado Novo", correct: false }], explanation: "Com a abdicação e a menoridade de D. Pedro II, o Brasil foi governado por regentes, no chamado Período Regencial (1831-1840)." },
            { question: "O Poder Moderador era inspirado em qual pensador?", answers: [{ text: "Montesquieu", correct: false }, { text: "Benjamin Constant", correct: true }, { text: "John Locke", correct: false }, { text: "Rousseau", correct: false }], explanation: "A ideia de um quarto poder, neutro e regulador, foi inspirada nas teorias do pensador franco-suíço Benjamin Constant, mas foi adaptada no Brasil de forma muito mais autoritária." },
            { question: "A indenização paga a Portugal pela independência foi de:", answers: [{ text: "100 mil libras", correct: false }, { text: "2 milhões de libras", correct: true }, { text: "500 mil libras", correct: false }, { text: "1 milhão de libras", correct: false }], explanation: "O valor acordado, sob mediação britânica, foi de 2 milhões de libras esterlinas, uma soma altíssima para a época." },
            { question: "Qual era a principal proposta da Confederação do Equador?", answers: [{ text: "Manter a monarquia, mas com mais poder para as províncias.", correct: false }, { text: "Criar uma República federalista no Nordeste.", correct: true }, { text: "Abolir a escravidão em todo o Brasil.", correct: false }, { text: "Coroar um novo imperador no lugar de D. Pedro I.", correct: false }], explanation: "O movimento era separatista e republicano, inspirado nos ideais da Revolução Pernambucana de 1817, e defendia um modelo federalista com mais autonomia para as províncias." },
            { question: "O que motivou a insatisfação popular que levou à 'Noite das Garrafadas'?", answers: [{ text: "A criação de novos impostos sobre alimentos.", correct: false }, { text: "A rivalidade entre brasileiros e portugueses, e a impopularidade do imperador.", correct: true }, { text: "A derrota do Brasil na Guerra do Paraguai.", correct: false }, { text: "A notícia da morte de D. João VI em Portugal.", correct: false }], explanation: "O evento foi o ápice da tensão entre o 'partido brasileiro', que se opunha ao imperador, e o 'partido português', que o apoiava, refletindo a crise política do final do reinado." },
            { question: "Qual das opções abaixo era uma característica do Brasil no Primeiro Reinado?", answers: [{ text: "Grande desenvolvimento industrial.", correct: false }, { text: "Economia agroexportadora baseada no trabalho escravo.", correct: true }, { text: "Intensa imigração europeia para as lavouras de café.", correct: false }, { text: "Plena democracia com participação popular.", correct: false }], explanation: "O Brasil manteve a estrutura herdada do período colonial, com uma economia focada na exportação de produtos agrícolas e totalmente dependente da mão de obra escravizada." },
            // Perguntas de Verdadeiro ou Falso
            { question: "Analise as afirmações sobre a Constituição de 1824:<br><div class='question-statements'>I - Foi promulgada pela Assembleia Constituinte, representando a vontade do povo.<br>II - Criou o Poder Moderador, que dava amplos poderes a D. Pedro I.<br>III - Estabeleceu o voto universal e secreto para todos os homens livres.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A Constituição foi outorgada (imposta) por D. Pedro I, não promulgada. O voto era censitário (baseado na renda), não universal. A única afirmação correta é a criação do Poder Moderador." },
            { question: "Sobre a Confederação do Equador, analise:<br><div class='question-statements'>I - Foi um movimento que defendia a monarquia absolutista.<br>II - Ocorreu principalmente na província de Pernambuco e vizinhas.<br>III - Um de seus principais líderes foi o religioso Frei Caneca.</div>", answers: [{ text: "Apenas a I é falsa.", correct: true }, { text: "Apenas a II é falsa.", correct: false }, { text: "Apenas a III é falsa.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "O movimento era republicano (I é falsa). Ele de fato ocorreu em Pernambuco e províncias vizinhas (II é verdadeira) e teve Frei Caneca como um de seus grandes líderes e mártires (III é verdadeira)." },
            { question: "A respeito do reconhecimento da independência do Brasil, julgue os itens:<br><div class='question-statements'>I - Portugal reconheceu a independência em troca de uma pesada indenização.<br>II - Os EUA foram o último grande país a reconhecer a soberania brasileira.<br>III - A Inglaterra teve um papel fundamental como mediadora do acordo com Portugal.</div>", answers: [{ text: "A I e a II são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "A I e a III são verdadeiras.", correct: true }, { text: "Todas são verdadeiras.", correct: false }], explanation: "Portugal de fato exigiu uma indenização (I é verdadeira), e a Inglaterra mediou o acordo (III é verdadeira). Os EUA, no entanto, foram o primeiro país a reconhecer a independência, e não o último (II é falsa)." },
            { question: "Sobre o fim do Primeiro Reinado, analise as sentenças:<br><div class='question-statements'>I - A 'Noite das Garrafadas' foi um confronto pacífico entre brasileiros e portugueses.<br>II - D. Pedro I abdicou do trono em favor de sua filha, D. Maria da Glória.<br>III - A alta impopularidade do imperador foi um fator decisivo para sua abdicação.</div>", answers: [{ text: "Apenas a III é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A 'Noite das Garrafadas' foi um confronto violento (I é falsa). D. Pedro I abdicou em favor de seu filho, Pedro de Alcântara (II é falsa). Apenas sua alta impopularidade é um fator correto (III é verdadeira)." },
            { question: "Analise as afirmações sobre a Guerra da Cisplatina:<br><div class='question-statements'>I - O Brasil saiu vitorioso e anexou o território que hoje é o Uruguai.<br>II - A guerra foi popular e aumentou o prestígio de D. Pedro I.<br>III - O conflito terminou com a independência da Província Cisplatina.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: true }, { text: "Todas são falsas.", correct: false }], explanation: "O Brasil não venceu a guerra e perdeu o território (I é falsa). A guerra foi extremamente impopular e cara, diminuindo o prestígio do imperador (II é falsa). O resultado final foi a independência do Uruguai (III é verdadeira)." },
            { question: "Sobre o Poder Moderador, julgue os itens:<br><div class='question-statements'>I - Era um poder exercido pelos senadores para fiscalizar o imperador.<br>II - Garantiu ao imperador uma autoridade acima dos outros três poderes.<br>III - Foi uma ideia original da constituição dos Estados Unidos.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a III são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "O Poder Moderador era exclusivo do imperador (I é falsa), dava a ele poder sobre os demais (II é verdadeira) e foi inspirado no pensador Benjamin Constant, não na constituição dos EUA (III é falsa)." },
            { question: "Sobre a economia do Primeiro Reinado, analise:<br><div class='question-statements'>I - O Brasil iniciou sua dívida externa neste período, com empréstimos da Inglaterra.<br>II - O principal produto de exportação já era o café, com grande produção no oeste paulista.<br>III - A Guerra da Cisplatina foi financiada com recursos próprios, sem endividamento.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A dívida externa de fato começou neste período (I é verdadeira). O café ainda não era o principal produto, e a guerra gerou mais endividamento (II e III são falsas)." },
            { question: "A respeito da sociedade no Primeiro Reinado, julgue as afirmações:<br><div class='question-statements'>I - A escravidão foi mantida como base da mão de obra.<br>II - O voto era censitário, ou seja, baseado na renda do cidadão.<br>III - As mulheres alfabetizadas conquistaram o direito ao voto.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "A I e a II são verdadeiras.", correct: true }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A escravidão foi mantida e o voto era por renda (I e II são verdadeiras). As mulheres não tinham direito ao voto, independentemente da alfabetização (III é falsa)." },
            { question: "Analise as afirmações abaixo:<br><div class='question-statements'>I - Líbero Badaró era um jornalista que apoiava fortemente o governo de D. Pedro I.<br>II - A Doutrina Monroe defendia o direito das nações europeias de intervir na América.<br>III - A Constituição de 1824 foi outorgada, e não promulgada.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a II é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: true }, { text: "Todas são falsas.", correct: false }], explanation: "Líbero Badaró era um opositor ferrenho (I é falsa). A Doutrina Monroe era contra a intervenção europeia (II é falsa). A Constituição foi imposta (outorgada), sendo a única afirmação correta (III é verdadeira)." },
            { question: "Sobre a sucessão do trono português após a morte de D. João VI, analise:<br><div class='question-statements'>I - A questão não teve nenhum impacto político ou financeiro no Brasil.<br>II - D. Pedro I, como herdeiro, envolveu-se diretamente na disputa pelo trono português.<br>III - D. Miguel, irmão de D. Pedro, abriu mão de seus direitos ao trono em favor de sua sobrinha.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a III são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "A questão teve grande impacto no Brasil (I é falsa). D. Pedro se envolveu na disputa (II é verdadeira). D. Miguel, na verdade, usurpou o trono de sua sobrinha, D. Maria da Glória (III é falsa)." },
            { question: "A respeito da 'Noite da Agonia', julgue os itens:<br><div class='question-statements'>I - Resultou na prisão de vários deputados que se opunham ao imperador.<br>II - Marcou o início da elaboração da constituição outorgada de 1824.<br>III - Ocorreu porque D. Pedro I desejava uma constituição ainda mais liberal.</div>", answers: [{ text: "A I e a II são verdadeiras.", correct: true }, { text: "Apenas a I é verdadeira.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A noite resultou na prisão de deputados (I é verdadeira) e, após a dissolução, D. Pedro nomeou um conselho para redigir a constituição que ele outorgaria (II é verdadeira). Ele a dissolveu por querer mais poder, não por ser liberal (III é falsa)." },
            { question: "Analise as afirmações sobre a elite brasileira da época:<br><div class='question-statements'>I - Era majoritariamente a favor da proclamação de uma república.<br>II - Tinha grande receio de uma revolta de escravos em larga escala, como a do Haiti.<br>III - Defendia o fim do voto censitário para ampliar a participação popular.</div>", answers: [{ text: "Apenas a II é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "Apenas a III é verdadeira.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "A elite era monarquista (I é falsa) e apoiava o voto censitário para manter seu poder (III é falsa). O grande medo de uma rebelião de escravos era real e influenciava muitas de suas decisões (II é verdadeira)." },
            { question: "Sobre o Período Regencial, que se seguiu ao Primeiro Reinado, analise:<br><div class='question-statements'>I - Começou com a abdicação de D. Pedro I em 1831.<br>II - O herdeiro do trono, D. Pedro de Alcântara, já era maior de idade.<br>III - Foi um período conhecido pela grande estabilidade política e ausência de revoltas.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "O Período Regencial de fato começa com a abdicação (I é verdadeira). No entanto, o herdeiro era menor de idade (II é falsa) e foi um dos períodos mais instáveis e cheios de revoltas da história do Brasil (III é falsa)." },
            { question: "A respeito das relações internacionais do Brasil no Primeiro Reinado, julgue:<br><div class='question-statements'>I - A Inglaterra era a principal parceira comercial e credora do Brasil.<br>II - O Brasil pagou a indenização a Portugal usando as reservas de ouro de Minas Gerais.<br>III - Os Estados Unidos reconheceram a independência do Brasil por interesses puramente ideológicos, sem visar vantagens.</div>", answers: [{ text: "Apenas a I é verdadeira.", correct: true }, { text: "A I e a III são verdadeiras.", correct: false }, { text: "Apenas a II é verdadeira.", correct: false }, { text: "Todas são verdadeiras.", correct: false }], explanation: "A Inglaterra era a grande parceira econômica (I é verdadeira). O Brasil pagou Portugal com um empréstimo inglês, não com ouro (II é falsa). Os EUA também tinham interesses em afastar a Europa e aumentar sua influência na América (III é falsa)." },
            { question: "Sobre as revoltas do período, analise as sentenças:<br><div class='question-statements'>I - A Confederação do Equador defendia um governo ainda mais centralizado no Rio de Janeiro.<br>II - A violenta repressão a essas revoltas acabou fortalecendo a imagem de D. Pedro I como um líder forte.<br>III - Frei Caneca é considerado um mártir da luta republicana e federalista no Nordeste.</div>", answers: [{ text: "Apenas a III é verdadeira.", correct: true }, { text: "A I e a II são verdadeiras.", correct: false }, { text: "A II e a III são verdadeiras.", correct: false }, { text: "Todas são falsas.", correct: false }], explanation: "A Confederação era contra a centralização (I é falsa). A repressão violenta desgastou a imagem do imperador (II é falsa). Frei Caneca, executado após a revolta, tornou-se um símbolo da resistência (III é verdadeira)." }
        ];
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?" ];

        // --- ELEMENTOS DO DOM ---
        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const shareNotification = document.getElementById('share-notification');
        
        // --- VARIÁVEIS DO JOGO ---
        let questions = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        // --- FUNÇÕES DE NAVEGAÇÃO ---
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; allScreens[screenName].classList.add('fade-in'); }

        // --- FUNÇÕES DO JOGO ---
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions];
            shuffleArray(questions);
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            questionText.innerHTML = currentQuestion.question; // Usar innerHTML para renderizar as tags <br>
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { while (answersContainer.firstChild) { answersContainer.removeChild(answersContainer.firstChild); } }

        function selectAnswer(e) {
            const selectedButton = e.target;
            const correct = selectedButton.dataset.correct === 'true';

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) button.classList.add('correct');
                button.disabled = true;
            });
            
            setTimeout(() => showExplanation(correct), 1500);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const maxScore = totalQuestions * 10;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score} / ${maxScore}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;

            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Heitor de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function shareResult() {
            const textToCopy = `Consegui ${score} pontos no Quiz de História! Tente me superar! Para jogar, peça o arquivo "quiz.html" para o Heitor.`;
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);

            shareNotification.innerText = 'Mensagem copiada!';
            setTimeout(() => {
                shareNotification.innerText = '';
            }, 2000);
        }

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
