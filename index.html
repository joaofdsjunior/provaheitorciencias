<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio República: O Lore do Brasil</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-green: #7eb344;
            --pixel-blue: #5da9d4;
            --pixel-red: #d94343;
            --pixel-brown: #795548;
            --pixel-yellow: #f4b41b;
        }

        body {
            background-color: #2c3e50;
            font-family: 'Press Start 2P', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            height: 600px;
            background-color: var(--pixel-green);
            border: 8px solid var(--pixel-brown);
            position: relative;
            display: flex;
            flex-direction: column;
            image-rendering: pixelated;
        }

        /* --- UI DE COMBATE --- */
        #battle-scene {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 40px;
            background: linear-gradient(#87CEEB 70%, #7eb344 70%);
        }

        .sprite {
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            position: relative;
        }

        #player-sprite {
            background-image: url('https://cdn-icons-png.flaticon.com/512/3408/3408545.png'); /* Avatar Retrô */
        }

        #enemy-sprite {
            background-image: url('https://cdn-icons-png.flaticon.com/512/10044/10044809.png'); /* Coronel/Monarca */
            transform: scaleX(-1);
        }

        .status-bar {
            position: absolute;
            top: -60px;
            width: 150px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border: 2px solid #fff;
        }

        .hp-bg {
            width: 100%;
            height: 15px;
            background: #444;
        }

        .hp-fill {
            height: 100%;
            background: var(--pixel-red);
            width: 100%;
            transition: width 0.5s;
        }

        /* --- ÁREA DE PERGUNTAS --- */
        #ui-box {
            height: 250px;
            background: #fff;
            border-top: 8px solid var(--pixel-brown);
            color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        #question-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            padding: 10px;
            cursor: pointer;
            border: 4px solid var(--pixel-brown);
            background: #eee;
            transition: 0.2s;
        }

        button:hover { background: var(--pixel-yellow); }

        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: var(--pixel-red);
            text-shadow: 2px 2px #000;
        }

        /* --- TELAS SOBREPOSTAS --- */
        #screen-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="timer">30</div>

        <div id="battle-scene">
            <div id="player-sprite" class="sprite">
                <div class="status-bar">
                    <div style="font-size: 8px; margin-bottom: 5px; color: #fff;">VOCÊ</div>
                    <div class="hp-bg"><div id="player-hp" class="hp-fill"></div></div>
                </div>
            </div>

            <div id="enemy-sprite" class="sprite">
                <div class="status-bar" style="right: 0;">
                    <div style="font-size: 8px; margin-bottom: 5px; color: #fff;">SISTEMA VELHO</div>
                    <div class="hp-bg"><div id="enemy-hp" class="hp-fill"></div></div>
                </div>
            </div>
        </div>

        <div id="ui-box">
            <div id="question-text">Carregando desafio...</div>
            <div class="options-grid" id="options">
                </div>
            <div id="hint-area" style="margin-top: 15px;">
                <button onclick="useHint()" id="btn-hint" style="background: var(--pixel-blue); color: #fff;">USAR DICA (5 PTS)</button>
            </div>
        </div>

        <div id="screen-overlay">
            <h1 id="overlay-title">DESAFIO REPÚBLICA</h1>
            <p id="overlay-desc">Derrote o Sistema Oligárquico com o poder do conhecimento!</p>
            <button onclick="startGame()" style="font-size: 20px; padding: 20px;">START GAME</button>
            <p style="font-size: 8px; margin-top: 20px;">Acerto: +10 pts | Com Dica: +5 pts | Erro: -5 pts</p>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "O Brasil foi o último país da América a abolir a escravidão. Quantos anos durou esse período de maus-tratos?",
                options: ["100 anos", "250 anos", "337 anos", "500 anos"],
                correct: 2,
                hint: "Ocorreu entre 1551 e 1888[cite: 28, 30, 31].",
                ref: ""
            },
            {
                q: "Por que os fazendeiros de café retiraram o apoio à Monarquia após a Lei Áurea em 1888?",
                options: ["Queriam mais impostos", "Ausência de indenização", "Apoio à Princesa Isabel", "Fim do café"],
                correct: 1,
                hint: "Eles se sentiram traídos pela quebra do patrimônio sem compensação[cite: 12, 41, 42, 43].",
                ref: "[cite: 42]"
            },
            {
                q: "Como se chamava o sistema onde o governo comprava o excedente de café para manter os preços altos?",
                options: ["Lei Áurea", "Convênio de Taubaté", "Voto de Cabresto", "Política do Café-com-Leite"],
                correct: 1,
                hint: "O governo federal comprava e estocava sacas para garantir o lucro dos cafeicultores[cite: 97].",
                ref: "[cite: 97]"
            },
            {
                q: "Na República Velha, o controle do voto pelos chefes políticos locais era conhecido como:",
                options: ["Federalismo", "Democracia Direta", "Coronelismo", "Monarquia"],
                correct: 2,
                hint: "Utilizava a troca de favores e pressão sobre os eleitores[cite: 98, 99, 100].",
                ref: "[cite: 118]"
            },
            {
                q: "Quem foi o líder messiânico da Guerra de Canudos, chamado de 'peregrino'?",
                options: ["Lampião", "Antônio Conselheiro", "João Cândido", "Padre Cícero"],
                correct: 1,
                hint: "Ele fundou o povoado de Belo Monte na Bahia[cite: 120, 127, 128].",
                ref: "[cite: 120]"
            },
            {
                q: "Qual movimento na Marinha (1910) lutou contra os castigos físicos e as chibatas?",
                options: ["Guerra de Canudos", "Revolta da Vacina", "Revolta da Chibata", "Semana de 22"],
                correct: 2,
                hint: "Liderado por João Cândido, o Almirante Negro[cite: 333, 338].",
                ref: "[cite: 338]"
            },
            {
                q: "A reforma 'Bota Abaixo' no Rio de Janeiro resultou em que fenômeno social?",
                options: ["Fim da pobreza", "Criação de favelas", "Aumento de salários", "Início do Império"],
                correct: 1,
                hint: "A demolição de cortiços expulsou os pobres para os morros[cite: 312, 313, 317].",
                ref: "[cite: 317]"
            },
            {
                q: "O 'Manifesto Antropófago' do Modernismo defendia:",
                options: ["Copiar a Europa", "Voltar ao Império", "Deglutir culturas estrangeiras", "Proibir arte gringa"],
                correct: 2,
                hint: "Criar uma arte brasileira única a partir de influências mundiais[cite: 351, 367, 369].",
                ref: "[cite: 370]"
            }
        ];

        let currentQ = 0;
        let score = 0;
        let playerHp = 100;
        let enemyHp = 100;
        let timerValue = 30;
        let timerInterval;
        let usedHint = false;

        function startGame() {
            document.getElementById('screen-overlay').classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQ >= questions.length || enemyHp <= 0) return endGame();
            
            usedHint = false;
            timerValue = 30;
            updateUI();
            
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                optionsDiv.appendChild(btn);
            });

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerValue--;
                document.getElementById('timer').innerText = timerValue;
                if (timerValue <= 0) {
                    checkAnswer(-1); // Erro por tempo
                }
            }, 1000);
        }

        function useHint() {
            if (usedHint) return;
            usedHint = true;
            alert("DICA: " + questions[currentQ].hint);
        }

        function checkAnswer(idx) {
            clearInterval(timerInterval);
            const q = questions[currentQ];
            
            if (idx === q.correct) {
                const gain = usedHint ? 5 : 10;
                score += gain;
                enemyHp -= (100 / questions.length) + 5;
                alert("BOA! Você acertou. " + q.ref);
            } else {
                score -= 5;
                playerHp -= 20;
                alert("ERROU! O sistema contra-ataca.");
            }

            currentQ++;
            if (playerHp <= 0) return endGame();
            loadQuestion();
        }

        function updateUI() {
            document.getElementById('player-hp').style.width = playerHp + "%";
            document.getElementById('enemy-hp').style.width = enemyHp + "%";
            document.getElementById('timer').innerText = timerValue;
        }

        function endGame() {
            const finalNota = (score / (questions.length * 10)) * 10;
            const notaFormatada = Math.max(0, finalNota).toFixed(2);
            const percent = ((score / (questions.length * 10)) * 100).toFixed(0);
            
            let trophy = "";
            let msg = "";

            if (notaFormatada > 9.55) {
                trophy = "🏆 OURO";
                msg = "Heitor Economista Tecnológico 2027!";
            } else if (notaFormatada >= 8) {
                trophy = "🥈 PRATA";
                msg = "Rei dos Romildos - Tá levando pau mas é bom no que faz!";
            } else if (notaFormatada >= 5) {
                trophy = "🥉 BRONZE";
                msg = "Pai da Renata - Ganhando 1500 reais por mês.";
            } else {
                trophy = "🤡";
                msg = "Véi.. porque?";
            }

            const overlay = document.getElementById('screen-overlay');
            overlay.innerHTML = `
                <h1>FIM DE JOGO</h1>
                <p style="font-size: 20px;">${trophy}</p>
                <p>${msg}</p>
                <hr style="width: 80%">
                <p>Nota: ${notaFormatada} | Acertos: ${percent}%</p>
                <button onclick="location.reload()">REENTRAR NO SERVER</button>
            `;
            overlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
