<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Institucional - Super Revisão</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap');

        :root {
            --theme-color: #0d9488; /* Teal */
            --theme-dark: #0f766e;
            --grey: #A3A3A3;
            --light-grey: #f3f4f6;
            --dark-grey: #4b5563;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --background-color: #f9fafb;
            
            --btn-c1: #60a5fa; 
            --btn-c2: #f87171;
            --btn-c3: #fbbf24;
            --btn-c4: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--background-color); color: var(--dark-grey); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .container { background-color: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 800px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); border: 5px solid var(--light-grey); text-align: center; overflow: hidden; }
        h1, h2 { margin-bottom: 20px; color: var(--dark-grey); letter-spacing: 1px; }
        h1 { font-size: 2.5rem; color: var(--theme-color); }
        h2 { font-size: 1.4rem; font-weight: 400; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        p { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1rem; margin-bottom: 25px; }
        button { font-family: 'Fredoka One', cursive; font-size: 1.1rem; padding: 15px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.1s ease-in-out; margin: 5px; text-transform: uppercase; letter-spacing: 1px; }
        button:active { transform: translateY(4px); }
        .btn-primary { background-color: var(--theme-color); color: white; border-bottom: 6px solid var(--theme-dark); }
        .btn-primary:active { box-shadow: 0 2px 0 var(--theme-dark); }
        .btn-primary:hover { background-color: #14b8a6; }
        input { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem; padding: 15px; border-radius: 12px; border: 3px solid var(--light-grey); margin-bottom: 15px; width: 100%; }
        
        #start-screen, #quiz-screen, #results-screen, #explanation-screen, #review-screen { display: none; }
        #start-screen { display: block; }
        
        #quiz-screen #question-container { background: var(--light-grey); padding: 20px; margin-bottom: 25px; border-radius: 15px; }
        .subject-tag { font-family: 'Poppins', sans-serif; font-weight: 700; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; margin-bottom: 1rem; display: inline-block; font-size: 0.8rem; }
        .historia { background-color: #8b5cf6; }
        .geografia { background-color: #3b82f6; }
        .ingles { background-color: #ef4444; }
        .ciencias { background-color: #10b981; }
        .portugues { background-color: #f59e0b; }
        .matematica { background-color: #ec4899; }

        #quiz-screen #answers-container { display: grid; grid-template-columns: 1fr; gap: 10px; }
        #answers-container button { width: 100%; min-height: 60px; color: var(--dark-grey); border: none; border-bottom-width: 6px; border-bottom-style: solid; text-transform: none; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px; }
        #answers-container button:hover { filter: brightness(1.05); }
        #answers-container button:active { border-bottom-width: 2px; }
        .btn-color-1 { background-color: var(--btn-c1); border-color: #3b82f6; }
        .btn-color-2 { background-color: var(--btn-c2); border-color: #ef4444; }
        .btn-color-3 { background-color: var(--btn-c3); border-color: #f59e0b; }
        .btn-color-4 { background-color: var(--btn-c4); border-color: #22c55e; }
        #quiz-screen #hud { display: grid; grid-template-columns: 1fr; gap: 10px; text-align: center; font-size: 1.2rem; margin-top: 20px; color: var(--dark-grey); background-color: var(--light-grey); padding: 10px; border-radius: 15px; }
        .correct { background-color: var(--success-color) !important; color: white !important; border-color: #059669 !important; }
        .incorrect { background-color: var(--danger-color) !important; color: white !important; border-color: #b91c1c !important; opacity: 0.8; }
        
        #explanation-screen { min-height: 350px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #explanation-header { font-size: 2rem; margin-bottom: 15px; }
        #explanation-text { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; max-width: 90%; margin-bottom: 25px; }
        #final-score { font-size: 3rem !important; }

        #award-container { margin: 20px 0; }
        #award-icon { font-size: 5rem; }
        #award-text { font-size: 1.8rem; margin-top: 10px; }

        #review-container { margin-top: 2rem; max-height: 60vh; overflow-y: auto; padding-right: 1rem; text-align: left;}
        .review-item { background-color: var(--light-grey); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .review-item h3 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
        .review-item p { font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .review-answer { padding: 0.5rem; border-radius: 8px; margin-bottom: 0.25rem; }
        .correct-answer-highlight { border: 3px solid var(--success-color); }
        .user-choice-correct { background-color: #d1fae5; }
        .user-choice-incorrect { background-color: #fee2e2; }
        .review-explanation { background-color: #e0e7ff; padding: 1rem; margin-top: 1rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; border-left: 5px solid var(--theme-color); }

        @keyframes correct-animation { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 20px var(--success-color); } 100% { transform: scale(1); } }
        .correct-animation { animation: correct-animation 0.5s ease-in-out; }

        @keyframes incorrect-animation { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(10px); } }
        .incorrect-animation { animation: incorrect-animation 0.4s ease; }

        @media (min-width: 768px) {
            .container { padding: 40px; }
            h1 { font-size: 3rem; }
            h2 { font-size: 1.6rem; min-height: 100px; }
            p { font-size: 1.1rem; }
            input { width: 90%; }
            #quiz-screen #answers-container { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
            #answers-container button { min-height: 70px; font-size: 1rem; }
            #quiz-screen #hud { grid-template-columns: 1fr 1fr 1fr; font-size: 1.4rem; margin-top: 30px; }
            #explanation-screen { min-height: 400px; }
            #explanation-header { font-size: 2.5rem; }
            #explanation-text { font-size: 1.2rem; }
            #final-score { font-size: 4rem !important; }
        }

    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>Quiz Institucional</h1>
            <p>Uma super revisão com todas as matérias! Cada pergunta vale 10 pontos.</p>
            <input type="text" id="player-name" placeholder="Digite seu nome">
            <br>
            <button onclick="startGame()" class="btn-primary">Começar Desafio!</button>
        </div>

        <div id="quiz-screen">
            <div id="question-container">
                <div id="subject-tag-container"></div>
                <h2 id="question-text"></h2>
            </div>
            <div id="answers-container"></div>
            <div id="hud">
                <div id="progress">Pergunta 1 / 40</div>
                <div id="score">Pontos: 0</div>
                <div id="correct-answers">Acertos: 0</div>
            </div>
            <button id="see-explanation-btn" class="btn-primary" style="display: none; margin-top: 20px;">Ver Explicação</button>
        </div>
        
        <div id="explanation-screen">
            <h2 id="explanation-header"></h2>
            <p id="explanation-text"></p>
            <button onclick="showNextQuestion()" class="btn-primary">Próxima Pergunta</button>
        </div>

        <div id="results-screen">
            <h1>Fim de Jogo!</h1>
            <h2 id="final-player-name"></h2>
            <div id="award-container">
                <div id="award-icon"></div>
                <p id="award-text"></p>
            </div>
            <p id="final-correct-answers" style="font-size: 1.5rem;"></p>
            <p>Sua pontuação final foi:</p>
            <p id="final-score" style="font-size: 4rem; color: var(--theme-color);"></p>
            <button id="review-btn" class="btn-primary">Revisar Prova</button>
            <button onclick="restartGame()" class="btn-primary">Jogar de Novo</button>
        </div>

        <div id="review-screen">
            <h1>Revisão da Prova</h1>
            <div id="review-container"></div>
            <button onclick="showResults()" class="btn-primary" style="margin-top: 20px;">Voltar aos Resultados</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            // História (7)
            { subject: "História", question: "Qual era a principal diferença entre as propostas dos Liberais e dos Conservadores no Segundo Reinado?", answers: [{ text: "Liberais queriam a República e Conservadores a Monarquia.", correct: false }, { text: "Liberais defendiam mais autonomia para as províncias, enquanto Conservadores queriam um poder mais centralizado.", correct: true }, { text: "Conservadores queriam o fim da escravidão e Liberais não.", correct: false }, { text: "Não havia nenhuma diferença real entre eles.", correct: false }], explanation: "A principal diferença teórica era o grau de centralização do poder. Liberais defendiam o federalismo (mais poder para as províncias) e Conservadores, o centralismo (mais poder para o imperador)." },
            { subject: "História", question: "Qual foi o principal produto da economia brasileira durante o Segundo Reinado?", answers: [{ text: "Açúcar", correct: false }, { text: "Ouro", correct: false }, { text: "Café", correct: true }, { text: "Algodão", correct: false }], explanation: "O café foi o 'motor' da economia brasileira no século XIX, gerando grande riqueza para a elite cafeicultora e financiando a modernização do país." },
            { subject: "História", question: "O que foi a 'Lei de Terras' de 1850?", answers: [{ text: "Uma lei que distribuía terras gratuitamente para ex-escravos e imigrantes.", correct: false }, { text: "Uma lei que determinava que as terras públicas só poderiam ser adquiridas por meio de compra.", correct: true }, { text: "Uma lei que proibia a posse de terras no Brasil.", correct: false }, { text: "Uma lei que confiscava as terras dos cafeicultores.", correct: false }], explanation: "A Lei de Terras dificultou o acesso à terra para a população pobre (incluindo imigrantes e futuros ex-escravos), pois exigia a compra. Isso garantiu que eles se tornassem mão de obra para os grandes fazendeiros." },
            { subject: "História", question: "A Guerra do Paraguai foi um conflito entre o Paraguai e qual aliança de países?", answers: [{ text: "A Tríplice Entente (França, Inglaterra e Rússia)", correct: false }, { text: "A Tríplice Aliança (Brasil, Argentina e Uruguai)", correct: true }, { text: "O Eixo (Alemanha, Itália e Japão)", correct: false }, { text: "Os Estados Unidos e o México", correct: false }], explanation: "A Tríplice Aliança foi formada por Brasil, Argentina e Uruguai para lutar contra o Paraguai, governado por Solano López." },
            { subject: "História", question: "E para o Brasil, qual foi uma importante consequência da Guerra do Paraguai?", answers: [{ text: "O exército brasileiro se enfraqueceu e perdeu prestígio.", correct: false }, { text: "O exército se fortaleceu e ganhou prestígio, passando a apoiar ideias republicanas e abolicionistas.", correct: true }, { text: "A monarquia se fortaleceu e D. Pedro II se tornou mais popular.", correct: false }, { text: "O Brasil perdeu muitos territórios.", correct: false }], explanation: "A vitória na guerra fortaleceu o Exército como instituição. Muitos militares voltaram do conflito com ideias abolicionistas e republicanas, o que contribuiu para a queda da monarquia anos depois." },
            { subject: "História", question: "Qual era a função do Poder Moderador na política do Segundo Reinado?", answers: [{ text: "Era o poder dos juízes.", correct: false }, { text: "Era um poder exclusivo de D. Pedro II, que lhe permitia intervir nos outros poderes.", correct: true }, { text: "Era o poder do povo de votar.", correct: false }, { text: "Era um poder dos militares.", correct: false }], explanation: "O Poder Moderador era a 'chave' do sistema político do Império, dando ao imperador a palavra final sobre as decisões políticas, tornando-o a figura mais poderosa do país." },
            { subject: "História", question: "Qual o principal motivo para a vinda de imigrantes europeus para o Brasil no século XIX?", answers: [{ text: "Fugir das guerras na Europa.", correct: false }, { text: "Substituir a mão de obra escrava nas lavouras de café e 'branquear' a população.", correct: true }, { text: "Conhecer as praias brasileiras.", correct: false }, { text: "Aprender a falar português.", correct: false }], explanation: "Havia dois motivos principais: a necessidade de trabalhadores para o café, diante da crise da escravidão, e um projeto racial de 'embranquecimento' da sociedade brasileira." },
            
            // Geografia (7)
            { subject: "Geografia", question: "Qual é a principal diferença entre um país desenvolvido e um subdesenvolvido?", answers: [{ text: "O tamanho do território.", correct: false }, { text: "O nível de desenvolvimento econômico, tecnológico e social.", correct: true }, { text: "O número de habitantes.", correct: false }, { text: "A quantidade de rios e florestas.", correct: false }], explanation: "Países desenvolvidos têm alta tecnologia e boa qualidade de vida. Países subdesenvolvidos geralmente dependem da agricultura e enfrentam mais problemas sociais." },
            { subject: "Na Divisão Internacional do Trabalho (DIT), qual é o papel típico dos países desenvolvidos?", answers: [{ text: "Fornecer matérias-primas e mão de obra barata.", correct: false }, { text: "Produzir e exportar produtos de alta tecnologia.", correct: true }, { text: "Depender da agricultura de subsistência.", correct: false }, { text: "Receber investimentos de países pobres.", correct: false }], explanation: "Na DIT, os países desenvolvidos (ou centrais) concentram a produção de tecnologia, o capital e o conhecimento, exportando produtos de alto valor agregado." },
            { subject: "O período da Guerra Fria (1945-1991) foi marcado por qual Ordem Mundial?", answers: [{ text: "Unipolar, com o domínio dos Estados Unidos.", correct: false }, { text: "Bipolar, com a disputa entre EUA (capitalismo) e URSS (socialismo).", correct: true }, { text: "Multipolar, com vários centros de poder.", correct: false }, { text: "Imperial, com o domínio da Inglaterra.", correct: false }], explanation: "A Ordem Bipolar foi caracterizada pela divisão do mundo em dois blocos de influência, um liderado pelos EUA e outro pela URSS, que disputavam a hegemonia global." },
            { subject: "A Austrália é um país rico, mas está no hemisfério sul geográfico. Na divisão Norte-Sul, ela pertence a qual grupo?", answers: [{ text: "Ao Sul, por sua localização.", correct: false }, { text: "Ao Norte, por seu alto desenvolvimento.", correct: true }, { text: "É um país neutro.", correct: false }, { text: "Pertence ao grupo 'Leste'.", correct: false }], explanation: "A divisão Norte-Sul é econômica, não geográfica. Como a Austrália é um país desenvolvido, ela faz parte do grupo dos países do Norte." },
            { subject: "Qual organização internacional foi criada após a Segunda Guerra Mundial para manter a paz no mundo?", answers: [{ text: "União Europeia", correct: false }, { text: "ONU (Organização das Nações Unidas)", correct: true }, { text: "G7", correct: false }, { text: "BRICS", correct: false }], explanation: "A ONU foi fundada em 1945 justamente para evitar novos conflitos mundiais, promovendo a cooperação e o diálogo entre as nações." },
            { subject: "O que são países 'emergentes' como o Brasil e a China?", answers: [{ text: "São os países mais pobres do mundo.", correct: false }, { text: "São países subdesenvolvidos com rápido crescimento industrial e econômico.", correct: true }, { text: "São os países mais ricos e desenvolvidos.", correct: false }, { text: "São países que vivem isolados do mundo.", correct: false }], explanation: "Países emergentes se destacam pelo forte crescimento de suas indústrias e economias, ganhando mais importância no cenário mundial." },
            { subject: "O que o IDH (Índice de Desenvolvimento Humano) mede?", answers: [{ text: "Apenas a riqueza de um país.", correct: false }, { text: "A qualidade de vida, considerando saúde, educação e renda.", correct: true }, { text: "O tamanho do país.", correct: false }, { text: "O nível de poluição.", correct: false }], explanation: "O IDH é um indicador mais completo que o PIB, pois avalia se a população tem uma vida longa e saudável (saúde), acesso ao conhecimento (educação) e um padrão de vida digno (renda)." },

            // Ciências (6)
            { subject: "Ciências", question: "Qual parte do Sistema Nervoso é formada pelo cérebro e pela medula espinhal?", answers: [{ text: "Sistema Nervoso Periférico", correct: false }, { text: "Sistema Nervoso Central", correct: true }, { text: "Sistema Endócrino", correct: false }, { text: "Nervos", correct: false }], explanation: "O Sistema Nervoso Central (SNC) é o 'centro de comando' do corpo, processando as informações e tomando as decisões." },
            { subject: "Qual hormônio, produzido pelo pâncreas, controla os níveis de açúcar no sangue?", answers: [{ text: "Adrenalina", correct: false }, { text: "Insulina", correct: true }, { text: "Testosterona", correct: false }, { text: "Tiroxina", correct: false }], explanation: "A insulina funciona como uma 'chave' que permite que o açúcar (glicose) entre nas células para ser usado como energia, diminuindo sua quantidade no sangue." },
            { subject: "Os neurônios se comunicam entre si em uma região chamada:", answers: [{ text: "Glândula", correct: false }, { text: "Sinapse", correct: true }, { text: "Hormônio", correct: false }, { text: "Axônio", correct: false }], explanation: "A sinapse é o espaço entre dois neurônios onde a informação passa de um para o outro, geralmente através de substâncias químicas chamadas neurotransmissores." },
            { subject: "Qual glândula é conhecida como a 'glândula mestra' do corpo, por controlar muitas outras glândulas?", answers: [{ text: "Tireoide", correct: false }, { text: "Hipófise", correct: true }, { text: "Pâncreas", correct: false }, { text: "Suprarrenal", correct: false }], explanation: "A hipófise, localizada na base do cérebro, produz hormônios que regulam o funcionamento de várias outras glândulas do sistema endócrino." },
            { subject: "O que são atos reflexos, como tirar a mão rapidamente de uma panela quente?", answers: [{ text: "Ações que pensamos muito para fazer.", correct: false }, { text: "Respostas rápidas e involuntárias controladas pela medula espinhal.", correct: true }, { text: "Ações controladas apenas pelo cérebro.", correct: false }, { text: "Movimentos que só acontecem durante o sono.", correct: false }], explanation: "O ato reflexo é um mecanismo de defesa. A medula espinhal gera uma resposta imediata para proteger o corpo, antes mesmo que o cérebro processe a informação de dor." },
            { subject: "Qual hormônio é liberado em situações de estresse ou susto, preparando o corpo para 'lutar ou fugir'?", answers: [{ text: "Insulina", correct: false }, { text: "Adrenalina", correct: true }, { text: "Melatonina", correct: false }, { text: "Glucagon", correct: false }], explanation: "A adrenalina, produzida pelas glândulas suprarrenais, acelera o coração, aumenta a pressão e nos deixa em estado de alerta para reagir a uma situação de perigo." },

            // Português (7)
            { subject: "Português", question: "Na frase 'Estudei muito, PORQUE a prova era difícil', a palavra 'porque' indica:", answers: [{ text: "Uma oposição", correct: false }, { text: "Uma explicação ou causa", correct: true }, { text: "Uma pergunta", correct: false }, { text: "Uma conclusão", correct: false }], explanation: "'Porque' junto e sem acento é usado em respostas e para dar uma explicação, podendo ser trocado por 'pois'." },
            { subject: "Português", question: "Complete a frase: 'Você não veio à festa ______?'", answers: [{ text: "por que", correct: false }, { text: "por quê", correct: true }, { text: "porque", correct: false }, { text: "porquê", correct: false }], explanation: "Usamos 'por quê' (separado e com acento) no final de uma frase interrogativa, antes do ponto de interrogação." },
            { subject: "Português", question: "Na frase 'Ele não só estudou, MAS TAMBÉM ajudou em casa', a oração é classificada como:", answers: [{ text: "Coordenada Sindética Aditiva", correct: true }, { text: "Coordenada Sindética Adversativa", correct: false }, { text: "Coordenada Sindética Explicativa", correct: false }, { text: "Coordenada Assindética", correct: false }], explanation: "A conjunção 'mas também' (assim como 'e' e 'nem') adiciona uma informação, uma ideia de soma. Por isso, é uma oração aditiva." },
            { subject: "Português", question: "Qual das frases abaixo contém uma Oração Coordenada Sindética Adversativa?", answers: [{ text: "Estude, pois a prova é amanhã.", correct: false }, { text: "Eu queria ir à praia, MAS choveu muito.", correct: true }, { text: "Ele ora estuda, ora joga videogame.", correct: false }, { text: "Penso, logo existo.", correct: false }], explanation: "A oração adversativa indica uma oposição, um contraste. Conjunções como 'mas', 'porém' e 'contudo' são usadas para isso." },
            { subject: "Português", question: "A diferença de sotaque entre um gaúcho e um baiano é um exemplo de qual tipo de variação linguística?", answers: [{ text: "Histórica", correct: false }, { text: "Regional", correct: true }, { text: "Social", correct: false }, { text: "Situacional", correct: false }], explanation: "É uma variação Regional (ou diatópica), pois está relacionada ao lugar geográfico onde os falantes vivem." },
            { subject: "Português", question: "O uso da palavra 'você', que antigamente era 'vossa mercê', é um exemplo de variação:", answers: [{ text: "Social", correct: false }, { text: "Histórica", correct: true }, { text: "Regional", correct: false }, { text: "Situacional", correct: false }], explanation: "É uma variação Histórica, pois mostra como a língua se transforma com o passar do tempo." },
            { subject: "Português", question: "Complete a frase: 'Choveu, ______ não levarei o guarda-chuva.'", answers: [{ text: "portanto", correct: false }, { text: "pois", correct: false }, { text: "mas", correct: true }, { text: "ou", correct: false }], explanation: "A segunda oração expressa uma ideia contrária à primeira, uma quebra de expectativa. A conjunção que melhor se encaixa é 'mas' (adversativa)." },

            // Matemática (6)
            { subject: "Matemática", question: "Qual é o valor de X na equação 2x + 5 = 15?", answers: [{ text: "x = 10", correct: false }, { text: "x = 5", correct: true }, { text: "x = 7.5", correct: false }, { text: "x = 20", correct: false }], explanation: "Para resolver, isolamos o X. Passamos o 5 para o outro lado subtraindo: 2x = 15 - 5, que dá 2x = 10. Depois, passamos o 2 dividindo: x = 10 / 2, que resulta em x = 5." },
            { subject: "Matemática", question: "Na equação de 2º grau x² - 5x + 6 = 0, quais são os coeficientes a, b e c?", answers: [{ text: "a=1, b=-5, c=6", correct: true }, { text: "a=0, b=5, c=6", correct: false }, { text: "a=1, b=5, c=-6", correct: false }, { text: "a=2, b=-5, c=6", correct: false }], explanation: "O coeficiente 'a' acompanha o x², o 'b' acompanha o x, e o 'c' é o termo independente. Portanto, a=1, b=-5 e c=6." },
            { subject: "Matemática", question: "Qual é o primeiro passo para resolver uma equação fracionária como (x/2) + (x/3) = 5?", answers: [{ text: "Somar os numeradores.", correct: false }, { text: "Achar o Mínimo Múltiplo Comum (MMC) dos denominadores.", correct: true }, { text: "Multiplicar os denominadores.", correct: false }, { text: "Passar o 5 para o outro lado.", correct: false }], explanation: "Para somar frações com denominadores diferentes (2 e 3), o primeiro passo é sempre calcular o MMC para igualar as bases. O MMC de 2 e 3 é 6." },
            { subject: "Matemática", question: "Dado o sistema de equações: x + y = 10 e x - y = 2. Quais são os valores de x e y?", answers: [{ text: "x = 5, y = 5", correct: false }, { text: "x = 6, y = 4", correct: true }, { text: "x = 4, y = 6", correct: false }, { text: "x = 7, y = 3", correct: false }], explanation: "Usando o método da adição, somamos as duas equações: (x+y) + (x-y) = 10+2. Isso resulta em 2x = 12, então x = 6. Substituindo em x+y=10, temos 6+y=10, então y=4." },
            { subject: "Matemática", question: "Uma equação de 2º grau é chamada de 'incompleta' quando:", answers: [{ text: "Não tem solução.", correct: false }, { text: "O coeficiente 'a' é igual a zero.", correct: false }, { text: "O coeficiente 'b' ou 'c' (ou ambos) é igual a zero.", correct: true }, { text: "O delta é negativo.", correct: false }], explanation: "Uma equação completa tem a, b e c diferentes de zero. Se o 'b' ou o 'c' for zero, ela é chamada de incompleta. Se o 'a' for zero, ela se torna uma equação de 1º grau." },
            { subject: "Matemática", question: "Qual é o valor de x na equação 3x - 7 = x + 1?", answers: [{ text: "x = 8", correct: false }, { text: "x = 4", correct: true }, { text: "x = 3", correct: false }, { text: "x = -3", correct: false }], explanation: "Primeiro, passamos tudo que tem 'x' para um lado e os números para o outro: 3x - x = 1 + 7. Isso resulta em 2x = 8. Dividindo por 2, temos x = 4." },

            // Inglês (7)
            { subject: "Inglês", question: "A giraffe is _______ than a goat.", answers: [{ text: "tall", correct: false }, { text: "taller", correct: true }, { text: "the tallest", correct: false }, { text: "as tall as", correct: false }], explanation: "Para comparar a altura de duas coisas, usamos o comparativo. Adicionamos '-er' ao adjetivo curto 'tall'." },
            { subject: "This summer is _______ than last summer.", answers: [{ text: "hot", correct: false }, { text: "hotter", correct: true }, { text: "the hottest", correct: false }, { text: "as hot as", correct: false }], explanation: "Para adjetivos curtos como 'hot' (consoante-vogal-consoante), dobramos a última letra e adicionamos '-er' para comparar." },
            { subject: "Action movies are _______ for me than comedies.", answers: [{ text: "more exciting", correct: true }, { text: "exciting", correct: false }, { text: "the most exciting", correct: false }, { text: "excitinger", correct: false }], explanation: "'Exciting' é um adjetivo longo. Para comparar, usamos 'more' antes dele." },
            { subject: "Which planet is _______ to the Sun?", answers: [{ text: "close", correct: false }, { text: "closer", correct: false }, { text: "the closest", correct: true }, { text: "as close as", correct: false }], explanation: "Para encontrar o planeta que está mais perto que todos os outros, usamos o superlativo. Para adjetivos curtos como 'close', usamos 'the' e adicionamos '-est'." },
            { subject: "This is _______ movie I have ever seen!", answers: [{ text: "the funniest", correct: true }, { text: "funny", correct: false }, { text: "funnier", correct: false }, { text: "more funny", correct: false }], explanation: "Para dizer que este é o filme mais engraçado de todos, usamos o superlativo. Para adjetivos terminados em '-y', como 'funny', trocamos o 'y' por 'i' e adicionamos '-est'." },
            { subject: "My brother is _______ me.", answers: [{ text: "tall than", correct: false }, { text: "as tall as", correct: true }, { text: "taller", correct: false }, { text: "the tallest", correct: false }], explanation: "Para dizer que duas pessoas têm a mesma altura, usamos a comparação de igualdade 'as tall as' (tão alto quanto)." },
            { subject: "A broken machine that doesn't work is _______.", answers: [{ text: "powerful", correct: false }, { text: "powerless", correct: true }, { text: "powering", correct: false }, { text: "powered", correct: false }], explanation: "Se a máquina está 'sem poder' (without power), ela está 'powerless'." }
        ];
        
        const correctFeedbacks = [ "Isso mesmo!", "Mandou bem!", "Perfeito!", "Acertou em cheio!", "É exatamente isso!", "Boa!" ];
        const incorrectFeedbacks = [ "Na trave!", "Quase lá...", "Não foi dessa vez.", "Opa!", "Essa pegou, hein?", "Continue tentando!" ];
        let questions = [];
        let userAnswers = [];
        let currentQuestionIndex;
        let score;
        let correctAnswersCount;
        let playerName;

        const allScreens = { start: document.getElementById('start-screen'), quiz: document.getElementById('quiz-screen'), results: document.getElementById('results-screen'), explanation: document.getElementById('explanation-screen'), review: document.getElementById('review-screen') };
        const playerNameInput = document.getElementById('player-name');
        const questionText = document.getElementById('question-text');
        const subjectTagContainer = document.getElementById('subject-tag-container');
        const answersContainer = document.getElementById('answers-container');
        const progressText = document.getElementById('progress');
        const scoreText = document.getElementById('score');
        const correctAnswersText = document.getElementById('correct-answers');
        const explanationHeader = document.getElementById('explanation-header');
        const explanationText = document.getElementById('explanation-text');
        const finalPlayerName = document.getElementById('final-player-name');
        const finalScoreText = document.getElementById('final-score');
        const finalCorrectAnswersText = document.getElementById('final-correct-answers');
        const awardIcon = document.getElementById('award-icon');
        const awardText = document.getElementById('award-text');
        const reviewBtn = document.getElementById('review-btn');
        const reviewContainer = document.getElementById('review-container');
        
        function showScreen(screenName) { Object.values(allScreens).forEach(screen => screen.style.display = 'none'); allScreens[screenName].style.display = 'block'; }
        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        function startGame() {
            playerName = playerNameInput.value || "Jogador";
            questions = [...allQuestions]; 
            shuffleArray(questions);
            userAnswers = [];
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            scoreText.innerText = `Pontos: 0`;
            correctAnswersText.innerText = `Acertos: 0`;
            showScreen('quiz');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            progressText.innerText = `Pergunta ${currentQuestionIndex + 1} / ${questions.length}`;
            const currentQuestion = questions[currentQuestionIndex];
            
            subjectTagContainer.innerHTML = '';
            const subjectTag = document.createElement('span');
            subjectTag.textContent = currentQuestion.subject;
            subjectTag.className = `subject-tag ${currentQuestion.subject.toLowerCase()}`;
            subjectTagContainer.appendChild(subjectTag);

            questionText.innerHTML = currentQuestion.question;
            const btnColors = ['btn-color-1', 'btn-color-2', 'btn-color-3', 'btn-color-4'];
            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.innerHTML = answer.text;
                button.classList.add('answer-btn', btnColors[index % btnColors.length]);
                if (answer.correct) button.dataset.correct = true;
                button.addEventListener('click', selectAnswer);
                answersContainer.appendChild(button);
            });
        }
        
        function resetState() { 
            document.getElementById('see-explanation-btn').style.display = 'none';
            while (answersContainer.firstChild) { 
                answersContainer.removeChild(answersContainer.firstChild); 
            } 
        }

        function selectAnswer(e) {
            const selectedButton = e.target.closest('.answer-btn');
            if (!selectedButton) return;
            const correct = selectedButton.dataset.correct === 'true';
            
            const currentQuestion = questions[currentQuestionIndex];
            const correctAnswer = currentQuestion.answers.find(ans => ans.correct);
            userAnswers.push({
                subject: currentQuestion.subject,
                question: currentQuestion.question,
                answers: currentQuestion.answers,
                userAnswer: selectedButton.innerText,
                correctAnswer: correctAnswer.text,
                wasCorrect: correct,
                explanation: currentQuestion.explanation
            });

            if (correct) {
                correctAnswersCount++;
                score += 10;
                scoreText.innerText = `Pontos: ${score}`;
                correctAnswersText.innerText = `Acertos: ${correctAnswersCount}`;
                selectedButton.classList.add('correct');
                selectedButton.classList.add('correct-animation');
            } else {
                selectedButton.classList.add('incorrect');
                 selectedButton.classList.add('incorrect-animation');
            }
            
            Array.from(answersContainer.children).forEach(button => {
                if (button.dataset.correct === 'true' && !correct) {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });
            
            const seeExplanationBtn = document.getElementById('see-explanation-btn');
            seeExplanationBtn.style.display = 'inline-block';
            seeExplanationBtn.onclick = () => showExplanation(correct);
        }

        function showExplanation(isCorrect) {
            showScreen('explanation');
            const feedbackArray = isCorrect ? correctFeedbacks : incorrectFeedbacks;
            const randomIndex = Math.floor(Math.random() * feedbackArray.length);
            explanationHeader.innerText = feedbackArray[randomIndex];
            explanationHeader.style.color = isCorrect ? 'var(--success-color)' : 'var(--danger-color)';
            explanationText.innerText = questions[currentQuestionIndex].explanation;
        }

        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showScreen('quiz');
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            showScreen('results');
            finalPlayerName.innerText = playerName;
            const totalQuestions = questions.length;
            const percentage = (correctAnswersCount / totalQuestions) * 100;

            finalScoreText.innerText = `${score}`;
            finalCorrectAnswersText.innerText = `Você acertou ${correctAnswersCount} de ${totalQuestions} perguntas.`;
            
            if (percentage === 100) {
                awardIcon.innerText = '🥇';
                awardText.innerText = 'Troféu Ursão de Ouro';
            } else if (percentage >= 80) {
                awardIcon.innerText = '🥈';
                awardText.innerText = 'Troféu Bibi dos Cães de Prata';
            } else if (percentage >= 60) {
                awardIcon.innerText = '🥉';
                awardText.innerText = 'Troféu Labubu de Bronze';
            } else {
                awardIcon.innerText = '🗑️';
                awardText.innerText = 'Parabéns, seu lixo';
            }
        }

        function showReview() {
            showScreen('review');
            reviewContainer.innerHTML = '';
            userAnswers.forEach((answerData, index) => {
                const item = document.createElement('div');
                item.classList.add('review-item');

                let answersHtml = '';
                answerData.answers.forEach(ans => {
                    let classList = 'review-answer';
                    if (ans.text === answerData.correctAnswer) {
                        classList += ' correct-answer-highlight';
                    }
                    if (ans.text === answerData.userAnswer) {
                        classList += answerData.wasCorrect ? ' user-choice-correct' : ' user-choice-incorrect';
                    }
                    answersHtml += `<p class="${classList}">${ans.text} ${ans.text === answerData.userAnswer ? (answerData.wasCorrect ? '✅' : '❌') : ''}</p>`;
                });
                
                const subjectTag = `<span class="subject-tag ${answerData.subject.toLowerCase()}">${answerData.subject}</span>`;

                item.innerHTML = `
                    <h3>${subjectTag} ${index + 1}. ${answerData.question.replace(/<br>/g, ' ')}</h3>
                    <div>${answersHtml}</div>
                    <p class="review-explanation"><strong>Explicação:</strong> ${answerData.explanation}</p>
                `;
                reviewContainer.appendChild(item);
            });
        }
        
        reviewBtn.addEventListener('click', showReview);

        function restartGame() {
            showScreen('start');
            playerNameInput.value = "";
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            showScreen('start');
        });

    </script>
</body>
</html>
