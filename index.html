<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de História do Brasil - Estilo Roblox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #E3E5E8; /* Cor de fundo similar ao Roblox */
        }
        .roblox-font {
            font-family: 'Fredoka One', cursive;
        }
        .roblox-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            border: 3px solid #D1D3D6;
            box-shadow: 0 8px 0 #B7B9BC;
        }
        .roblox-button {
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.125rem;
            color: white;
            padding: 12px 24px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .roblox-button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }
        .roblox-button-blue {
            background-color: #00A2FF;
        }
        .roblox-button-blue:hover {
            background-color: #008FE6;
        }
        .roblox-button-green {
            background-color: #00B06F;
        }
        .roblox-button-green:hover {
            background-color: #009A60;
        }
        .option-button {
            background-color: #F2F3F5;
            border: 2px solid #D1D3D6;
            color: #313338;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-weight: 700;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #B7B9BC;
        }
        .option-button:hover {
            background-color: #E9EBEE;
            border-color: #B7B9BC;
        }
        .option-button.selected {
            background-color: #00A2FF;
            border-color: #008FE6;
            color: white;
            box-shadow: 0 4px 0 #0076B3;
        }
        .option-button.correct {
            background-color: #00B06F;
            color: white;
            border-color: #009A60;
            box-shadow: 0 4px 0 #00784A;
        }
        .option-button.incorrect {
            background-color: #ED4245;
            color: white;
            border-color: #CF393C;
            box-shadow: 0 4px 0 #A82E31;
        }
        .progress-bar-container {
            background-color: #D1D3D6;
            border-radius: 9999px;
            height: 16px;
            width: 100%;
            overflow: hidden;
            border: 2px solid #B7B9BC;
        }
        .progress-bar {
            background-color: #00A2FF;
            height: 100%;
            border-radius: 9999px;
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="roblox-card w-full max-w-2xl p-6 md:p-8 text-center">
        <div id="quiz-header" class="mb-4">
             <p id="question-counter" class="roblox-font text-xl text-gray-700"></p>
             <div class="progress-bar-container mt-2">
                 <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
             </div>
        </div>
       
        <div id="quiz-content">
            <!-- Conteúdo do Quiz (Pergunta/Resultados) é inserido aqui -->
        </div>

        <div id="action-button-container" class="mt-6">
             <!-- Botão de Ação (Verificar/Próxima/Jogar Novamente) é inserido aqui -->
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Quem eram os países que formavam a Tríplice Aliança, que lutou contra o Paraguai na Guerra do Paraguai?",
                options: [
                    "Paraguai, Uruguai e Argentina",
                    "Brasil, Argentina e Uruguai",
                    "Brasil, Paraguai e Bolívia",
                    "Chile, Brasil e Argentina"
                ],
                answer: "Brasil, Argentina e Uruguai"
            },
            {
                question: "Qual evento histórico no Brasil do século XIX impulsionou a necessidade de substituir a mão de obra escravizada pela de imigrantes?",
                options: [
                    "A modernização da indústria naval pelo Barão de Mauá",
                    "A expansão das ferrovias no sul do país",
                    "O processo de abolição gradual da escravatura",
                    "O fim da Guerra do Paraguai"
                ],
                answer: "O processo de abolição gradual da escravatura"
            },
            {
                question: "Como funcionava o 'sistema de parceria' para os imigrantes que vinham ao Brasil no século XIX?",
                options: [
                    "Recebiam um salário fixo e moradia gratuita.",
                    "Era um trabalho voluntário em troca de cidadania.",
                    "Tornavam-se donos da terra assim que chegavam.",
                    "Acumulavam dívidas pela passagem e ferramentas."
                ],
                answer: "Acumulavam dívidas pela passagem e ferramentas."
            },
            {
                question: "Qual foi uma das consequências mais devastadoras da Guerra do Paraguai para o próprio Paraguai?",
                options: [
                    "Tornou-se a maior potência econômica da América do Sul.",
                    "Fortaleceu sua aliança política com a Inglaterra.",
                    "Ficou paralisado economicamente e perdeu grande parte da população.",
                    "Anexou vastos territórios que pertenciam ao Brasil e à Argentina."
                ],
                answer: "Ficou paralisado economicamente e perdeu grande parte da população."
            },
            {
                question: "A visão histórica 'revisionista' atribui a culpa pela Guerra do Paraguai principalmente a qual fator?",
                options: [
                    "Aos interesses e à influência financeira do Império Inglês.",
                    "Ao desejo expansionista do imperador D. Pedro II.",
                    "A uma disputa de fronteiras entre Argentina e Uruguai.",
                    "À necessidade de modernizar o exército brasileiro."
                ],
                answer: "Aos interesses e à influência financeira do Império Inglês."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null;

        const quizContent = document.getElementById('quiz-content');
        const actionButtonContainer = document.getElementById('action-button-container');
        const questionCounter = document.getElementById('question-counter');
        const progressBar = document.getElementById('progress-bar');

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            showQuestion();
        }

        function showQuestion() {
            selectedAnswer = null;
            const questionData = quizData[currentQuestionIndex];

            // Limpa o conteúdo anterior
            quizContent.innerHTML = '';
            actionButtonContainer.innerHTML = '';

            // Atualiza contador e barra de progresso
            questionCounter.textContent = `Questão ${currentQuestionIndex + 1} de ${quizData.length}`;
            progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;

            // Mostra a pergunta
            const questionElement = document.createElement('h2');
            questionElement.className = 'text-2xl font-bold text-gray-800 mb-6';
            questionElement.textContent = questionData.question;
            quizContent.appendChild(questionElement);

            // Mostra as opções
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'space-y-4';
            quizContent.appendChild(optionsContainer);

            questionData.options.forEach(option => {
                const optionButton = document.createElement('button');
                optionButton.className = 'option-button';
                optionButton.textContent = option;
                optionButton.onclick = () => selectOption(optionButton, option);
                optionsContainer.appendChild(optionButton);
            });

            // Cria o botão de verificar
            const verifyButton = document.createElement('button');
            verifyButton.id = 'verify-btn';
            verifyButton.className = 'roblox-button roblox-button-blue';
            verifyButton.textContent = 'Verificar';
            verifyButton.disabled = true;
            verifyButton.style.opacity = '0.5';
            verifyButton.onclick = checkAnswer;
            actionButtonContainer.appendChild(verifyButton);
        }

        function selectOption(button, option) {
            // Remove a seleção de outros botões
            document.querySelectorAll('.option-button').forEach(btn => btn.classList.remove('selected'));
            // Adiciona a seleção ao botão clicado
            button.classList.add('selected');
            selectedAnswer = option;

            const verifyButton = document.getElementById('verify-btn');
            verifyButton.disabled = false;
            verifyButton.style.opacity = '1';
        }

        function checkAnswer() {
            const questionData = quizData[currentQuestionIndex];
            const options = document.querySelectorAll('.option-button');
            
            // Desabilita os botões de opção
            options.forEach(btn => btn.disabled = true);
            
            options.forEach(btn => {
                if (btn.textContent === questionData.answer) {
                    btn.classList.add('correct');
                } else if (btn.classList.contains('selected')) {
                    btn.classList.add('incorrect');
                }
            });

            if (selectedAnswer === questionData.answer) {
                score++;
            }
            
            // Troca o botão para "Próxima"
            const actionButton = document.getElementById('verify-btn');
            actionButton.textContent = 'Próxima';
            actionButton.onclick = nextQuestion;
        }

        function nextQuestion() {
            currentQuestionIndex++;
             progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContent.innerHTML = '';
            actionButtonContainer.innerHTML = '';
            questionCounter.textContent = 'Quiz Finalizado!';

            const resultTitle = document.createElement('h2');
            resultTitle.className = 'roblox-font text-4xl text-gray-800 mb-4';
            resultTitle.textContent = 'Parabéns!';
            quizContent.appendChild(resultTitle);

            const resultText = document.createElement('p');
            resultText.className = 'text-xl text-gray-600';
            resultText.textContent = `Você acertou ${score} de ${quizData.length} perguntas!`;
            quizContent.appendChild(resultText);

            const playAgainButton = document.createElement('button');
            playAgainButton.className = 'roblox-button roblox-button-green mt-6';
            playAgainButton.textContent = 'Jogar Novamente';
            playAgainButton.onclick = startQuiz;
            actionButtonContainer.appendChild(playAgainButton);
        }

        // Inicia o quiz
        startQuiz();
    </script>
</body>
</html>
